<!-- Page shell only — no content-loading script of its own, so opening this file directly shows an
     empty nav and an empty main. Lives in demo/assets/ with the other hand-authored demo build
     pieces (CSS, JS); it's a building block for scripts/build-demo-static.js, which turns it into
     two generated outputs under demo/build/: demo.content.html (the pre-baked nav+panels, its own
     component, never opened directly) and demo.html (this shell with demo.content.html's nav+panels
     spliced in, plus ../assets/demo.js). Edit this file for structural/layout changes (header,
     page shell, footer, <head>); run `npm run demobuild` afterwards to regenerate them. The
     asset paths below are written relative to demo/build/ (where the generated pages end up), not
     relative to this file's own location in demo/assets/. -->
<!DOCTYPE html>
<html lang="en" pgs="htmlBase">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPGS reference demo</title>
    <link rel="stylesheet" href="../../dist/css/index.css">
    <link rel="stylesheet" href="../assets/demo.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- after the stylesheets so the browser starts fetching them first, and still synchronous:
         darkmode writes the theme on the html element before the first paint -->
    <script src="../../dist/javascript/index.js"></script>

    <!-- the reference examples import from "mypgs" like a real project; a browser cannot resolve a
         bare specifier on its own, so it is mapped to a module that re-exports the global the
         library already published. Must come before any type="module" script -->
    <script type="importmap">
        {
            "imports": {
                "mypgs": "../assets/mypgs-module.js"
            }
        }
    </script>
</head>

<body pgs="bodyBase bodyImg bodyText bodyHeading bodyHoverAuto">

    <!-- = HEADER -->
    <header pgs="header" pgs-option="headerCompactBigTablet">
        <div pgs="header-element blur">
            <div pgs="header-element-alwaysOn">
                <a aria-label="Logo" pgs="logo" pgs-option="logoDarkmode" href="/">
                    <img pgs="logo-image" src="../assets/logo.svg" alt="MyPGS">
                </a>
            </div>

            <div pgs="header-element-onlyFull">
                <nav pgs="menu" pgs-option="menuHorizontal " aria-label="Main menu">
                    <ul>
                        <li><a pgs="button" pgs-option="buttonTransparent buttonHeader buttonPaddingEqual" href="test.html">Test</a></li>
                    </ul>
                </nav>
                <div pgs="flexRow" pgs-option="nowrap">
                    <button pgs="button toggleDarkmode" pgs-option="buttonIcon" type="button" aria-label="Change theme">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                </div>
            </div>

            <div pgs="header-element-onlyCompact">
                <div pgs="flexRow" pgs-option="nowrap">
                    <button pgs="button toggleDarkmode" pgs-option="buttonIcon" type="button" aria-label="Change theme">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                    <div pgs="modal" pgs-option="modalContainerPGS[header]">
                        <button pgs="button modal-button modal-close" pgs-option="buttonIcon" type="button" title="menu">
                            <i pgs="icon" pgs-option="icon-hamburgerTwo" aria-hidden="true"></i>
                        </button>

                        <dialog pgs="modal-dialog" pgs-option="modalRight">
                            <div pgs="modal-dialog-content">
                                <div pgs="modal-dialog-content-scroll margin padding" pgs-option="marginNegative">
                                    <nav pgs="menu" pgs-option="menuVertical " aria-label="Main menu">
                                        <ul>
                                            <li><a pgs="button" pgs-option="buttonTransparent buttonHeader buttonPaddingEqual" href="test.html">Test</a></li>
                                        </ul>
                                    </nav>
                                </div>
                        </dialog>
                    </div>
                </div>
            </div>
        </div>
    </header>


    <!-- = PAGE -->
    <div pgs="pageShell" pgs-option="pageShellFullPage pageShellAsideScroll">
        <aside pgs="pageShell-aside containerNone" id="reference-demo-aside">

            <!-- Desktop -->
            <div pgs="flexColumn hideContainerDownBigTablet paddingBottom" pgs-option="gapElements" class="reference-demo-nav"></div>

            <!-- mobile -->
            <div pgs="flexColumn hideContainerUpBigTablet modal" pgs-option="gapElements padding2">
                <button type="button" pgs="button modal-button"> <i pgs="icon" pgs-option="icon-ellipsis"></i> Browse docs</button>

                <dialog pgs="modal-dialog" pgs-option="modalRight">
                    <div pgs="modal-dialog-content">
                        <div pgs="modal-dialog-content-header">
                            <h3><i class="fa-solid fa-book-bookmark"></i> Browse docs!</h3>
                        </div>
                        <div pgs="modal-dialog-content-scroll">
                            <div pgs="flexColumn" pgs-option="gapElements" class="reference-demo-nav"></div>
                        </div>
                    </div>
                </dialog>
            </div>
        </aside>
        <main pgs="pageShell-content marginBottom" pgs-option="marginSections" id="reference-demo-main"></main>
    </div>

    <!-- = FOOTER -->
    <footer pgs="footer">

        <section pgs="footer-top section">
            <div pgs="footer-top-content flexRow" pgs-option="column-3">
                <div pgs="footer-brand">
                    <a aria-label="Logo" pgs="logo" pgs-option="logoDarkmode" href="/">
                        <img pgs="logo-image" src="../assets/logo.svg" alt="MyPGS">
                    </a>
                    <p pgs="footer-brand-motto">Reusable frontend components.</p>
                    <button pgs="button toggleDarkmode" pgs-option="toggleDarkmodeExtended" type="button" aria-label="Change theme">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                </div>

                <div pgs="footer-content">

                </div>
                <div pgs="footer-content">

                </div>
            </div>
        </section>

        <section pgs="footer-legal section">
            <div pgs="footer-legal-content">
                <button type="button" pgs="button cookieConsent-actionOpen">Cookie preferences</button>
                <a href="">Privacy Policy</a>
                <a href="">Cookie Policy</a>
                <a href="">Termini e Condizioni</a>
                <p>© 2026 MyPgs. No rights reserved.</p>
            </div>
        </section>
    </footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
</body>

</html>
