<!DOCTYPE html>
<html lang="en" pgs="htmlBase">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPGS reference demo</title>
    <script src="../dist/javascript/index.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
     
    <link rel="stylesheet" href="../dist/css/index.css">
    <link rel="stylesheet" href="demo.css">
</head>

<body class="is-loadingOLD" pgs="bodyBase bodyImg bodyText bodyHeading">
    <header pgs="header" pgs-option="headerCompactBigTablet">
        <div pgs="header-element blur">
            <div pgs="header-element-alwaysOn">
                <a aria-label="Logo" pgs="logo" href="/">
                    <span pgs="logo-text">MyPGS</span>
                </a>
            </div>

            <div pgs="header-element-onlyFull">
                <nav pgs="menu" pgs-option="horizontal menuShort" aria-label="Main menu">
                    <ul>
                        <li><a pgs="button" pgs-option="buttonText" href="#base">Base</a></li>
                        <li><a pgs="button" pgs-option="buttonText" href="#components">Components</a></li>
                        <li><a pgs="button" pgs-option="buttonText" href="#patterns">Patterns</a></li>
                        <li><a pgs="button" pgs-option="buttonText" href="#layout">Layout</a></li>
                    </ul>
                </nav>
            </div>

            <div pgs="header-element-onlyCompact">
            </div>

            <div pgs="header-element-alwaysOnLast">
                <div pgs="flexRow nowrap">
                    <div pgs="modal" pgs-option="containerPGS[header]">
                        <button type="button" pgs="modal-button modal-close button notificationBell" pgs-option="buttonIcon" aria-label="Open notifications">
                            <i class="fa-duotone fa-solid fa-bell"></i>
                            <span pgs="notificationBell-counter"></span>
                        </button>
                    </div>
                    <button pgs="button toggleDarkmode" pgs-option="buttonIcon" type="button" aria-label="Change theme">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                </div>
            </div>

            <div pgs="header-element-hamburger modal" pgs-option="containerPGS[header]">

                <button pgs="button modal-button modal-close header-element-hamburger-button" pgs-option="buttonIcon" type="button" title="menu"></button>

                <dialog pgs="modal-dialog" pgs-option="right">
                    <div pgs="modal-dialog-content">
                        <div pgs="modal-dialog-content-header bgWhite ">
                            <p pgs="h3 margin" pgs-option="margin2"><i class="fa-solid fa-book-bookmark"></i> Browse docs!</p>
                        </div>
                        <div pgs="modal-dialog-content-scroll bgWhite paddingInline" >
                            <div pgs="flexColumn paddingInline" pgs-option="gapElements padding2" class="reference-demo-nav">

                            </div>
                        </div>
                </dialog>
            </div>
        </div>
    </header>


    <!-- landing panel: demo.js clones it into the first panel, so the demo opens on something
         that explains the library instead of on a reference -->
    <template id="reference-demo-welcome">
        <section pgs="flexColumn" pgs-option="gapSections">
            <div pgs="flexColumn" pgs-option="gapTexts">
                <h1>MyPGS</h1>
                <p>A shared frontend library for building consistent interfaces through <strong>pgs attributes</strong>, SCSS sources, UI components and reusable JavaScript behaviours. Layouts, spacing, colours, buttons, forms, alerts, menus, modals, dropdowns, suggestion search, slides and notifications are defined once and reused across projects.</p>
            </div>

            <div pgs="flexColumn" pgs-option="gapTexts">
                <h2>Three attributes</h2>
                <p>Everything is composed from tokens on three attributes, instead of from a class per variant.</p>

                <div pgs="flexColumn" pgs-option="gapTexts wrap">
                    <div pgs="box flexColumn bgPrimarySoft" pgs-option="gapTexts boxMini">
                        <strong>pgs</strong>
                        <p>What the element is: a component, a layout, a utility. Several tokens can sit together, separated by spaces.</p>
                    </div>
                    <div pgs="box flexColumn bgSecondarySoft" pgs-option="gapTexts boxMini">
                        <strong>pgs-option</strong>
                        <p>How it is configured. Some options carry a value between square brackets, such as <code>position[top left]</code>.</p>
                    </div>
                    <div pgs="box flexColumn bgTertiarySoft" pgs-option="gapTexts boxMini">
                        <strong>pgs-state</strong>
                        <p>What it is doing right now. The library writes these at runtime: <code>open</code>, <code>is-active</code>, <code>errorField</code>.</p>
                    </div>
                </div>

            </div>

            <div pgs="flexColumn" pgs-option="gapTexts">
                <h2>Getting started</h2>
                <div pgs="box bgPrimarySoft txtPrimaryStrong" pgs-option="boxMini"><code>npm install mypgs</code></div>
                <div pgs="box bgPrimarySoft txtPrimaryStrong" pgs-option="boxMini">
                    <code>
                        import "mypgs"; <br>
                        import "mypgs/style.css";
                    </code>
                </div>
                <p>The bundle initializes the registered behaviours on load. For markup added later, by JavaScript, JSX or a fetch, initialize its container with <code>pgs.init(container)</code>.</p>
            </div>

            <div pgs="flexColumn" pgs-option="gapTexts">
                <h2>How to read this demo</h2>
                <p>Every page here is generated from a single file in <code>reference/html/</code>, which is the canonical source for markup: the same file produces this panel and the matching page under <code>docs/</code>.</p>
                <p>Each page lists the tokens it uses, grouped by kind. <strong>PGS</strong> holds what you write yourself; <strong>PGS generated by JavaScript</strong> holds what the library puts in the DOM, and a leading underscore marks what you can never write by hand. <strong>Example HTML</strong> is always markup you can copy as it is.</p>
            </div>

            <div pgs="flexColumn" pgs-option="gapTexts">
                <h2>Conventions</h2>
                <ul pgs="list">
                    <li>Prefer an existing token to a new class.</li>
                    <li>Configure through <code>pgs-option</code> and custom properties before overriding a component's own layout.</li>
                    <li>Keep runtime state in <code>pgs-state</code>, never in parallel classes.</li>
                    <li>Reuse the custom properties, such as <code>--color-primary</code>, <code>--gap-elements</code> and <code>--border-radius</code>, instead of hardcoding values.</li>
                    <li>Keep project-specific work outside the library.</li>
                </ul>
            </div>
        </section>
    </template>

    <div pgs="pageShell" pgs-option="shellFullPage shellAsideScrollFlush">
        <aside pgs="pageShell-aside hideContainerDownBigTablet" id="asideScroll">
            <div pgs="flexColumn gapElements" class="reference-demo-nav"></div>
        </aside>
        <main pgs="pageShell-content marginBottom" pgs-option="marginSections" id="reference-demo-main"></main>
    </div>


    <footer pgs="footer">

            <i class="fa-solid fa-moon"></i>
        </button>

        <section pgs="footer-top section">
            <div pgs="footer-top-content flexRow" pgs-option="column-3">
                <div pgs="footer-brand">
                    <a aria-label="Logo" pgs="logo" href="/">
                        <span pgs="logo-text">MyPGS</span>
                    </a>
                    <p pgs="footer-brand-motto">Componenti frontend riutilizzabili.</p>
                </div>

                <div pgs="footer-content">
                    <h2>Reference</h2>
                    <nav aria-label="Footer menu">
                        <ul>
                            <li><a href="#base">Base</a></li>
                            <li><a href="#components">Components</a></li>
                            <li><a href="#layout">Layout</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </section>

        <section pgs="footer-legal section">

                <p><a href="">Privacy Policy</a></p>
                <p><a href="">Cookie Policy</a></p>
                <p><a href="">Termini e Condizioni</a></p>
                <p>© 2026 MyPgs. No rights reserved.</p>
            </div>
        </section>
    </footer>
    <script src="./demo.js"></script>
</body>

</html>
