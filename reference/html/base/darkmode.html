<!--
/**
 * @title Darkmode
 * @description Global light and dark theme switch. The choice is persisted in localStorage under screenIsDarkMode and re-applied to the html element as soon as the bundle is parsed, before the page paints, so a reload never flashes the wrong theme. Every control marked toggleDarkmode flips the theme and stays in sync with the others, and its inner icon is swapped between the built-in icon-moon and icon-sun glyphs automatically, so the control is never blank even with no icon set loaded; the fa-moon and fa-sun classes are still set alongside, for pages that style them. Each switch dispatches pgs:svg:changeColor on the document with detail { isDarkMode }, which is what recolours the SVG and Lottie files; see SVG colors.
 *
 * @pgs
 * - toggleDarkmode: turns a control into a theme switch; every one of them on the page reflects the same state.
 *
 * @pgs-options
 * - toggleDarkmodeExtended: writes the theme the click leads to next to the glyph, "Dark mode" while the page is light and "Light mode" while it is dark. It reads the theme from the html element rather than the glyph on the button, so it keeps working whatever icon set drew it; retitle or translate it with --darkmode-label-toDark and --darkmode-label-toLight, whose values are CSS strings, quotes included.
 *
 * @pgs-state
 * - darkmode: applied to the html and body elements while the dark theme is active, and read by the whole colour layer.
 *
 * @api
 * - pgs.darkmode.init(root): initializes the switches within the specified root, and re-applies the stored theme.
 *
 * @related
 * - flex: provides the flex layout; direction and spacing are flags in its bracket.
 * - button: presents the switch as a button.
 * - buttonIcon: presents the switch as an icon-only button.
 * - flexColumn: stacks the example and its notes vertically.
 * - gapTexts: spaces the example content.
 * - lightmode: pins a subtree to the light scheme, ignoring this switch; see General.
 * - darkmode: pins a subtree to the dark scheme, ignoring this switch; see General.
 * - icon: marks the element the switch draws its glyph on; the library sets icon-moon or icon-sun on it, so it needs no option of your own.
 *
 * @return A theme switch, with the event and the storage key it drives.
 */
-->

<demo demo-h2="Examples"></demo>
<demo demo-h3="Theme switch" demo-description="The icon is swapped by the library, so author it as fa-moon and leave it alone. Several switches can coexist: they all read and write the same stored value."></demo>
<div pgs="flex['flexColumn' 'gapTexts']" demo="component">

    <button pgs="button['buttonIcon'] toggleDarkmode" type="button" aria-label="Change theme">
        <i pgs="icon"></i>
    </button>

    <script type="text/x-example-js">
        /* Re-run it after adding a switch to the page. */
        pgs.darkmode.init(document);

        /* Dispatched on the document at every switch, and at the initial pass on load. */
        document.addEventListener("pgs:svg:changeColor", event => console.log(event.detail.isDarkMode));

        /* The persisted choice, should you need to read it yourself. */
        localStorage.getItem("screenIsDarkMode");
    </script>
</div>

<demo demo-h3="Labelled switch" demo-description="toggleDarkmodeExtended adds the written label, so the control says where the click leads instead of relying on the glyph alone. Override --darkmode-label-toDark and --darkmode-label-toLight to write it in another language: both take a CSS string, quotes included."></demo>
<div demo="component">

    <button pgs="button toggleDarkmode['toggleDarkmodeExtended']" type="button" aria-label="Change theme">
        <i pgs="icon"></i>
    </button>

</div>
