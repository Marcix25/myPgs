<!--
/**
 * @title Heading
 * @description Heading sizes available as utilities, to give any element the look of a title without changing the document outline.
 *
 * @pgs
 * - h1: applies the first heading level size.
 * - h2: applies the second heading level size.
 * - h3: applies the third heading level size.
 * - h4: applies the fourth heading level size.
 * - h5: applies the fifth heading level size.
 *
 * @related
 * - flexColumn: stacks the examples vertically.
 * - gapTexts: spaces the examples.
 *
 * @return The five heading sizes applied to plain paragraphs, so the tag keeps its meaning while the size changes.
 */
-->

<demo demo-h2="Examples"></demo>
<demo demo-h3="Heading sizes" demo-description="The same sizes as h1 to h5, applied to paragraphs: use them when the right size and the right heading level do not match."></demo>
<div pgs="flexColumn" pgs-option="gapTexts" demo="component">
    <p pgs="h1">h1 on a paragraph</p>
    <p pgs="h2">h2 on a paragraph</p>
    <p pgs="h3">h3 on a paragraph</p>
    <p pgs="h4">h4 on a paragraph</p>
    <p pgs="h5">h5 on a paragraph</p>
</div>
