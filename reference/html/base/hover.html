<!--
/**
 * @title Hover
 * @description The shared hover treatment for a surface and the text marked inside it. It is written once here and nowhere else: the component selectors no longer repeat it, so a surface recolours on hover only while it carries this token. On load `pgs.hover` adds it on its own to the surfaces that are clickable by definition, and keeps them in sync when the markup changes: every `button`, and `card` or `box` when they are written as a link (`<a>`). Write it by hand on any other surface, and write `hoverNot` on a surface that must not react at all. The keyboard focus ring is part of the treatment and arrives with the token, so it too depends on the JavaScript being loaded.
 *
 * @pgs
 * - hover: enables the shared hover treatment on a surface.
 * - hover-text: recolours this text when the surrounding hover element is hovered.
 *
 * @pgs-option
 * - hoverNot: opts the surface out of the treatment, whatever component it is. `pgs.hover` leaves it unmarked and the surface stops answering the pointer.
 *
 * @api
 * - pgs.hover.init(root): marks the clickable surfaces inside the given root, and unmarks the ones that stopped being clickable. It runs on its own at load and on every later change, so it is only needed for markup outside the document, such as a shadow root.
 *
 * @related
 * - box: makes the example visible as a surface.
 *
 * @return A surface and its inner text, both recolouring together on hover.
 */
-->

<demo demo-h2="Examples"></demo>
<demo demo-h3="Hover" demo-description="Hovering the surface recolours it and the text marked inside it together. The token is written out here to show it: a link box already receives it at load."></demo>
<section demo="component">
    <a pgs="box hover" href="#">
        <strong pgs="hover-text">hover + hover-text</strong>
    </a>
</section>

<demo demo-h3="Hover not" demo-description="The opt-out: a surface that would be marked at load stays inert, and keeps the look it has at rest."></demo>
<section demo="component">
    <a pgs="box" pgs-option="hoverNot" href="#">
        <strong>box + hoverNot</strong>
    </a>
</section>
