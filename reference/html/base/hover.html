<!--
/**
 * @title Hover
 * @description The shared hover treatment for a surface and the text marked inside it. It is written once here and nowhere else: the component selectors no longer repeat it, so a surface recolours on hover only while it carries this token. With `bodyHoverAuto` on the page's `<body>`, `pgs.hover` adds it on its own to the surfaces that are clickable by definition, and keeps them in sync when the markup changes: every `button`, and `card` or `box` when they are written as a link (`<a>`). Without `bodyHoverAuto` nothing is marked automatically, and the token is written by hand instead — the only way to opt a surface out then is to simply not write it. `hoverNot` is for a page that does run the automatic marking and wants one surface left out of it. The keyboard focus ring is part of the treatment and arrives with the token, so it too depends on the JavaScript being loaded.
 *
 * @pgs
 * - hover: enables the shared hover treatment on a surface.
 * - hover-text: recolours this text when the surrounding hover element is hovered.
 *
 * @pgs-options
 * - hoverNot: opts the surface out of the treatment, whatever component it is. `pgs.hover` leaves it unmarked and the surface stops answering the pointer.
 *
 * @api
 * - pgs.hover.init(root): marks the clickable surfaces inside the given root, and unmarks the ones that stopped being clickable. It does nothing at all without bodyHoverAuto on the page, whether it runs on its own — at load and on every later change — or is called by hand, directly or through pgs.init(root); with bodyHoverAuto the automatic pass already covers the whole document, so a call is only needed for markup outside it, such as a shadow root.
 *
 * @related
 * - box: makes the example visible as a surface.
 * - bodyHoverAuto: activates the automatic marking this reference otherwise has to write by hand; see Html and Body.
 *
 * @return A surface and its inner text, both recolouring together on hover.
 */
-->

<demo demo-h2="Examples"></demo>
<demo demo-h3="Hover" demo-description="Hovering the surface recolours it and the text marked inside it together. The token is written out here to show it, which is what a page without bodyHoverAuto has to do on every clickable surface; the demo's own page carries bodyHoverAuto, so a link box like this one already receives it at load there."></demo>
<section demo="component">
    <a pgs="box hover" href="#">
        <strong pgs="hover-text">hover + hover-text</strong>
    </a>
</section>

<demo demo-h3="Hover not" demo-description="The opt-out: on a page with bodyHoverAuto, a surface that would otherwise be marked at load stays inert and keeps the look it has at rest."></demo>
<section demo="component">
    <a pgs="box['hoverNot']" href="#">
        <strong>box + hoverNot</strong>
    </a>
</section>
