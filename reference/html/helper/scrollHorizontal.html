<!--
/**
 * @title Scroll horizontal
 * @description Two variants that turn vertical wheel motion into horizontal scrolling over a container that can still scroll in that direction. scrollHorizontal converts any input device — mouse wheel, trackpad, Magic Mouse. scrollHorizontalWithMouse converts only a plain mouse wheel and leaves a trackpad's own two-finger swipe alone, since it already scrolls horizontally on its own; Slides uses this one internally for scrollMouse.
 *
 * @api
 * - pgs.scrollHorizontal(element, speed): attaches the wheel listener to element, scaling each wheel step by speed, and returns a function that removes the listener.
 * - pgs.scrollHorizontalWithMouse(element, speed): same as pgs.scrollHorizontal, but ignores input identified as a trackpad.
 *
 * @related
 * - flex: provides the flex layout; direction and spacing are flags in its bracket.
 * - row: lays the demo items out in a row.
 * - gapTexts: spaces them apart.
 * - overflow: adds the horizontal scrolling these examples turn the wheel into, with its ovAutoX option.
 * - ovAutoX: inside overflow's own bracket, adds scrolling only when content overflows, on the horizontal axis only.
 * - nowrap: keeps each row on one line so it actually overflows instead of wrapping.
 * - card: uses the related card component or utility in this example.
 * - card-img: uses the related card-img component or utility in this example.
 * - card-content: groups the textual content of each card.
 * - img: uses the related img component or utility in this example.
 * - cover: inside img's own bracket, crops the image to fill its box.
 *
 * @return Two horizontally-scrolling rows: one where any vertical wheel motion scrolls sideways whatever the input device, one where only a mouse wheel does and a trackpad scrolls it natively.
 */
-->

<demo demo-h2="Examples"></demo>
<demo demo-h3="Any input device" demo-description="pgs.scrollHorizontal converts a mouse wheel, a trackpad, or a Magic Mouse alike."></demo>
<div pgs="flex['row' 'gapTexts' 'nowrap'] overflow['ovAutoX']" id="pgsScrollDemo" demo="component codeNone">
    <article pgs="card" style="flex-shrink: 0; min-width: 180px;">
        <img pgs="card-img img['cover']" src="../assets/img/placeholder.jpg" alt="Slide 1">
        <div pgs="card-content">
            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
        </div>
    </article>

    <article pgs="card" style="flex-shrink: 0; min-width: 180px;">
        <img pgs="card-img img['cover']" src="../assets/img/placeholder.jpg" alt="Slide 2">
        <div pgs="card-content">
            <p>Sed do eiusmod tempor incididunt ut labore et dolore.</p>
        </div>
    </article>

    <article pgs="card" style="flex-shrink: 0; min-width: 180px;">
        <img pgs="card-img img['cover']" src="../assets/img/placeholder.jpg" alt="Slide 3">
        <div pgs="card-content">
            <p>Ut enim ad minim veniam, quis nostrud exercitation.</p>
        </div>
    </article>

    <article pgs="card" style="flex-shrink: 0; min-width: 180px;">
        <img pgs="card-img img['cover']" src="../assets/img/placeholder.jpg" alt="Slide 4">
        <div pgs="card-content">
            <p>Duis aute irure dolor in reprehenderit in voluptate.</p>
        </div>
    </article>
</div>

<demo demo-h3="Mouse only" demo-description="pgs.scrollHorizontalWithMouse ignores a trackpad or Magic Mouse; only a plain mouse wheel scrolls this row."></demo>
<div pgs="flex['row' 'gapTexts' 'nowrap'] overflow['ovAutoX']" id="pgsScrollWithMouseDemo" demo="component codeNone">
    <img pgs="img['cover']" src="../assets/img/placeholder.jpg" alt="Slide 1" style="flex-shrink: 0; border-radius: var(--border-radius);">
    <img pgs="img['cover']" src="../assets/img/placeholder.jpg" alt="Slide 2" style="flex-shrink: 0; border-radius: var(--border-radius);">
    <img pgs="img['cover']" src="../assets/img/placeholder.jpg" alt="Slide 3" style="flex-shrink: 0; border-radius: var(--border-radius);">
    <img pgs="img['cover']" src="../assets/img/placeholder.jpg" alt="Slide 4" style="flex-shrink: 0; border-radius: var(--border-radius);">
    <img pgs="img['cover']" src="../assets/img/placeholder.jpg" alt="Slide 5" style="flex-shrink: 0; border-radius: var(--border-radius);">
</div>

<script type="module">
    import { pgs } from "mypgs";

    pgs.scrollHorizontal(document.getElementById("pgsScrollDemo"), 5);
    pgs.scrollHorizontalWithMouse(document.getElementById("pgsScrollWithMouseDemo"), 5);
</script>
