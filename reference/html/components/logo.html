<!--
/**
 * @title Logo
 * @description Component for displaying a graphical or text logo, with image variants that support dark mode.
 *
 * @pgs
 * - logo: identifies the brand link container.
 * - logo-image: identifies the graphical logo image.
 * - logo-text: identifies the text-based brand variant.
 *
 * @pgs-options
 * - logoDarkmode: inverts the logo image when the global darkmode state is active.
 * - logoDarkmodeFixed: keeps the image inversion enabled regardless of the current theme.
 * - logoFooter: the big logo of a footer's brand column: --logo-height becomes 200px with the image in a square box, and --logo-textSize 4rem.
 *
 * @pgs-state
 * - darkmode: global document state that activates the darkmode variant.
 *
 * @return HTML examples of the graphical logo, the same logo inverted in dark mode, the text logo, the always-inverted logo and the big footer logo.
 */
-->

<demo demo-h2="Examples"></demo>
<demo demo-h3="Graphical logo" demo-description="Image-based brand logo, shown as it is in both themes."></demo>
<section demo="component">
    <a aria-label="Logo" pgs="logo" href="/">
        <img pgs="logo-image" src="../assets/img/logo.svg" alt="MyPGS">
    </a>
</section>

<demo demo-h3="Dark mode logo" demo-description="The same logo with logoDarkmode: it inverts automatically when dark mode is active."></demo>
<section demo="component">
    <a aria-label="Logo" pgs="logo['logoDarkmode']" href="/">
        <img pgs="logo-image" src="../assets/img/logo.svg" alt="MyPGS">
    </a>
</section>

<demo demo-h3="Text logo" demo-description="Text-based brand variant, used when no logo image is available."></demo>
<section demo="component">
    <a aria-label="Text logo" pgs="logo" href="/">
        <span pgs="logo-text">MyPGS</span>
    </a>
</section>

<demo demo-h3="Always-inverted logo" demo-description="Image-based brand logo that stays inverted using logoDarkmodeFixed, regardless of the current theme."></demo>
<section demo="component">
    <a aria-label="Logo" pgs="logo['logoDarkmodeFixed']" href="/">
        <img pgs="logo-image" src="../assets/img/logo.svg" alt="MyPGS">
    </a>
</section>

<demo demo-h3="Footer logo (logoFooter)" demo-description="logoFooter makes the logo big, for the brand column of a footer: the image 200px tall in a square box, the text at 4rem."></demo>
<section demo="component">
    <a aria-label="Logo" pgs="logo['logoFooter']" href="/">
        <img pgs="logo-image" src="../assets/img/logo.svg" alt="MyPGS">
    </a>
</section>
