<!--
/**
 * @title Modal
 * @description Modal markup, configuration, behavior, and usage example.
 *
 * @pgs
 * - modal: identifies the modal element used by Modal.
 * - modal-button: identifies the modal-button element used by Modal.
 * - modal-dialog-content: identifies the modal-dialog-content element used by Modal.
 * - modal-dialog-content-header: identifies the modal-dialog-content-header element used by Modal.
 * - modal-dialog-content-scroll: identifies the modal-dialog-content-scroll element used by Modal.
 * - modal-close: identifies the modal-close element used by Modal.
 *
 * @pgs-generated
 * - dialog: added to the dialog element on initialization, alongside modal-dialog.
 * - modal-dialog: added to the dialog element on initialization, which is why the example writes a bare dialog tag.
 *
 * @pgs-option
 * - modalContainerID: identifies the modalContainerID element used by Modal.
 * - modalContainerPGS: identifies the modalContainerPGS element used by Modal.
 * - modalDisableBackdropClose: identifies the modalDisableBackdropClose element used by Modal.
 * - modalHistory: identifies the modalHistory element used by Modal.
 * - modalTopLevel: identifies the modalTopLevel element used by Modal.
 * - modalLeft: identifies the modalLeft element used by Modal.
 * - modalRight: identifies the modalRight element used by Modal.
 *
 * @api
 * - pgs.modal.init(root): initializes matching elements within the specified root.
 * - pgs.modal.api(element): returns the instance associated with the specified initialized element.
 * - instance.open(): opens the component.
 * - instance.close(): closes the component.
 * - instance.toggle(): toggles the component state.
 * - instance.refresh(): refreshes the component and returns its updated instance.
 * - instance.isOpen(): returns true when the component is open.
 *
 * @related
 * - button: uses the related button component or utility in this example.
 * - flexColumn: vertically organizes modal content.
 * - gapElements: applies element spacing to modal content.
 * - flexRow: arranges the dialog actions in a row.
 * - justifyEnd: pushes the dialog actions to the end of that row.
 * - buttonStrong: applies stronger emphasis to the save action.
 * - icon: draws the cross inside the generated close button; see Icon for the whole set.
 * - icon-close: the glyph in that button.
 *
 * @return Complete HTML markup and usage example for Modal.
 */
-->

<div pgs="modal" pgs-option="modalContainerID[modal-container]" demo="component" demo-title="Standard modal" demo-description="Basic modal dialog centered in the page; the close button is added automatically when missing.">
    <button pgs="modal-button button" type="button">
 Open modal
    </button>

    <dialog>
        <div pgs="modal-dialog-content">
            <div pgs="modal-dialog-content-header">
                <h3>Example modal</h3>
            </div>

            <div pgs="modal-dialog-content-scroll">
                <p>Modal content. The close button is added automatically when missing.</p>
            </div>
        </div>
    </dialog>
</div>

<div pgs="modal" pgs-option="modalContainerID[modal-container]" demo="component" demo-title="Right-side modal" demo-description="Modal dialog sliding in from the right using pgs-option=&quot;modalRight&quot;.">
    <button pgs="modal-button button" type="button">
 Open modal right
    </button>

    <dialog pgs-option="modalRight">
        <div pgs="modal-dialog-content">
            <div pgs="modal-dialog-content-header">
                <h3>Side modal</h3>
            </div>

            <div pgs="modal-dialog-content-scroll">
                <p>Modal content with <code>pgs-option="modalRight"</code>.</p>
            </div>
        </div>
    </dialog>
</div>

<div pgs="modal" pgs-option="modalContainerID[modal-container]" demo="component" demo-title="Left-side modal" demo-description="Modal dialog sliding in from the left using pgs-option=&quot;modalLeft&quot;.">
    <button pgs="modal-button button" type="button">
 Open modal left
    </button>

    <dialog pgs-option="modalLeft">
        <div pgs="modal-dialog-content">
            <div pgs="modal-dialog-content-header">
                <h3>Left-side modal</h3>
            </div>

            <div pgs="modal-dialog-content-scroll">
                <p>Modal content with <code>pgs-option="modalLeft"</code>.</p>
            </div>
        </div>
    </dialog>
</div>

<div pgs="modal" demo="component" demo-title="Confirmation modal" demo-description="Top-level confirmation dialog with cancel and save actions, using pgs-option=&quot;modalTopLevel&quot; and buttonStrong for the primary action.">
    <button pgs="modal-button button" type="button">
 Confirmation salvataggio
    </button>

    <dialog pgs-option="modalTopLevel">
        <div pgs="modal-dialog-content">
            <div pgs="modal-dialog-content-header">
                <h3>Save changes?</h3>
            </div>

            <div pgs="modal-dialog-content-scroll flexColumn gapElements">
                <p>You have unsaved changes. Confirm to apply them or cancel to return to the page.</p>

                <div pgs="flexRow" pgs-option="justifyEnd">
                    <button pgs="button modal-close" type="button">Cancel</button>
                    <button pgs="button" pgs-option="buttonStrong" type="button">Save changes</button>
                </div>
            </div>
        </div>
    </dialog>
</div>

<div id="modal-container"></div>
