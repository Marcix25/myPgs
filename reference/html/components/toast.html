<!--
/**
 * @title Toast
 * @description Toast markup, configuration, behavior, and usage example. An ephemeral, auto-dismissing message shown one at a time (e.g. "saved", "error"). Split from Notification, which is a persistent, manually-dismissed panel. Full JSON field list is under @pgs-option "toast"; full JS options list is under each @api method below. The JSON form and the JS options now use the same names; the previous message, title-link, title-close and duration keys are still accepted as aliases.
 *
 * @pgs
 * - toastLoad: creates one toast from a JSON object on page load; see @pgs-option "toast" for every accepted field.
 * - toastExe: creates one toast from a JSON object each time the element is clicked; same fields as toastLoad.
 *
 * @pgs-generated
 * - toast: the container the toasts are shown in, created at the end of the body when the page has none; you may write it yourself to place it elsewhere, but leave it empty because its content is replaced at every toast.
 * - _toast-element: a single toast inside the container, replacing whatever was there before.
 * - _toast-element-content: contains the icon, title, and description.
 * - _toast-element-icon: contains the icon displayed to the left of the text.
 * - _toast-element-buttons: contains the link and dismiss actions below the content.
 * - _toast-element-buttons-delete: identifies the dismiss button generated inside that row; its label comes from the title-close field.
 *
 * @pgs-option
 * - toast: JSON object read by toastLoad/toastExe on page load or click; a new toast replaces whatever is currently shown — every field, with its accepted values and its default, is annotated in the reference below.
 *
 * @pgs-state
 * - success: identifies the success element used by Toast.
 * - error: identifies the error element used by Toast.
 * - warning: identifies the warning element used by Toast.
 * - info: identifies the info element used by Toast.
 *
 * @api
 * - pgs.toast.init(root): scans root for toastLoad and toastExe and initializes them; runs automatically on page load and again via pgs.init(root) for content added later.
 * - pgs.toast.trigger(root): alias of pgs.toast.init(root).
 * - pgs.toast.error(optionsOrTitle): a title string, or an options object — see the full field reference in the commented example below.
 * - pgs.toast.success(optionsOrTitle): a title string, or an options object — see the full field reference in the commented example below.
 * - pgs.toast.info(optionsOrTitle): a title string, or an options object — see the full field reference in the commented example below.
 * - pgs.toast.warning(optionsOrTitle): a title string, or an options object — see the full field reference in the commented example below.
 * - pgs.toast.deleteAll(): removes the currently shown toast, if any.
 *
 * @related
 * - hidden: uses the related hidden component or utility in this example.
 * - button: uses the related button component or utility in this example.
 *
 * @return Complete HTML markup and usage example for Toast.
 */
-->

<!-- <div pgs="toast" aria-live="polite"></div> -->

<div pgs="hidden toastLoad" pgs-option='
    toast[{
        "title": "Benvenuto",
        "description": "Message",
        "type": "success",
        "icon": null,
        "timeout": "3000",
        "link": null,
        "linkTitle": "Open",
        "closeTitle": "Close"
    }]
'></div>

<button pgs="button toastExe" pgs-option='toast[{
    "title": "Benvenuto",
    "description": "Message",
    "type": "success",
    "icon": null,
    "timeout": "7000",
    "link": null,
    "linkTitle": "Open",
    "closeTitle": "Close"
}]'><i class="fa-duotone fa-solid fa-bread-slice-butter"></i> Trigger Toast</button>

<script type="application/json">
toast[{
    "title": "",            // omitted falls back to the title of the type
    "description": "",      // plain text under the title; a newline becomes a line break
    "type": "info",         // error | success | warning | info, and anything else falls back to info
    "icon": null,           // HTML string; null uses the icon of the type
    "timeout": 4000,        // milliseconds before it dismisses itself; a value that is not a number is ignored
    "link": null,           // shows the link button and navigates there
    "linkTitle": "Open",    // label of the link button, only used when link is set
    "closeTitle": "Close"   // label of the dismiss button
}]
</script>

<script type="text/x-example-js">
pgs.toast.success({
    title: "",
    description: "",
    icon: null,
    timeout: 4000,
    link: null,
    linkTitle: "Open",
    closeTitle: "Close"
});
</script>
