<!--
/**
 * @title Search
 * @description Search markup, configuration, behavior, and usage example. Two custom events bubble from the search root: pgs:search:select when a suggestion is chosen (detail: element, item, index, value, input) and pgs:search:error when the source rejects (detail: element, error, query), which also adds the error state. An aborted request is not an error and dispatches nothing. The label of a suggestion is escaped, so a source can return any text. Leaving the field with Tab, or pressing outside the search, closes the list and cancels the pending debounce and the request in flight, so the list cannot open again afterwards. A search with no input[type=search] or no search-suggestions list as a direct child is left alone, with a warning in the console.
 *
 * @pgs
 * - search: identifies the search element used by Search.
 * - search-suggestions: identifies the search-suggestions element used by Search.
 *
 * @pgs-generated
 * - _search-suggestions-item: one suggestion in the list, rebuilt from the configured source at every keystroke.
 * - _search-suggestions-placeholder: shown instead of the suggestion list while the query is shorter than minLength, guiding how many more characters to type.
 * - _search-suggestions-empty: shown instead of the suggestion list when a completed search returns no items.
 *
 * @pgs-options
 * - searchMinWidth: inside search's own bracket, sets a minimum width for the field from the mobile breakpoint up, so it doesn't shrink to fit a narrow container.
 *
 * @pgs-data
 * - searchPlaceholder: overrides the placeholder message shown below minLength, as searchPlaceholder[your text]. Write {minLength} in it to insert the configured minLength; defaults to "Type at least {minLength} characters".
 * - searchNoResults: overrides the message shown when a search returns no items, as searchNoResults[your text]. Defaults to "No results found".
 * - searchIconSuggestion: overrides the markup shown before each suggestion's label, as searchIconSuggestion[your markup]. Defaults to a magnifying glass icon.
 *
 * @pgs-state
 * - open: identifies the open element used by Search.
 * - loading: identifies the loading element used by Search.
 * - error: identifies the error element used by Search.
 * - selected: identifies the selected element used by Search.
 *
 * @api
 * - pgs.search.init(root): initializes matching elements within the specified root.
 * - pgs.search.api(element): returns the instance associated with the specified initialized element.
 * - instance.configure(options): provides the documented operation through the component public API.
 * - instance.setSource(source): provides the documented operation through the component public API.
 * - instance.search(query): runs the search for the query, the current value of the input when omitted, and resolves with the items it rendered; it is what re-runs the current query.
 * - instance.open(): opens the component.
 * - instance.close(): closes the component.
 * - instance.clear(): provides the documented operation through the component public API.
 * - instance.cancel(): cancels the pending debounce and the request in flight.
 * - instance.select(index, submit): provides the documented operation through the component public API.
 * - instance.refresh(): destroys the instance and builds it again from the markup, keeping the options given to configure(), and returns the new instance; it no longer re-runs the query, search() does.
 * - instance.destroy(): cancels what is pending, empties the list, removes every listener and releases the instance; pgs.search.init(root) builds it again.
 * - instance.items(): provides the documented operation through the component public API.
 * - instance.isOpen(): returns true when the component is open.
 * - instance.isLoading(): returns true while the component is loading.
 * - instance.setActiveIndex(index): provides the documented operation through the component public API.
 *
 * @related
 * - flex: provides the flex layout; direction and spacing are flags in its bracket.
 * - button: provides the base styling for search controls.
 * - modal: uses the related modal component or utility in this example.
 * - modal-button: uses the related modal-button component or utility in this example.
 * - modal-close: uses the related modal-close component or utility in this example.
 * - modal-dialog-content: the panel drawn inside the dialog, and the element every position and width option sizes.
 * - dialogSmall: shrinks the dialog content to a third of the page width instead of filling the viewport.
 * - background: applies a background color, one of the palette below picked in its bracket.
 * - bgTransparent: inside background's own bracket, sets a fully transparent background.
 * - blur: applies a backdrop blur behind the dialog for a frosted-glass effect.
 * - row: sets the horizontal direction inside the flex bracket.
 * - section: uses the related section component or utility in this example.
 * - modalContainerPGS: identifies the modalContainerPGS element used by Search.
 * - hoverNot: disables hover behavior on the search container.
 * - btnIconOnly: presents search and close actions as icon buttons.
 * - btnTransparent: keeps the submit button flat inside the field, so only the icon shows.
 * - icon: draws the glyph at the start of every suggestion; see Icon for the whole set.
 * - icon-magnifyingGlass: the glyph used there.
 * - icon-close: the cross that dismisses.
 *
 * @return Complete HTML markup and usage example for Search.
 */
-->

<demo demo-h2="Examples"></demo>
<demo demo-h3="Inline search" demo-description="Search field with live suggestions embedded directly in the page."></demo>
<section demo="component">
    <form pgs="search" pgs-data="searchPlaceholder[Type a component name] searchNoResults[No component matches]" autocomplete="off" action="" method="get">
        <button pgs="button['btnIconOnly' 'btnTransparent']" type="submit" title="Search">
            <i pgs="icon['icon-magnifyingGlass']"></i>
        </button>
        <input type="search" name="s" placeholder="Search" value="">
        <ul pgs="search-suggestions"></ul>
    </form>
</section>

<demo demo-h3="Mobile search overlay" demo-description="Search opened from an icon button inside a small modal, intended for the mobile navigation."></demo>
<section demo="component">
    <div pgs="modal['dialogSmall']" pgs-data="modalContainerPGS[header]">

        <button type="button" pgs="modal-button button['btnIconOnly']" title="Search">
            <i pgs="icon['icon-magnifyingGlass']"></i>
        </button>

        <dialog pgs="blur">
            <div pgs="flex['row'] modal-dialog-content background['bgTransparent']">

                <form pgs="search" autocomplete="off" action="/" method="get">
                    <button pgs="button['btnIconOnly' 'btnTransparent']" type="submit" title="Search">
                        <i pgs="icon['icon-magnifyingGlass']"></i>
                    </button>

                    <input type="search" name="s" placeholder="Search" value="">
                    <ul pgs="search-suggestions"></ul>

                    <button type="button" pgs="modal-close button['btnIconOnly']">
                        <i pgs="icon['icon-close']"></i>
                    </button>
                </form>


            </div>
        </dialog>
    </div>
</section>

<script type="module">
    import { pgs } from "mypgs";

    const components = [
        { label: "Accordion", value: "/components/accordion", data: { category: "component" } },
        { label: "Dropdown", value: "/components/dropdown", data: { category: "component" } },
        { label: "Modal", value: "/components/modal", data: { category: "component" } },
        { label: "Search", value: "/components/search", data: { category: "component" } },
        { label: "Page Shell", value: "/layout/page-shell", data: { category: "layout" } },
    ];

    pgs(document).querySelectorAll("search").forEach(search => {
        pgs.search.api(search)?.configure({
            minLength: 1,
            debounce: 150,
            limit: 5,
            source: components,
            onSelect: ({ item, value }) => {
                console.log(`Selected ${item.label}: ${value}`);
            },
        });
    });
</script>
