/**
 * @title Search
 * @description Search markup, configuration, behavior, and usage example. Two custom events bubble from the search root: pgs:search:select when a suggestion is chosen (detail: element, item, index, value, input) and pgs:search:error when the source rejects (detail: element, error, query), which also adds the error state. An aborted request is not an error and dispatches nothing. The label of a suggestion is escaped, so a source can return any text. An object item can carry its own icon, as icon: markup, shown before its label in place of searchIconSuggestion; that markup is inserted as HTML, so it must be written by the author, never taken from remote text. An object item can also carry a group, as group: text: the items that follow each other with the same group get one heading over them, which the keys and the pointer skip (a source that groups its items returns them already in order, group after group, and the items with no group first: one after a group would read as part of it); the limit counts the items, not the headings. Leaving the field with Tab, or pressing outside the search, closes the list and cancels the pending debounce and the request in flight, so the list cannot open again afterwards. A search with no input[type=search] or no search-suggestions box as a direct child, or with a search-suggestions written as a list (<ul>, <ol>), is left alone, with a warning in the console. The list behaves as every listbox does (it is attached with pgs.listbox, whose controller is instance.listbox): the arrows and Page Up and Page Down move the active suggestion, stopping at the first and the last and skipping the disabled ones, Home and End stay with the text of the field, Enter chooses, Escape closes and cancels a search on its way, a click chooses, and a pointer or the focus outside the form closes it.
 *
 * @pgs
 * - search: identifies the search element used by Search. Without a submit button (a button of type submit, or with no type) the input takes --search-paddingBlock on its sides too, so the text does not touch the edges.
 * - search-suggestions: the box of the suggestions, written empty as a direct child of the form (a <div>, not a list: it holds the list), with no need to know listbox. The JavaScript gives it listbox, which alone draws it with the list and the message it builds inside (see Listbox): the search only places it and shows it while open. It is joined to the form: the form squares its corners on the side of the box, the box lies over the border of the form so the two borders are one line, it takes the state below or above, with which listbox squares its corners on that side, the focus ring of the form goes on round it, and it lies --listbox-offset under the form (over it with openUp). destroy() empties it again.
 *
 * @pgs-generated
 * - _search-suggestions-list: the list of the suggestions (role listbox), built by the JavaScript in the box; it also takes listbox-list, the part that scrolls.
 * - _search-suggestions-message: in the box under the empty list, the message in place of the suggestions (role status): how many more characters to type while the query is shorter than minLength, or nothing found when a completed search returns no items; it also takes listbox-message, which draws it.
 * - _search-suggestions-list-group: the heading over the suggestions of one group (group: in the items of the source), written whenever the group changes; it also takes listbox-list-group, which draws it, and the keys skip it.
 * - _search-suggestions-list-item: one suggestion in the list, rebuilt from the configured source at every keystroke; it also takes listbox-list-option, which draws it.
 *
 * @pgs-options
 * - searchMinWidth: inside search's own bracket, sets a minimum width for the field from the mobile breakpoint up, so it doesn't shrink to fit a narrow container.
 *
 * @pgs-data
 * - searchPlaceholder: overrides the placeholder message shown below minLength, as searchPlaceholder[your text]. Write {minLength} in it to insert the configured minLength; defaults to "Type at least {minLength} characters".
 * - searchNoResults: overrides the message shown when a search returns no items, as searchNoResults[your text]. Defaults to "No results found".
 * - searchIconSuggestion: overrides the markup shown before each suggestion's label, as searchIconSuggestion[your markup]. Defaults to a magnifying glass icon. An item with its own icon (icon: markup in the source) shows that one instead.
 *
 * @pgs-state
 * - open: identifies the open element used by Search.
 * - openUp: on an open search whose suggestions open above the form, because there is no room for them below: the box of the suggestions is joined to the top of the form, which squares its top corners instead of the bottom ones. The box itself takes the state below or above, with which listbox squares its corners on the side of the form.
 * - below: on the open box of the suggestions (search-suggestions), which lies under the form; listbox squares their top corners. See Listbox.
 * - above: on the open box of the suggestions with openUp, which lies over the form; listbox squares their bottom corners. See Listbox.
 * - loading: identifies the loading element used by Search.
 * - error: identifies the error element used by Search.
 *
 * @api
 * - pgs.search.init(root): initializes matching elements within the specified root.
 * - pgs.search.api(element): returns the instance associated with the specified initialized element.
 * - instance.configure(options): merges the options into the ones the instance already has and returns the instance.
 * - instance.setSource(source): sets the source of the results, a shortcut for configure({ source }).
 * - instance.search(query): runs the search for the query, the current value of the input when omitted, and resolves with the items it rendered; it is what re-runs the current query.
 * - instance.open(): opens the list of suggestions.
 * - instance.close(): closes the list of suggestions.
 * - instance.clear(): empties the list of suggestions, resets the active one and closes the list.
 * - instance.cancel(): cancels the pending debounce and the request in flight.
 * - instance.select(index, submit): picks the suggestion at index (the active one when omitted), writes its value in the input, closes the list, dispatches pgs:search:select and calls onSelect; submit (submitOnSelect by default) also submits the form. Returns the item, or null when there is none or it is disabled.
 * - instance.refresh(): destroys the instance and builds it again from the markup, keeping the options given to configure(), and returns the new instance; it no longer re-runs the query, search() does.
 * - instance.destroy(): cancels what is pending, empties the search-suggestions box of the list and the message it built, removes every listener and releases the instance; pgs.search.init(root) builds it again.
 * - instance.items(): returns a copy of the suggestions shown.
 * - instance.isOpen(): returns true while the list of suggestions is open.
 * - instance.isLoading(): returns true while a request is in flight.
 * - instance.setActiveIndex(index): makes the suggestion at index the active one (the one the keys are on) and points aria-activedescendant at it; -1 clears it.
 *
 * @related
 * - listbox: draws the box of the suggestions, the list and each suggestion (listbox-list, listbox-list-option); see Listbox.
 * - listbox-message: draws the message shown in place of the suggestions (too few letters, nothing found); see Listbox.
 * - flex: provides the flex layout; direction and spacing are flags in its bracket.
 * - button: provides the base styling for search controls.
 * - modal: uses the related modal component or utility in this example.
 * - modal-button: uses the related modal-button component or utility in this example.
 * - modal-close: uses the related modal-close component or utility in this example.
 * - modal-dialog-content: the panel drawn inside the dialog, and the element every position and width option sizes.
 * - dialogSmall: shrinks the dialog content to a third of the page width instead of filling the viewport.
 * - background: applies a background color, one of the palette below picked in its bracket.
 * - bgTransparent: inside background's own bracket, sets a fully transparent background.
 * - blur: applies a backdrop blur behind the dialog for a frosted-glass effect.
 * - row: sets the horizontal direction inside the flex bracket.
 * - nowrap: inside flex's own bracket, keeps the field and the button of the searchMinWidth example on one row.
 * - section: uses the related section component or utility in this example.
 * - modalContainerPGS: identifies the modalContainerPGS element used by Search.
 * - btnIconOnly: presents search and close actions as icon buttons.
 * - btnTransparent: keeps the submit button flat inside the field, so only the icon shows.
 * - icon: draws the glyph at the start of every suggestion; see Icon for the whole set.
 * - icon-magnifyingGlass: the glyph used there.
 * - icon-check: the glyph of the one item with its own icon in the example script.
 * - icon-close: the cross that dismisses.
 *
 * @return Complete HTML markup and usage example for Search.
 */

<demo demo-h2="Examples"></demo>
<demo demo-h3="Inline search" demo-description="Search field with live suggestions embedded directly in the page."></demo>
<section demo="component">
    <form pgs="search" role="search" pgs-data="searchPlaceholder[Type a component name] searchNoResults[No component matches]" autocomplete="off" action="" method="get">
        <button pgs="button['btnIconOnly' 'btnTransparent']" type="submit" title="Search">
            <i pgs="icon['icon-magnifyingGlass']"></i>
        </button>
        <input type="search" name="s" placeholder="Search" aria-label="Search" value="">
        <div pgs="search-suggestions"></div>
    </form>
</section>

<demo demo-h3="Minimum width (searchMinWidth)" demo-description="From the mobile breakpoint up the field keeps a minimum width, using pgs=&quot;search['searchMinWidth']&quot;, so it does not shrink to its placeholder inside a row that is short of room."></demo>
<section pgs="flex['row' 'nowrap']" demo="component">
    <form pgs="search['searchMinWidth']" role="search" autocomplete="off" action="" method="get">
        <button pgs="button['btnIconOnly' 'btnTransparent']" type="submit" title="Search">
            <i pgs="icon['icon-magnifyingGlass']"></i>
        </button>
        <input type="search" name="s" placeholder="Search" aria-label="Search" value="">
        <div pgs="search-suggestions"></div>
    </form>
    <button pgs="button" type="button">Filters</button>
</section>

<demo demo-h3="Mobile search overlay" demo-description="Search opened from an icon button inside a small modal, intended for the mobile navigation."></demo>
<section demo="component">
    <div pgs="modal['dialogSmall']" pgs-data="modalContainerPGS[header]">

        <button type="button" pgs="modal-button button['btnIconOnly']" title="Search">
            <i pgs="icon['icon-magnifyingGlass']"></i>
        </button>

        <dialog pgs="blur">
            <div pgs="flex['row'] modal-dialog-content background['bgTransparent']">

                <form pgs="search" role="search" autocomplete="off" action="/" method="get">
                    <button pgs="button['btnIconOnly' 'btnTransparent']" type="submit" title="Search">
                        <i pgs="icon['icon-magnifyingGlass']"></i>
                    </button>

                    <input type="search" name="s" placeholder="Search" aria-label="Search" value="">
                    <div pgs="search-suggestions"></div>

                    <button type="button" pgs="modal-close button['btnIconOnly']" aria-label="Close search">
                        <i pgs="icon['icon-close']"></i>
                    </button>
                </form>


            </div>
        </dialog>
    </div>
</section>

<script type="module">
    import { pgs } from "mypgs";

    // group gives the items that follow each other one heading; the source returns them already in order
    const components = [
        { label: "Accordion", value: "/components/accordion", group: "Components", data: { category: "component" } },
        { label: "Dropdown", value: "/components/dropdown", group: "Components", data: { category: "component" } },
        { label: "Modal", value: "/components/modal", group: "Components", data: { category: "component" } },
        { label: "Search", value: "/components/search", group: "Components", data: { category: "component" } },
        // an item can carry its own icon, which replaces the one of the search for that item only
        { label: "Page Shell", value: "/layout/page-shell", group: "Layout", icon: `<i pgs="icon['icon-check']"></i>`, data: { category: "layout" } },
    ];

    pgs(document).querySelectorAll("search").forEach(search => {
        pgs.search.api(search)?.configure({
            minLength: 1,
            debounce: 150,
            limit: 5,
            // an array is filtered on the label, without minding capitals and accents (pgs.helper.normalizeText)
            source: components,
            onSelect: ({ item, value }) => {
                console.log(`Selected ${item.label}: ${value}`);
            },
        });
    });
</script>
