<!--
/**
 * @title Form
 * @description Form structure with labels, text fields, a textarea, a checkbox, and a radio group compatible with HTML constraints and custom PGS_formValidate rules.
 *
 * @pgs
 * - form: identifies the form container and applies the field layout.
 * - formValidate: is added automatically by PGS_formValidate and enables its validation-state styles.
 * - label: identifies labels associated with controls.
 * - input: applies shared styling to text inputs.
 * - textarea: applies shared styling to the text area.
 * - radio: styles a group of native radio inputs while preserving their shared name and selection behavior.
 * - checkbox: styles a group of native checkbox inputs, sharing the presentation of the radio group.
 * - select: applies shared styling to a native select.
 * - legend: applies the group heading styling to the legend of a fieldset.
 * - required: marks a label as required without relying on the control's own required attribute.
 *
 * @pgs-option
 * - message: defines a field-specific message with the syntax message[Message text].
 * - messageTitle: defines a field-specific alert title with the syntax messageTitle[Title text].
 * - fieldErrorTitle: defines the fallback title for validation errors on the form.
 * - fieldError: defines the fallback description for one invalid field.
 * - fieldsError: defines the summary shown when multiple fields are invalid.
 * - successTitle: defines the validation success title.
 * - success: defines the validation success description.
 *
 * @pgs-state
 * - errorForm: is applied at runtime to a form that fails validation.
 * - errorField: is applied at runtime to each field that fails validation.
 * - success: is applied at runtime to the form after successful validation.
 *
 * @api
 * - new pgs.formValidate(form, options): creates a utility associated directly with the form, adds novalidate, and completes missing form message options from options.message and then from library defaults; existing pgs-option values are preserved.
 * - instance.validator(callback, eventName): intercepts the specified event, clears previous temporary field errors, validates the form, shows the success message, and invokes callback only when valid; eventName defaults to submit.
 * - instance.validate(): validates required fields, updates state attributes, and returns true or false.
 * - instance.success(description, title): validates the form and shows a success alert or toast when there are no errors.
 * - instance.addNewRule(rule): adds a function that returns one or more invalid fields; validate automatically marks each returned field as invalid.
 * - instance.temporaryFieldError.set(field, options): registers a temporary field error and validates the form; options accepts title and message, or it can be the message string.
 * - instance.temporaryFieldError.remove(field): removes a temporary error and its visual state from one field.
 * - instance.temporaryFieldError.clear(): removes all temporary field errors and their visual states.
 *
 * @related
 * - alertContainer: is found or created automatically by the alert API when form validation uses inline alerts.
 * - button: provides the base styling for the primary submit action.
 * - flexColumn: spaces text elements in the radio group.
 * - buttonStrong: presents form submission as the primary action.
 *
 * @return Complete HTML form with required fields and an example script for a custom rule, validation, and a success message.
 */
-->

<form pgs="form" pgs-option="fieldErrorTitle[Check the form] fieldError[Complete this field] fieldsError[Complete all required fields] successTitle[Submitted] success[Submitted successfully]" action="#" method="post">

    <label>
        <span pgs="label">Name</span>
        <input pgs="input" pgs-option="message[Enter your name]" type="text" name="name" placeholder="John Smith" required>
    </label>

    <label>
        <span pgs="label">Email</span>
        <input pgs="input" pgs-option="message[Enter a valid email address]" type="email" name="email" placeholder="name@example.com" required>
    </label>
    
    
    <label>
        <span pgs="label">Password</span>
        <input pgs="input" pgs-option="message[Enter a password]" type="password" name="password" autocomplete="new-password" required>
    </label>
    
    <label>
        <span pgs="label">Confirm password</span>
        <input pgs="input" pgs-option="message[Confirm your password]" type="password" name="confirmPassword" autocomplete="new-password" required>
    </label>
    
    <label>
        <span pgs="label">Age</span>
        <input pgs="input" type="number" name="age" placeholder="Enter your age" >
    </label>
    
    <label>
        <span pgs="label">Disabled </span>
        <input disabled pgs="input" type="text" name="Disabled" placeholder="Disabled" >
    </label>

    <label>
        <span pgs="label">Message</span>
        <textarea pgs="textarea" name="message" rows="5" placeholder="Write your message" required></textarea>
    </label>

    <label>
        <span pgs="label required">Country</span>
        <select pgs="select" name="country">
            <option value="">Choose a country</option>
            <option value="it">Italy</option>
            <option value="fr">France</option>
        </select>
    </label>

    <br>
    <fieldset pgs="radio flexColumn" pgs-option="message[Choose a contact method]">
        <legend pgs="legend">Preferred contact method</legend>

        <label>
            <input type="radio" name="contactMethod" value="email" required>
            <span>Email</span>
        </label>

        <label>
            <input type="radio" name="contactMethod" value="phone">
            <span>Phone</span>
        </label>

        <label>
            <input type="radio" name="contactMethod" value="message">
            <span>Direct message</span>
        </label>
    </fieldset>
    <br>

    <fieldset pgs="checkbox flexColumn" pgs-option="message[Choose at least one topic]">
        <legend pgs="legend">Topics</legend>

        <label>
            <input type="checkbox" name="topics" value="news">
            <span>News</span>
        </label>

        <label>
            <input type="checkbox" name="topics" value="offers">
            <span>Offers</span>
        </label>
    </fieldset>
    <br>

    <label>
        <input type="checkbox" name="privacy" required>
        <span>I accept the privacy policy</span>
    </label>
    <br>

    <button pgs="button" pgs-option="buttonStrong" type="submit">
        <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
        Submit
    </button>
</form>

<script type="module">
    import { pgs } from "mypgs";

    const form = pgs(document).querySelector("form");

    const password = form.querySelector('input[name="password"]');
    const confirmPassword = form.querySelector('input[name="confirmPassword"]');
    if (!password || !confirmPassword) return;

    const formValidate = new pgs.formValidate(form, {
        typeNotice: "alert"
    });

    //== new roules
    formValidate.addNewRule(() => {
        if (password.value && confirmPassword.value && password.value !== confirmPassword.value) {
            pgs(confirmPassword).option.setValueBrackets("message", "Passwords do not match");
            return [confirmPassword, password];
        }
    });

    //== validate
    formValidate.validator(event => {
        const values = Object.fromEntries(new FormData(form));

        // Replace this log with a request to your backend.
        console.log(values);
    }, "submit");
</script>
