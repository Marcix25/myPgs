<!--
/**
 * @title Badge
 * @description Collection of compact indicators for displaying categories, priorities, and visual states with consistent color variants.
 *
 * @pgs
 * - badge: identifies the base badge variant.
 *
 * @pgs-options
 * - badgePrimary: applies the solid primary color, with the text of a primary surface; the same look as btnPrimary.
 * - badgeStrong: applies the stronger primary color with white text; the same look as btnStrong.
 * - badgeSoft: applies the light primary background with the strong primary text.
 * - badgeSuccess: represents a successful result.
 * - badgeDot: adds a dot indicator to the badge.
 * - badgeWarning: represents a warning.
 * - badgeError: represents an error.
 * - badgeInfo: represents informational content.
 * - badgeNeutral: applies the neutral variant.
 *
 * @related
 * - icon: draws the glyphs this example shows; see Icon for the whole set.
 * - icon-circleInfo: the information mark.
 * - icon-close: the cross that dismisses.
 * - icon-triangleExclamation: the warning mark.
 *
 * @return HTML examples of the available badge variants.
 */
-->

<demo demo-h2="Examples"></demo>
<demo demo-h3="Base" demo-description="Default badge variant with no color emphasis."></demo>
<section demo="component">
    <span pgs="badge">
        Base
    </span>
</section>

<demo demo-h3="Primary" demo-description="Badge using the solid primary color, like btnPrimary."></demo>
<section demo="component">
    <span pgs="badge['badgePrimary']">
        Primary
    </span>
</section>

<demo demo-h3="Strong" demo-description="Badge using the stronger primary color, like btnStrong."></demo>
<section demo="component">
    <span pgs="badge['badgeStrong']">
        Strong
    </span>
</section>

<demo demo-h3="Soft" demo-description="Light primary background with the strong primary text."></demo>
<section demo="component">
    <span pgs="badge['badgeSoft']">
        Soft
    </span>
</section>

<demo demo-h3="Active" demo-description="Success badge combined with a dot indicator."></demo>
<section demo="component">
    <span pgs="badge['badgeSuccess' 'badgeDot']">
        Active
    </span>
</section>

<demo demo-h3="Warning" demo-description="Badge representing a warning, paired with an icon."></demo>
<section demo="component">
    <span pgs="badge['badgeWarning']">
        <i pgs="icon['icon-triangleExclamation']" aria-hidden="true"></i>
        Warning
    </span>
</section>

<demo demo-h3="Error" demo-description="Badge representing an error, paired with an icon."></demo>
<section demo="component">
    <span pgs="badge['badgeError']">
        <i pgs="icon['icon-close']" aria-hidden="true"></i>
        Error
    </span>
</section>

<demo demo-h3="Info" demo-description="Badge representing informational content, paired with an icon."></demo>
<section demo="component">
    <span pgs="badge['badgeInfo']">
        <i pgs="icon['icon-circleInfo']" aria-hidden="true"></i>
        Info
    </span>
</section>

<demo demo-h3="Neutral" demo-description="Neutral badge variant with muted colors."></demo>
<section demo="component">
    <span pgs="badge['badgeNeutral']">
        Neutral
    </span>
</section>
