<!--
/**
 * @title Badge
 * @description Collection of compact indicators for displaying categories, priorities, and visual states with consistent color variants.
 *
 * @pgs
 * - badge: identifies the base badge variant.
 *
 * @pgs-option
 * - badgePrimary: applies the primary color variant.
 * - badgeStrong: applies the high-contrast variant.
 * - badgeSuccess: represents a successful result.
 * - badgeDot: adds a dot indicator to the badge.
 * - badgeWarning: represents a warning.
 * - badgeError: represents an error.
 * - badgeInfo: represents informational content.
 * - badgeNeutral: applies the neutral variant.
 *
 * @related
 * - flexRow: arranges badges horizontally and allows them to wrap.
 * - icon: draws the glyphs this example shows; see Icon for the whole set.
 * - icon-circleInfo: the information mark.
 * - icon-close: the cross that dismisses.
 * - icon-triangleExclamation: the warning mark.
 *
 * @return HTML examples of the available badge variants.
 */
-->

<div pgs="flexRow" demo="component">
    <span pgs="badge" demo="item" demo-title="Base" demo-description="Default badge variant with no color emphasis.">
        Base
    </span>

    <span pgs="badge" pgs-option="badgePrimary" demo="item" demo-title="Primary" demo-description="Badge using the primary color variant.">
        Primary
    </span>

    <span pgs="badge" pgs-option="badgeStrong" demo="item" demo-title="Strong" demo-description="High-contrast badge variant.">
        Strong
    </span>

    <span pgs="badge" pgs-option="badgeSuccess badgeDot" demo="item" demo-title="Active" demo-description="Success badge combined with a dot indicator.">
        Active
    </span>

    <span pgs="badge" pgs-option="badgeWarning" demo="item" demo-title="Warning" demo-description="Badge representing a warning, paired with an icon.">
        <i pgs="icon" pgs-option="icon-triangleExclamation" aria-hidden="true"></i>
        Warning
    </span>

    <span pgs="badge" pgs-option="badgeError" demo="item" demo-title="Error" demo-description="Badge representing an error, paired with an icon.">
        <i pgs="icon" pgs-option="icon-close" aria-hidden="true"></i>
        Error
    </span>

    <span pgs="badge" pgs-option="badgeInfo" demo="item" demo-title="Info" demo-description="Badge representing informational content, paired with an icon.">
        <i pgs="icon" pgs-option="icon-circleInfo" aria-hidden="true"></i>
        Info
    </span>

    <span pgs="badge" pgs-option="badgeNeutral" demo="item" demo-title="Neutral" demo-description="Neutral badge variant with muted colors.">
        Neutral
    </span>

</div>
