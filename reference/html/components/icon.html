<!--
/**
 * @title Icon
 * @description The glyphs the library draws itself, as inline SVG rather than a font. The token marks the element as an icon and the option chooses which one, so the set is closed: what the stylesheet holds is what can be drawn. Everything myPGS builds and needs to show goes through here — the slide arrows, the close buttons, the marks on alerts, toasts and notifications — which is why the library needs no icon font of its own. The same token is yours to write, so an icon you place by hand costs no dependency either. Written on its own, with no option, it draws nothing and only marks the element as an icon: that is how any icon set you bring gets the same box and placement the library gives an <i>, so a span, an svg or a custom element is sized and positioned like one. It is not iconBox: that one is the circular surface a glyph can sit inside, this one is the drawing.
 *
 * @pgs
 * - icon: draws a glyph on the element, taking its size from the font size and its colour from the text colour, so it follows whatever surrounds it. Set --icon-size on it, or on anything above it, to size a glyph away from the text around it, and --icon-color to paint it away from the text colour; both are read with a fallback, so an icon that is given neither keeps following its surroundings.
 *
 * @pgs-options
 * - icon-arrowLeft: arrow pointing left, for stepping back through a sequence.
 * - iconBox: turns the element into the circular surface a glyph sits inside. It is the container and says nothing about what it holds, so a built-in glyph and an icon from any other set sit in it alike.
 * - iconDuo: draws a two-layer version of a glyph instead of the flat one, when that glyph has one (icon-hamburgerTwo does); write it alongside the glyph name, as pgs="icon['icon-hamburgerTwo' 'iconDuo']". Each layer paints on its own pseudo-element, so a component can animate or colour them independently.
 * - iconMedium: sets --icon-size to 2rem, a preset for a glyph that needs to stand out more than the size it inherits from the surrounding text.
 * - iconLarge: sets --icon-size to 3rem, a preset for a glyph large enough to anchor its own section.
 * - icon-arrowRight: arrow pointing right, for stepping forward.
 * - icon-chevronDown: chevron pointing down, for anything that expands in place.
 * - icon-check: tick, for a confirmed or checked state.
 * - icon-close: cross, for dismissing a surface.
 * - icon-magnifyingGlass: magnifying glass, for a search affordance.
 * - icon-moon: crescent moon, the dark half of a theme switch.
 * - icon-sun: sun, the light half of a theme switch.
 * - icon-cookie: biscuit, used by the consent notice.
 * - icon-sliders: three sliders, for preferences.
 * - icon-circle: plain disc, for a step that is only a position in a sequence.
 * - icon-circleXmark: cross inside a disc, the error mark.
 * - icon-circleCheck: tick inside a disc, the success mark.
 * - icon-circleInfo: letter i inside a disc, the information mark.
 * - icon-triangleExclamation: exclamation mark inside a triangle, the warning mark.
 * - icon-bell: bell, for anything that announces something arriving.
 * - icon-star: star, the neutral stand-in glyph for an example that needs one without it meaning anything.
 * - icon-hamburger: three horizontal bars, the classic static hamburger menu glyph.
 * - icon-hamburgerTwo: two horizontal bars, a lighter static hamburger menu glyph; add iconDuo for the two-layer version, each bar on its own pseudo-element so a component can animate them into a close mark.
 * - icon-calendar: calendar, for a date.
 * - icon-chatBubble: chat bubble, for a message or a comment.
 * - icon-clock: clock, for a time or a duration.
 * - icon-download: arrow into a tray, for downloading a file.
 * - icon-envelope: envelope, for an email or a message.
 * - icon-eye: eye, for showing or previewing something hidden.
 * - icon-gear: gear, for settings or configuration.
 * - icon-heart: heart, for favouriting or liking something.
 * - icon-home: house, for a homepage or a starting point.
 * - icon-lock: padlock, for something protected or restricted.
 * - icon-mapPin: map pin, for a location or an address.
 * - icon-minus: minus sign, for collapsing or decreasing a value.
 * - icon-pause: two bars, for pausing playback.
 * - icon-pencil: pencil, for editing.
 * - icon-play: triangle, for starting playback.
 * - icon-plus: plus sign, for adding or increasing a value.
 * - icon-trash: bin, for deleting something.
 * - icon-upload: arrow out of a tray, for uploading a file.
 * - icon-user: person, for an account or a profile.
 * - icon-ellipsis: three vertical dots, for a secondary "more actions" menu.
 *
 *
 * @related
 * - flex: provides the flex layout; direction and spacing are flags in its bracket.
 * - flexColumn: stacks the groups of examples.
 * - flexRow: lays each group out in a row.
 * - gapTexts: spaces the icons inside a group.
 * - wrap: lets the full set flow onto more rows.
 * - gapSections: separates the groups.
 * - txtPrimary: recolours one example, to show that a glyph follows the text colour.
 * - txtError: recolours another the same way.
 *
 * @return One example per glyph, the sizing and colour behaviour, and the surface a glyph sits inside.
 */
-->

<demo demo-h3="Size and colour" demo-description="A glyph is drawn at the font size of its element and painted in the text colour, so it needs no settings of its own: size it and colour it the way you would the text around it."></demo>
<section pgs="flex['flexColumn' 'gapTexts']" demo="component">
    <div pgs="flex['flexRow' 'gapTexts']" demo="wrapper">
        <p><i pgs="icon['icon-circleInfo']"></i> Inside a paragraph, matching the text.</p>
    </div>

    <div pgs="flex['flexRow' 'gapTexts']" demo="wrapper">
        <i pgs="icon['iconLarge' 'icon-circleCheck']"></i>
        <i pgs="icon['iconMedium' 'icon-circleCheck']"></i>
        <i pgs="icon['icon-circleCheck']"></i>
    </div>

    <div pgs="flex['flexRow' 'gapTexts']" demo="wrapper">
        <i pgs="icon['icon-triangleExclamation'] txtPrimary"></i>
        <i pgs="icon['icon-triangleExclamation'] txtError"></i>
