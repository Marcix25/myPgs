<!--
/**
 * @title Notification
 * @description Notification markup, configuration, behavior, and usage example. A persistent, manually-dismissed panel of messages. Author only the modal wrapping notificationBell (no dialog inside it); the first time it is needed, pgs.notification generates the dialog and re-initializes that modal automatically. It lives inside a modal dialog (see Modal) opened and closed by notificationBell — opening any other dialog on the page (e.g. the mobile menu) closes it automatically, and vice versa. Split from Toast, which is ephemeral and auto-dismissing. Full JSON field list is under @pgs-option "notification"; full JS options list is under each @api method below. The JSON form and the JS options now use the same names; the previous message and title-close keys are still accepted as aliases. Three custom events are dispatched: pgs:notification:buttonClick on a buttons[] element when clicked (detail: id, buttonId, type, title, description, link; cancelable — call event.preventDefault() to stop a link's navigation and finish async work first), pgs:notification:close on the notification element right before it is removed (detail: id, type, title, description), and pgs:notification:deleteAll on the panel when deleteAll() runs (detail: ids).
 *
 * @pgs
 * - notificationLoad: creates one or more notifications from comma-separated JSON objects on page load; see @pgs-option "notification" for every accepted field.
 * - notificationTrigger: the pre-split marker kept for backward compatibility, superseded by notificationLoad; it reads the same notification option and additionally accepts an "element" field to route the payload to a toast.
 * - notificationBell: opens/closes the notification dialog each time it is clicked; also the modal-button for the surrounding modal.
 * - notificationBell-counter: displays the current count of _notifications-element elements inside notificationBell.
 *
 * @pgs-generated
 * - notifications: the scrollable list of notifications, created inside the generated dialog together with it.
 * - _notifications-element: identifies a single notification inside the panel.
 * - _notifications-element-content: contains the icon, title, and description.
 * - _notifications-element-icon: contains the icon displayed to the left of the text.
 * - _notifications-element-buttons: contains the extra action buttons and the dismiss action below the content.
 * - _notifications-element-buttons-delete: identifies the dismiss button generated inside that row; its label comes from the closeTitle option.
 * - _notifications-empty: shown inside the panel whenever it holds no notifications; its text comes from the internal emptyMessage default.
 *
 * @pgs-option
 * - notification: JSON object (or several, comma-separated) read by notificationLoad on page load — every field, with its accepted values and its default, is annotated in the reference below.
 *
 * @pgs-state
 * - success: identifies the success element used by Notification.
 * - error: identifies the error element used by Notification.
 * - warning: identifies the warning element used by Notification.
 * - info: identifies the info element used by Notification.
 *
 * @api
 * - pgs.notification.init(root): scans root for notificationLoad and initializes them (including the bell counter); runs automatically on page load and again via pgs.init(root) for content added later. Opening/closing the dialog itself is handled by pgs.modal (see Modal).
 * - pgs.notification.trigger(root): alias of pgs.notification.init(root).
 * - pgs.notification.error(optionsOrTitle): a title string, or an options object — see the full field reference in the commented example below.
 * - pgs.notification.success(optionsOrTitle): a title string, or an options object — see the full field reference in the commented example below.
 * - pgs.notification.info(optionsOrTitle): a title string, or an options object — see the full field reference in the commented example below.
 * - pgs.notification.warning(optionsOrTitle): a title string, or an options object — see the full field reference in the commented example below.
 * - pgs.notification.deleteAll(): removes every notification from the panel and dispatches pgs:notification:deleteAll (detail: ids) on the panel element.
 *
 * @related
 * - hidden: keeps every notificationLoad out of the layout, since it only carries a payload.
 * - flexColumn: stacks the examples vertically.
 * - gapSections: separates the examples.
 * - gapTexts: spaces the content inside each example.
 * - button: uses the related button component or utility in this example.
 * - modal: wraps notificationBell; pgs.notification generates the dialog inside it and provides open/close/toggle behavior shared with every other dialog on the page.
 * - modal-button: identifies notificationBell as the control that opens the dialog.
 * - modal-dialog-content: identifies the JS-generated styled content area inside the dialog, wrapping notifications.
 * - buttonIcon: presents notificationBell as an icon button.
 * - right: slides the notification dialog in from the right; see Modal for other positions.
 *
 * @return Complete HTML markup and usage example for Notification.
 */
-->

<div pgs="flexColumn" pgs-option="gapSections" demo="component">

    <section pgs="flexColumn" pgs-option="gapTexts" demo="item" demo-code="children" demo-title="Bell" demo-description="The control that opens and closes the panel, and the only markup this component needs on the page. Wrap it in a modal and pgs.notification builds the dialog inside it on its own.">
        <button pgs="modal-button button notificationBell" pgs-option="buttonIcon" aria-label="Open notifications">
            <i class="fa-duotone fa-solid fa-bell"></i>
            <span pgs="notificationBell-counter"></span>
        </button>
    </section>

</div>
<div pgs="flexColumn" pgs-option="gapSections" demo="component" demo-title="Type">


    <section pgs="flexColumn" pgs-option="gapTexts" demo="item" demo-code="children" demo-title="Success" demo-description="A completed operation. The element is hidden and consumed on load: the notification it describes is moved into the panel." demo-preview="none">
        <div pgs="hidden notificationLoad" pgs-option='notification[{
            "title": "Profile approved",
            "description": "Your profile has been reviewed and approved.",
            "type": "success",
            "icon": null,
            "buttons": [{ "title": "Open", "link": "/page/" }]
        }]'></div>
    </section>

    <section pgs="flexColumn" pgs-option="gapTexts" demo="item" demo-code="children" demo-title="Error" demo-description="A failure the user has to know about, with a button to try the operation again." demo-preview="none">
        <div pgs="hidden notificationLoad" pgs-option='notification[{
            "title": "Something went wrong",
            "description": "Please try again later.",
            "type": "error",
            "icon": null,
            "buttons": [{ "title": "Retry", "link": "#" }]
        }]'></div>
    </section>

    <section pgs="flexColumn" pgs-option="gapTexts" demo="item" demo-code="children" demo-title="Warning" demo-description="Something is missing but nothing is broken, so the button leads to where it can be completed." demo-preview="none">
        <div pgs="hidden notificationLoad" pgs-option='notification[{
            "title": "Your profile is incomplete",
            "description": "Complete your profile to unlock all features.",
            "type": "warning",
            "icon": null,
            "buttons": [{ "title": "Complete profile", "link": "#" }]
        }]'></div>
    </section>

    <section pgs="flexColumn" pgs-option="gapTexts" demo="item" demo-code="children" demo-title="Info with several buttons" demo-description="Buttons carrying an id instead of a link dispatch pgs:notification:buttonClick with that id, which is how a question is answered without leaving the page." demo-preview="none">
        <div pgs="hidden notificationLoad" pgs-option='notification[{
            "title": "Are you enjoying the portal?",
            "description": "Your feedback helps us improve.",
            "type": "info",
            "icon": null,
            "buttons": [
                { "id": "yes", "title": "Yes" },
                { "id": "no", "title": "No" }
            ]
        }]'></div>
    </section>
</div>

<script type="application/json">
notification[{
    "id": null,                  // string; generated when omitted, and reported by every event
    "title": "",                 // omitted falls back to the title of the type
    "description": "",           // plain text under the title
    "type": "info",              // error | success | warning | info
    "icon": null,                // HTML string; null uses the icon of the type
    "closeTitle": "Close",       // label of the dismiss button
    "buttons": [                 // omitted or empty leaves only the dismiss button
        {
            "id": null,          // reported as buttonId by pgs:notification:buttonClick
            "title": "",         // label of the button
            "link": null,        // navigates there; omit it to only dispatch the event
            "close": true,       // dismisses the notification after the click
            "optionButton": null // pgs-option token added to the button, e.g. buttonMini
        }
    ]
}]
</script>

<script type="text/x-example-js">
    pgs.notification.success({
    id: undefined,
    title: "",
    description: "",
    icon: null,
    closeTitle: "Close",
    buttons: [
        { id: undefined, title: "", link: undefined, close: true, optionButton: undefined }
    ]
});
</script>
