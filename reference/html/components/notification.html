<div pgs="notification" aria-live="polite"></div>
<div pgs="notification" pgs-option="toast" aria-live="polite"></div>

<div pgs="hidden notificationTrigger" pgs-option='
    notification[{
        "title": "Identifies the success",
        "message": "identifies the notification element used by Notification.",
        "element": "notification",
        "type": "info",
        "icon": null,
        "duration": "-1",
        "link": "/page/",
        "title-link": "Open",
        "title-close": "Close"
    }]
'></div>
<div pgs="hidden notificationTrigger" pgs-option='
    notification[{
        "title": "Benvenuto",
        "message": "Message",
        "element": "toast",
        "type": "success",
        "icon": null,
        "duration": "7000",
        "link": null,
        "title-link": "Open",
        "title-close": "Close"
    }]
'></div>
