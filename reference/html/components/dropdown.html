<!--
/**
 * @title Dropdown
 * @description Popup component that connects a control to content positioned relative to its trigger and handles opening, closing, outside clicks, and Escape.
 *
 * @pgs
 * - dropdown: identifies the container initialized by the dropdown module.
 * - dropdown-button: identifies the control that opens or closes the content.
 * - dropdown-content: identifies the panel positioned relative to the control.
 *
 * @pgs-option
 * - dropdownHover: opens the dropdown when the pointer enters its trigger and closes it after the pointer leaves; click and keyboard activation remain available.
 * - position: configures the root as position[side alignment]; side accepts top, right, bottom, or left, while compatible alignment values are top, right, bottom, left, or center. The default is bottom center.
 *
 * @pgs-state
 * - open: indicates that the dropdown is open and its content is visible.
 *
 * @api
 * - pgs.dropdown.init(root): initializes unregistered dropdowns within the specified Document or Element.
 * - pgs.dropdown.api(element): returns the instance associated with an initialized dropdown root.
 * - instance.open(): opens the dropdown and closes any other open dropdowns.
 * - instance.close(): closes the current dropdown.
 * - instance.toggle(): toggles between the open and closed states.
 * - instance.refresh(): reinitializes the context and recalculates content positioning.
 * - instance.isOpen(): returns true when the dropdown is open.
 *
 * @related
 * - flexRow: arranges the placement examples on the same flexible row.
 * - button: applies standard styling to dropdown controls.
 * - buttonReverse: reverses text and icon on the example buttons and belongs to the button component.
 *
 * @return Series of HTML dropdowns demonstrating the supported placement directions.
 */
-->

<div pgs="flexRow" demo="component">

    <span pgs="dropdown" demo="item" demo-title="Bottom center" demo-description="Default dropdown placement, opened below and centered on its trigger.">
        <button pgs="dropdown-button button" pgs-option="buttonReverse" type="button">
            Bottom center
            <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
        </button>

        <div pgs="dropdown-content">
            bottom center content
        </div>
    </span>

    <span pgs="dropdown" pgs-option="dropdownHover" demo="item" demo-title="Hover" demo-description="Opens when the pointer enters the trigger and closes after it leaves.">
        <button pgs="dropdown-button button" pgs-option="buttonReverse" type="button">
            Hover
            <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
        </button>

        <div pgs="dropdown-content">
            hover content
        </div>
    </span>

    <span pgs="dropdown" pgs-option="position[top left]" demo="item" demo-title="Top left" demo-description="Dropdown content positioned above the trigger, aligned to the left.">
        <button pgs="dropdown-button button" pgs-option="buttonReverse" type="button">
            Top left
            <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
        </button>

        <div pgs="dropdown-content">
            top left content
        </div>
    </span>

    <span pgs="dropdown" pgs-option="position[top center]" demo="item" demo-title="Top center" demo-description="Dropdown content positioned above the trigger, centered.">
        <button pgs="dropdown-button button" pgs-option="buttonReverse" type="button">
            Top center
            <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
        </button>

        <div pgs="dropdown-content">
            top center content
        </div>
    </span>

    <span pgs="dropdown" pgs-option="position[top right]" demo="item" demo-title="Top right" demo-description="Dropdown content positioned above the trigger, aligned to the right.">
        <button pgs="dropdown-button button" pgs-option="buttonReverse" type="button">
            Top right
            <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
        </button>

        <div pgs="dropdown-content">
            top right content
        </div>
    </span>

    <span pgs="dropdown" pgs-option="position[bottom left]" demo="item" demo-title="Bottom left" demo-description="Dropdown content positioned below the trigger, aligned to the left.">
        <button pgs="dropdown-button button" pgs-option="buttonReverse" type="button">
            Bottom left
            <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
        </button>

        <div pgs="dropdown-content">
            bottom left content
        </div>
    </span>

    <span pgs="dropdown" pgs-option="position[bottom right]" demo="item" demo-title="Bottom right" demo-description="Dropdown content positioned below the trigger, aligned to the right.">
        <button pgs="dropdown-button button" pgs-option="buttonReverse" type="button">
            Bottom right
            <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
        </button>

        <div pgs="dropdown-content">
            bottom right content
        </div>
    </span>

    <span pgs="dropdown" pgs-option="position[left center]" demo="item" demo-title="Left center" demo-description="Dropdown content positioned to the left of the trigger, vertically centered.">
        <button pgs="dropdown-button button" pgs-option="buttonReverse" type="button">
            Left center
            <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
        </button>

        <div pgs="dropdown-content">
            left center content
        </div>
    </span>

    <span pgs="dropdown" pgs-option="position[right center]" demo="item" demo-title="Right center" demo-description="Dropdown content positioned to the right of the trigger, vertically centered.">
        <button pgs="dropdown-button button" pgs-option="buttonReverse" type="button">
            Right center
            <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
        </button>

        <div pgs="dropdown-content">
            right center content
        </div>
    </span>

</div>
