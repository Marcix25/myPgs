<!--
/**
 * @title Step Tabs
 * @description Step Tabs markup, configuration, behavior, and usage example.
 *
 * @pgs
 * - stepTabs: identifies the stepTabs element used by Step Tabs.
 * - stepTabs-dots: identifies the stepTabs-dots element used by Step Tabs.
 * - stepTabs-container: identifies the stepTabs-container element used by Step Tabs.
 * - stepTabs-container-tab: identifies a panel within the Step Tabs container.
 * - stepTabs-prev: identifies the stepTabs-prev element used by Step Tabs.
 * - stepTabs-restart: identifies the stepTabs-restart element used by Step Tabs.
 * - stepTabs-next: identifies the stepTabs-next element used by Step Tabs.
 *
 * @pgs-generated
 * - _stepTabs-dots-dot: one dot per tab, created inside stepTabs-dots, showing the icon declared by that tab's tabIcon option.
 *
 * @pgs-option
 * - tabIcon: the icon drawn in this tab's dot, in brackets, in one of three shapes. Markup, opening with a "<", is built as written, which is what puts every icon set in reach — including the ones a class cannot describe, such as tabIcon[<span class='material-symbols-outlined'>check</span>] or tabIcon[<i data-lucide='check'></i>]; write the inner attributes with single quotes, since the value already lives inside one, and mark your own element with pgs='icon' so it gets the same box the dot gives an icon — without it a set that renders its name as text has nothing sizing it. A plain name is a built-in glyph, as in tabIcon[icon-circleCheck]. Anything else is a class list for whatever set the page loaded, written through untouched, as in tabIcon[bi-check] or tabIcon[fa-regular fa-star]; a lone Font Awesome name such as tabIcon[fa-user] also gets fa-solid, since that set needs a style class. Leave it out and the dot gets icon-circle.
 *
 * @pgs-state
 * - is-active: identifies the is-active element used by Step Tabs.
 * - is-completed: identifies the is-completed element used by Step Tabs.
 * - is-locked: identifies the is-locked element used by Step Tabs.
 *
 * @api
 * - pgs.stepTabs.init(root): initializes matching elements within the specified root.
 * - pgs.stepTabs.api(element): returns the instance associated with the specified initialized element.
 * - instance.restart(): returns to the first tab and restores the locks declared in the markup.
 * - instance.goTo(index, scroll): provides the documented operation through the component public API.
 * - instance.next(): moves to the next item.
 * - instance.prev(): moves to the previous item.
 * - instance.toggleLock(index, lock): provides the documented operation through the component public API.
 * - instance.refresh(): refreshes the component and returns its updated instance.
 * - instance.getCurrent(): provides the documented operation through the component public API.
 * - instance.getState(): provides the documented operation through the component public API.
 *
 * @related
 * - flexColumn: uses the related flexColumn component or utility in this example.
 * - gapElements: applies element spacing to the step tab container.
 * - flexRow: uses the related flexRow component or utility in this example.
 * - button: uses the related button component or utility in this example.
 * - buttonReverse: reverses text and icon on the example buttons and belongs to the button component.
 * - icon: draws the glyph inside a dot when the tab does not name its own; see Icon for the whole set.
 * - icon-circle: the glyph a dot gets by default.
 * - icon-arrowLeft: the glyph that points back.
 * - icon-arrowRight: the glyph that points forward.
 *
 * @return Complete HTML markup and usage example for Step Tabs.
 */
-->

<div pgs="stepTabs flexColumn gapElements">
    <div pgs="stepTabs-dots" aria-label="Progress"></div>

    <div pgs="stepTabs-container">
        <section pgs="stepTabs-container-tab flexColumn" tabindex="-1" pgs-option="tabIcon[<i pgs='icon' pgs-option='icon-circle'></i>]">
            <h3>Personal details</h3>
            <p>First tab content.</p>
        </section>

        <section pgs="stepTabs-container-tab flexColumn" tabindex="-1" pgs-option="tabIcon[<i pgs='icon' pgs-option='icon-sliders'></i>]">
            <h3>Preferences</h3>
            <p>Second tab content.</p>
        </section>

        <section pgs="stepTabs-container-tab flexColumn" tabindex="-1" pgs-option="tabIcon[<i pgs='icon' pgs-option='icon-check'></i>]">
            <h3>Confirmation</h3>
            <p>Third tab content.</p>
        </section>
    </div>

    <div pgs="flexRow">
        <button pgs="stepTabs-prev button" type="button">
            <i pgs="icon" pgs-option="icon-arrowLeft" aria-hidden="true"></i>
            Back
        </button>

        <button pgs="stepTabs-restart button" type="button">
            Restart
        </button>

        <button pgs="stepTabs-next button" pgs-option="buttonReverse" type="button">
            Next
            <i pgs="icon" pgs-option="icon-arrowRight" aria-hidden="true"></i>
        </button>
    </div>
</div>
