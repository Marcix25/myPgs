<!--
/**
 * @title Button
 * @description Button and action-link variants with sizes, emphasis, and icon-text composition defined by the design system.
 *
 * @pgs
 * - button: identifies the standard button, which can also be used on anchor elements.
 *
 * @pgs-option
 * - buttonReverse: reverses the visual order of the text and icon on the button.
 * - buttonStrong: applies the variant with stronger visual emphasis.
 * - buttonIcon: identifies a compact button composed primarily of an icon.
 * - buttonMini: applies the smallest size variant.
 * - buttonBig: applies the large size variant.
 * - buttonText: drops the background and the border at rest, so only the label shows, and colours the label on hover. Unlike buttonTransparent it leaves the other states alone, so the same button still fills in when it carries buttonStrong or aria-current.
 * - buttonTransparent: removes the default background and outline while preserving the button layout and hover behavior.
 * - buttonSecondary: replaces the primary button accent with the secondary color palette.
 * - buttonTertiary: replaces the primary button accent with the tertiary color palette.
 * - buttonQuaternary: replaces the primary button accent with the quaternary color palette.
 * - buttonPaddingEqual: sets the same padding on every side instead of the wider left/right default.
 *
 * @related
 * - flexRow: arranges the button examples in a flexible row.
 * - gapTexts: spaces the two buttons that share the text-only example.
 * - icon: draws the glyphs this example shows; see Icon for the whole set.
 * - icon-arrowRight: the glyph that points forward.
 * - icon-star: the neutral stand-in glyph, used where the example needs an icon but not a particular one.
 *
 * @return HTML collection of the main button variants.
 */
-->

<div pgs="flexRow" demo="container">
    <a pgs="button" href="#" demo="item" demo-title="Link button" demo-description="Anchor element styled as a standard button, combining an icon with text.">
        <i pgs="icon" pgs-option="icon-star"></i>
        About
    </a>

    <button pgs="button" type="button" disabled demo="item" demo-title="disabled order" demo-description="button disabled">
        Disabled
    </button>

    <button pgs="button" type="button" pgs-option="buttonReverse" demo="item" demo-title="Reversed order" demo-description="Places the icon after the text using buttonReverse.">
        Next
        <i pgs="icon" pgs-option="icon-arrowRight" aria-hidden="true"></i>
    </button>

    <button pgs="button" pgs-option="buttonStrong" type="button" demo="item" demo-title="Strong emphasis" demo-description="Applies the higher-emphasis buttonStrong variant.">
        Submit
    </button>

    <button pgs="button" pgs-option="buttonIcon" type="button" aria-label="Settings" demo="item" demo-title="Icon only" demo-description="Compact icon-only button using buttonIcon.">
        <i pgs="icon" pgs-option="icon-star" aria-hidden="true"></i>
    </button>

    <button pgs="button" pgs-option="buttonMini" type="button" aria-label="Information" demo="item" demo-title="Mini size" demo-description="Smallest button size using buttonMini.">
        <i pgs="icon" pgs-option="icon-star" aria-hidden="true"></i>
    </button>

    <button pgs="button" pgs-option="buttonBig" type="button" aria-label="Large button" demo="item" demo-title="Large size" demo-description="Largest button size using buttonBig, combined with an icon.">
        <i pgs="icon" pgs-option="icon-star"></i>
        Large
    </button>

    <div pgs="flexRow" pgs-option="gapTexts" demo="item" demo-code="children" demo-title="Text only" demo-description="Only the label shows at rest, and it takes the accent colour on hover. ">
        <button pgs="button" pgs-option="buttonText" type="button">
            Read more
        </button>
    </div>

    <button pgs="button" pgs-option="buttonTransparent" type="button" demo="item" demo-title="Transparent" demo-description="Removes the default background and outline while keeping the button layout using buttonTransparent.">
        Transparent
    </button>

    <button pgs="button" pgs-option="buttonPaddingEqual" type="button" demo="item" demo-title="Equal padding" demo-description="Sets the same padding on every side using buttonPaddingEqual, instead of the wider left/right default.">
        Equal
    </button>

    <button pgs="button" pgs-option="buttonStrong buttonSecondary" type="button" demo="item" demo-title="Secondary color" demo-description="Strong button using the secondary color palette.">
        Secondary
    </button>

    <button pgs="button" pgs-option="buttonStrong buttonTertiary" type="button" demo="item" demo-title="Tertiary color" demo-description="Strong button using the tertiary color palette.">
        Tertiary
    </button>

    <button pgs="button" pgs-option="buttonStrong buttonQuaternary" type="button" demo="item" demo-title="Quaternary color" demo-description="Strong button using the quaternary color palette.">
        Quaternary
    </button>

</div>
