<!--
/**
 * @title Button
 * @description Button and action-link variants with sizes, emphasis, and icon-text composition defined by the design system.
 *
 * @pgs
 * - button: identifies the standard button, which can also be used on anchor elements, and on a `<label>` wrapping its own checkbox or radio to make a two-state control. `pgs.hover` marks it with `hover` at load, so the hover and focus treatment is not written here.
 *
 * @pgs-option
 * - buttonReverse: reverses the visual order of the text and icon on the button.
 * - buttonStrong: applies the variant with stronger visual emphasis.
 * - buttonIcon: identifies a compact button composed primarily of an icon.
 * - buttonMini: applies the smallest size variant.
 * - buttonBig: applies the large size variant.
 * - buttonText: drops the background and the border at rest, so only the label shows, and colours the label on hover. Unlike buttonTransparent it leaves the other states alone, so the same button still fills in when it carries buttonStrong or aria-current.
 * - buttonTransparent: removes the default background and outline while preserving the button layout and hover behavior.
 * - buttonSecondary: replaces the primary button accent with the secondary color palette.
 * - buttonTertiary: replaces the primary button accent with the tertiary color palette.
 * - buttonQuaternary: replaces the primary button accent with the quaternary color palette.
 * - buttonPaddingEqual: sets the same padding on every side instead of the wider left/right default.
 *
 * @related
 * - flexRow: arranges the button examples in a flexible row.
 * - hover: the treatment every button receives, added by pgs.hover rather than written by hand; see Hover.
 * - form: wraps the checked example, so the control is shown where a form actually puts it.
 * - wrap: lets that row break instead of overflowing.
 * - hoverNot: opts a button out of that treatment, so it keeps its look and stops answering the pointer; see Hover.
 * - gapTexts: spaces the two buttons that share the text-only example, and the three two-state buttons.
 * - icon: draws the glyphs this example shows; see Icon for the whole set.
 * - icon-arrowRight: the glyph that points forward.
 * - icon-star: the neutral stand-in glyph, used where the example needs an icon but not a particular one.
 *
 * @return HTML collection of the main button variants, including the two-state control.
 */
-->

<demo demo-h2="Examples"></demo>
<demo demo-h3="Link button" demo-description="Anchor element styled as a standard button, combining an icon with text."></demo>
<section demo="component">
    <a pgs="button" href="#">
        <i pgs="icon" pgs-option="icon-star"></i>
        About
    </a>
</section>

<demo demo-h3="disabled order" demo-description="button disabled"></demo>
<section demo="component">
    <button pgs="button" type="button" disabled>
        Disabled
    </button>
</section>

<demo demo-h3="Reversed order" demo-description="Places the icon after the text using buttonReverse."></demo>
<section demo="component">
    <button pgs="button" type="button" pgs-option="buttonReverse">
        Next
        <i pgs="icon" pgs-option="icon-arrowRight" aria-hidden="true"></i>
    </button>
</section>

<demo demo-h3="Strong emphasis" demo-description="Applies the higher-emphasis buttonStrong variant."></demo>
<section demo="component">
    <button pgs="button" pgs-option="buttonStrong" type="button">
        Submit
    </button>
</section>

<demo demo-h3="Icon only" demo-description="Compact icon-only button using buttonIcon."></demo>
<section demo="component">
    <button pgs="button" pgs-option="buttonIcon" type="button" aria-label="Settings">
        <i pgs="icon" pgs-option="icon-star" aria-hidden="true"></i>
    </button>
</section>

<demo demo-h3="Mini size" demo-description="Smallest button size using buttonMini."></demo>
<section demo="component">
    <button pgs="button" pgs-option="buttonMini" type="button" aria-label="Information">
        Mini
    </button>
</section>

<demo demo-h3="Large size" demo-description="Largest button size using buttonBig, combined with an icon."></demo>
<section demo="component">
    <button pgs="button" pgs-option="buttonBig" type="button" aria-label="Large button">
        <i pgs="icon" pgs-option="icon-star"></i>
        Large
    </button>
</section>

<demo demo-h3="Text only" demo-description="Only the label shows at rest, and it takes the accent colour on hover. "></demo>
<section demo="component">
    <button pgs="button" pgs-option="buttonText" type="button">
        Read more
    </button>
</section>

<demo demo-h3="Transparent" demo-description="Removes the default background and outline while keeping the button layout using buttonTransparent."></demo>
<section demo="component">
    <button pgs="button" pgs-option="buttonTransparent" type="button">
        Transparent
    </button>
</section>

<demo demo-h3="Equal padding" demo-description="Sets the same padding on every side using buttonPaddingEqual, instead of the wider left/right default."></demo>
<section demo="component">
    <button pgs="button" pgs-option="buttonPaddingEqual" type="button">
        Equal
    </button>
</section>

<demo demo-h3="Secondary color" demo-description="Strong button using the secondary color palette."></demo>
<section demo="component">
    <button pgs="button" pgs-option="buttonStrong buttonSecondary" type="button">
        Secondary
    </button>
</section>

<demo demo-h3="Tertiary color" demo-description="Strong button using the tertiary color palette."></demo>
<section demo="component">
    <button pgs="button" pgs-option="buttonStrong buttonTertiary" type="button">
        Tertiary
    </button>
</section>

<demo demo-h3="Quaternary color" demo-description="Strong button using the quaternary color palette."></demo>
<section demo="component">
    <button pgs="button" pgs-option="buttonStrong buttonQuaternary" type="button">
        Quaternary
    </button>
</section>

<demo demo-h3="Checked" demo-description="A label marked as a button wrapping its own checkbox or radio: the input carries the semantics and the keyboard behaviour, the button draws the state. Retune the checked look with --button-background-checked, --button-color-checked and --button-border-color-checked."></demo>
<section demo="component">
    <form pgs="form flexRow" pgs-option="gapTexts wrap" demo="wrapper">
        <label pgs="button">
            <input type="checkbox" name="favorite" value="yes">
            <i pgs="icon" pgs-option="icon-star"></i>
            Add to favorites
        </label>
        <label pgs="button">
            <input type="radio" name="plan" value="monthly" checked>
            Monthly
        </label>
        <label pgs="button">
            <input type="radio" name="plan" value="yearly">
            Yearly
        </label>
    </form>
</section>
