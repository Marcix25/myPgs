<!--
/**
 * @title Button
 * @description Button and action-link variants with sizes, emphasis, and icon-text composition defined by the design system.
 *
 * @pgs
 * - button: identifies the standard button, which can also be used on anchor elements, and on a `<label>` wrapping its own checkbox or radio to make a two-state control.
 *
 * @pgs-options
 * - btnForHeader: sizes the button for use in a header.
 * - btnReverse: reverses the visual order of the text and icon on the button.
 * - btnStrong: applies the variant with stronger visual emphasis.
 * - btnIconOnly: identifies a compact button composed primarily of an icon.
 * - btnMini: applies the smallest size variant.
 * - btnVertical: stacks the content vertically, the icon above the label, with the same padding on every side.
 * - btnTwoState: for a label marked as a button that wraps its own checkbox or radio: hides the input, which still carries the semantics and the keyboard, and draws the checked state with --button-background-twoState, --button-color-twoState, --button-borderColor-twoState and --button-shadow-twoState. Without it the input stays visible and nothing changes when it is checked.
 * - btnCurrent: gives the button the current look — the color, background, border and shadow of --button-*-current — while it carries aria-current="page" or aria-selected="true". Without it those attributes change nothing, so a button that is never marked current does not pay for the rule.
 * - btnForNavSmart: sizes the button as an item of the floating navSmart bar: icon above the label, no background, pill-shaped, and the current look for the page you are on (aria-current) or the panel that is open (aria-expanded). Next to btnIconOnly it drops the label's minimum width and becomes a square as wide as the bar is tall.
 * - btnTransparent: drops the background and the border at rest, so only the label shows; on hover it fills like any other button. Unlike btnText it leaves the other states alone, so the same button still fills in when it carries btnStrong or aria-current.
 * - btnText: text only, with a 3 px bottom edge that is transparent at rest, secondary on hover and primary when the button is current. The label stays black and the background transparent in every state, with no radius and no shadow, so it never fills in on hover, aria-current or checked.
 * - btnNotHover: the button does not answer the pointer, so it keeps its look on hover; a button that is a container for something else, such as a search form or a step dot, takes it.
 * - btnPrimary: applies the primary color palette.
 * - btnSecondary: replaces the primary button accent with the secondary color palette.
 * - btnTertiary: replaces the primary button accent with the tertiary color palette.
 * - btnQuaternary: replaces the primary button accent with the quaternary color palette.
 * - btnPaddingEqual: sets the same padding on every side instead of the wider left/right default.
 *
 * @related
 * - flex: provides the flex layout; direction and spacing are flags in its bracket.
 * - row: arranges the button examples in a flexible row.
 * - form: wraps the checked example, so the control is shown where a form actually puts it.
 * - wrap: lets that row break instead of overflowing.
 * - gapTexts: spaces the two buttons that share the text-only example, and the three two-state buttons.
 * - icon: draws the glyphs this example shows; see Icon for the whole set.
 * - icon-arrowRight: the glyph that points forward.
 * - icon-star: the neutral stand-in glyph, used where the example needs an icon but not a particular one.
 *
 * @return HTML collection of the main button variants, including the two-state control.
 */
-->

<demo demo-h2="Examples"></demo>
<demo demo-h3="Link button" demo-description="Anchor element styled as a standard button, combining an icon with text."></demo>
<section demo="component">
    <a pgs="button" href="#">
        <i pgs="icon['icon-star']"></i>
        About
    </a>
</section>

<demo demo-h3="Disabled" demo-description="A disabled button is dimmed, shows the not-allowed cursor and does not react to hover."></demo>
<section demo="component">
    <button pgs="button" type="button" disabled>
        Disabled
    </button>
</section>

<demo demo-h3="Reversed order" demo-description="Places the icon after the text using btnReverse."></demo>
<section demo="component">
    <button pgs="button['btnReverse']" type="button">
        Next
        <i pgs="icon['icon-arrowRight']" aria-hidden="true"></i>
    </button>
</section>

<demo demo-h3="Strong emphasis" demo-description="Applies the higher-emphasis strong variant."></demo>
<section demo="component">
    <button pgs="button['btnStrong']" type="button">
        Submit
    </button>
</section>

<demo demo-h3="Icon only" demo-description="Compact icon-only button using btnIconOnly."></demo>
<section demo="component">
    <button pgs="button['btnIconOnly']" type="button" aria-label="Settings">
        <i pgs="icon['icon-star']" aria-hidden="true"></i>
    </button>
</section>

<demo demo-h3="Mini size" demo-description="Smallest button size using btnMini."></demo>
<section demo="component">
    <button pgs="button['btnMini']" type="button">
        Mini
    </button>
</section>

<demo demo-h3="Vertical" demo-description="Stacks the icon above the label using btnVertical, with the same padding on every side."></demo>
<section demo="component">
    <button pgs="button['btnVertical']" type="button">
        <i pgs="icon['icon-star']"></i>
        Vertical
    </button>
</section>

<demo demo-h3="Transparent" demo-description="Only the label shows at rest and it fills like any other button on hover; strong and aria-current still fill in."></demo>
<section demo="component">
    <button pgs="button['btnTransparent']" type="button">
        Read more
    </button>
</section>

<demo demo-h3="Current" demo-description="btnCurrent turns on the look of the button the page is on: aria-current=&quot;page&quot; (a link) or aria-selected=&quot;true&quot; (a tab). It is the flag that reads those attributes, so write it on every button that can be marked current."></demo>
<section demo="component">
    <a pgs="button['btnTransparent' 'btnCurrent']" href="/" aria-current="page">Current page</a>
    <a pgs="button['btnTransparent' 'btnCurrent']" href="/other">Another page</a>
</section>

<demo demo-h3="Text only" demo-description="Only the text, black in every state, with a bottom edge that is secondary on hover and primary when the button is current."></demo>
<section demo="component">
    <button pgs="button['btnText']" type="button">
        Text only
    </button>
</section>

<demo demo-h3="Without hover" demo-description="btnNotHover keeps the button still while the pointer is over it."></demo>
<section demo="component">
    <button pgs="button['btnNotHover']" type="button">
        No hover
    </button>
</section>

<demo demo-h3="Equal padding" demo-description="Sets the same padding on every side using btnPaddingEqual, instead of the wider left/right default."></demo>
<section demo="component">
    <button pgs="button['btnPaddingEqual']" type="button">
        Equal
    </button>
</section>

<demo demo-h3="Primary color" demo-description="Strong button using the primary color palette."></demo>
<section demo="component">
    <button pgs="button['btnPrimary']" type="button">
        Primary
    </button>
</section>

<demo demo-h3="Secondary color" demo-description="Strong button using the secondary color palette."></demo>
<section demo="component">
    <button pgs="button['btnSecondary']" type="button">
        Secondary
    </button>
</section>

<demo demo-h3="Tertiary color" demo-description="Strong button using the tertiary color palette."></demo>
<section demo="component">
    <button pgs="button['btnTertiary']" type="button">
        Tertiary
    </button>
</section>

<demo demo-h3="Quaternary color" demo-description="Strong button using the quaternary color palette."></demo>
<section demo="component">
    <button pgs="button['btnQuaternary']" type="button">
        Quaternary
    </button>
</section>

<demo demo-h3="Checked" demo-description="A label marked as a button wrapping its own checkbox or radio: the input carries the semantics and the keyboard behavior, the button draws the state. Retune the checked look with --button-background-twoState, --button-color-twoState and --button-borderColor-twoState (or, for every button at once, --twoState-background, --twoState-color and --twoState-borderColor)."></demo>
<section demo="component">
    <form pgs="form flex['row' 'gapTexts' 'wrap']" demo="wrapper">
        <label pgs="button['btnTwoState']">
            <input type="checkbox" name="favorite" value="yes">
            <i pgs="icon['icon-star']"></i>
            Add to favorites
        </label>
        <label pgs="button['btnTwoState']">
            <input type="radio" name="plan" value="monthly" checked>
            Monthly
        </label>
        <label pgs="button['btnTwoState']">
            <input type="radio" name="plan" value="yearly">
            Yearly
        </label>
    </form>
</section>
