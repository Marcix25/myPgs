    &lt;input type=&quot;radio&quot; name=&quot;plan&quot; value=&quot;yearly&quot;&gt;
    Yearly
&lt;/label&gt;</code></pre></div></div></section></div><div id="components-icon" pgs="pageNav-panels-content"><section class="demoContent" data-reference="components/icon.html" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h1 class="demoContent-heading demoContent-heading-h1">Icon</h1><p>The glyphs the library draws itself, as inline SVG rather than a font. The token marks the element as an icon and the option chooses which one, so the set is closed: what the stylesheet holds is what can be drawn. Everything myPGS builds and needs to show goes through here — the slide arrows, the close buttons, the marks on alerts, toasts and notifications — which is why the library needs no icon font of its own. The same token is yours to write, so an icon you place by hand costs no dependency either. Written on its own, with no option, it draws nothing and only marks the element as an icon: that is how any icon set you bring gets the same box and placement the library gives an &lt;i&gt;, so a span, an svg or a custom element is sized and positioned like one. It is not boxed: that one is the circular surface a glyph can sit inside, this one is the drawing.</p></div><div class="demoContent-doc" pgs="box accordionContainer" style="padding:10px;"><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>icon</code>: draws a glyph on the element, taking its size from the font size and its colour from the text colour, so it follows whatever surrounds it. Set --icon-size on it, or on anything above it, to size a glyph away from the text around it, and --icon-color to paint it away from the text colour; both are read with a fallback, so an icon that is given neither keeps following its surroundings.</li></ul></div><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS Options (component brackets)</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>icon-arrowLeft</code>: arrow pointing left, for stepping back through a sequence.</li><li><code>iconBoxed</code>: turns the element into the circular surface a glyph sits inside. It is the container and says nothing about what it holds, so a built-in glyph and an icon from any other set sit in it alike.</li><li><code>iconDuo</code>: draws a two-layer version of a glyph instead of the flat one, when that glyph has one (icon-hamburgerTwo does); write it alongside the glyph name, as pgs=&quot;icon[&#39;icon-hamburgerTwo&#39; &#39;iconDuo&#39;]&quot;. Each layer paints on its own pseudo-element, so a component can animate or colour them independently.</li><li><code>iconMedium</code>: sets --icon-size to 2rem, a preset for a glyph that needs to stand out more than the size it inherits from the surrounding text.</li><li><code>iconLarge</code>: sets --icon-size to 3rem, a preset for a glyph large enough to anchor its own section.</li><li><code>icon-arrowRight</code>: arrow pointing right, for stepping forward.</li><li><code>icon-chevronDown</code>: chevron pointing down, for anything that expands in place.</li><li><code>icon-check</code>: tick, for a confirmed or checked state.</li><li><code>icon-close</code>: cross, for dismissing a surface.</li><li><code>icon-magnifyingGlass</code>: magnifying glass, for a search affordance.</li><li><code>icon-moon</code>: crescent moon, the dark half of a theme switch.</li><li><code>icon-sun</code>: sun, the light half of a theme switch.</li><li><code>icon-cookie</code>: biscuit, used by the consent notice.</li><li><code>icon-sliders</code>: three sliders, for preferences.</li><li><code>icon-circle</code>: plain disc, for a step that is only a position in a sequence.</li><li><code>icon-circleXmark</code>: cross inside a disc, the error mark.</li><li><code>icon-circleCheck</code>: tick inside a disc, the success mark.</li><li><code>icon-circleInfo</code>: letter i inside a disc, the information mark.</li><li><code>icon-triangleExclamation</code>: exclamation mark inside a triangle, the warning mark.</li><li><code>icon-bell</code>: bell, for anything that announces something arriving.</li><li><code>icon-star</code>: star, the neutral stand-in glyph for an example that needs one without it meaning anything.</li><li><code>icon-hamburger</code>: three horizontal bars, the classic static hamburger menu glyph.</li><li><code>icon-hamburgerTwo</code>: two horizontal bars, a lighter static hamburger menu glyph; add duo for the two-layer version, each bar on its own pseudo-element so a component can animate them into a close mark.</li><li><code>icon-calendar</code>: calendar, for a date.</li><li><code>icon-chatBubble</code>: chat bubble, for a message or a comment.</li><li><code>icon-clock</code>: clock, for a time or a duration.</li><li><code>icon-download</code>: arrow into a tray, for downloading a file.</li><li><code>icon-envelope</code>: envelope, for an email or a message.</li><li><code>icon-eye</code>: eye, for showing or previewing something hidden.</li><li><code>icon-gear</code>: gear, for settings or configuration.</li><li><code>icon-heart</code>: heart, for favouriting or liking something.</li><li><code>icon-home</code>: house, for a homepage or a starting point.</li><li><code>icon-lock</code>: padlock, for something protected or restricted.</li><li><code>icon-mapPin</code>: map pin, for a location or an address.</li><li><code>icon-minus</code>: minus sign, for collapsing or decreasing a value.</li><li><code>icon-pause</code>: two bars, for pausing playback.</li><li><code>icon-pencil</code>: pencil, for editing.</li><li><code>icon-play</code>: triangle, for starting playback.</li><li><code>icon-plus</code>: plus sign, for adding or increasing a value.</li><li><code>icon-trash</code>: bin, for deleting something.</li><li><code>icon-upload</code>: arrow out of a tray, for uploading a file.</li><li><code>icon-user</code>: person, for an account or a profile.</li><li><code>icon-ellipsis</code>: three vertical dots, for a secondary &quot;more actions&quot; menu.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>flex</code>: provides the flex layout; direction and spacing are flags in its bracket.</li><li><code>textColor</code>: provides the text-color utility used here, to show that a glyph follows the text colour.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>column</code>: stacks the groups of examples.</li><li><code>row</code>: lays each group out in a row.</li><li><code>gapTexts</code>: spaces the icons inside a group.</li><li><code>wrap</code>: lets the full set flow onto more rows.</li><li><code>txtPrimary</code>: inside textColor&#39;s own bracket, recolours one example.</li><li><code>txtError</code>: inside textColor&#39;s own bracket, recolours another the same way.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">Other</h5><ul pgs="flex['column' 'gapTexts']"><li><code>gapSections</code>: separates the groups.</li></ul></div></div></div><div class="demoContent-doc-cssVariables" pgs="accordion"><h4 pgs="accordion-button">CSS Variables</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>--icon-color</code></li><li><code>--icon-glyph-arrowLeft</code></li><li><code>--icon-glyph-arrowRight</code></li><li><code>--icon-glyph-bell</code></li><li><code>--icon-glyph-calendar</code></li><li><code>--icon-glyph-chatBubble</code></li><li><code>--icon-glyph-check</code></li><li><code>--icon-glyph-chevronDown</code></li><li><code>--icon-glyph-circle</code></li><li><code>--icon-glyph-circleCheck</code></li><li><code>--icon-glyph-circleInfo</code></li><li><code>--icon-glyph-circleXmark</code></li><li><code>--icon-glyph-clock</code></li><li><code>--icon-glyph-close</code></li><li><code>--icon-glyph-cookie</code></li><li><code>--icon-glyph-download</code></li><li><code>--icon-glyph-ellipsis</code></li><li><code>--icon-glyph-envelope</code></li><li><code>--icon-glyph-eye</code></li><li><code>--icon-glyph-gear</code></li><li><code>--icon-glyph-hamburger</code></li><li><code>--icon-glyph-hamburgerTwo</code></li><li><code>--icon-glyph-heart</code></li><li><code>--icon-glyph-home</code></li><li><code>--icon-glyph-lock</code></li><li><code>--icon-glyph-magnifyingGlass</code></li><li><code>--icon-glyph-mapPin</code></li><li><code>--icon-glyph-minus</code></li><li><code>--icon-glyph-moon</code></li><li><code>--icon-glyph-pause</code></li><li><code>--icon-glyph-pencil</code></li><li><code>--icon-glyph-play</code></li><li><code>--icon-glyph-plus</code></li><li><code>--icon-glyph-sliders</code></li><li><code>--icon-glyph-star</code></li><li><code>--icon-glyph-sun</code></li><li><code>--icon-glyph-trash</code></li><li><code>--icon-glyph-triangleExclamation</code></li><li><code>--icon-glyph-upload</code></li><li><code>--icon-glyph-user</code></li><li><code>--icon-size</code></li></ul></div></div><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h2 class="demoContent-heading demoContent-heading-h2">Examples</h2></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">The set</h3><p>Every glyph the library can draw. The token marks the element, the option names the glyph.</p></div><div pgs="container flex['column' 'gapElements']"><section>

button</code>: draws the chip, which composes the button look instead of redrawing it, and hides the checkbox or radio it wraps; see Button.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>column</code>: vertically arranges each example with its heading and control.</li><li><code>row</code>: horizontally arranges standalone chip controls.</li><li><code>gapElements</code>: applies element spacing between the form add-on examples.</li><li><code>icon-star</code>: the neutral stand-in glyph, used where the example needs an icon but not a particular one.</li><li><code>btnMini</code>: sizes that button down to the chip&#39;s compact size.</li></ul></div></div></div></div><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h2 class="demoContent-heading demoContent-heading-h2">Examples</h2></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Checkbox with background</h3><p>A single checkbox presented as a selectable container, with the checked state highlighted.</p></div><div pgs="container flex['column' 'gapElements']"><section pgs="flex['column']">

oes.</li><li><code>inputUnset</code>: written on an input, it keeps the library from styling that field, leaving the browser&#39;s own control in place. It is the opt-out for a field the page styles itself, or one a third-party script owns.</li><li><code>labelUnset</code>: written on a label, it keeps the library from styling it as a field label. The form styles a label only when it wraps or precedes a control, so this is the way out for a label that does both and should stay plain.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS Data</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>formMessage</code>: defines a field-specific message with the syntax formMessage[Message text].</li><li><code>formMessageTitle</code>: defines a field-specific alert title with the syntax formMessageTitle[Title text].</li><li><code>formFieldErrorTitle</code>: defines the fallback title for validation errors on the form.</li><li><code>formFieldError</code>: defines the fallback description for one invalid field.</li><li><code>formFieldsError</code>: defines the summary shown when multiple fields are invalid.</li><li><code>formSuccessTitle</code>: defines the validation success title.</li><li><code>formSuccess</code>: defines the validation success description.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS States</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>errorForm</code>: is applied at runtime to a form that fails validation.</li><li><code>errorField</code>: is applied at runtime to each field that fails validation.</li><li><code>success</code>: is applied at runtime to the form after successful validation.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">API</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>new pgs.formValidate(form, options)</code>: creates a utility associated directly with the form, adds novalidate, and completes missing form message options (formFieldErrorTitle, formFieldError, formFieldsError, formSuccessTitle, formSuccess) from options.message and then from library defaults; existing pgs-data values are preserved.</li><li><code>instance.validator(callback, eventName)</code>: intercepts the specified event, clears previous temporary field errors, validates the form, shows the success message, and invokes callback only when valid; eventName defaults to submit.</li><li><code>instance.validate()</code>: validates required fields, updates state attributes, and returns true or false.</li><li><code>instance.success(description, title)</code>: validates the form and shows a success alert or toast when there are no errors.</li><li><code>instance.addNewRule(rule)</code>: adds a function that returns one or more invalid fields; validate automatically marks each returned field as invalid.</li><li><code>instance.temporaryFieldError.set(field, options)</code>: registers a temporary field error and validates the form; options accepts title and message, or it can be the message string.</li><li><code>instance.temporaryFieldError.remove(field)</code>: removes a temporary error and its visual state from one field.</li><li><code>instance.temporaryFieldError.clear()</code>: removes all temporary field errors and their visual states.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>flex</code>: provides the flex layout; direction and spacing are flags in its bracket.</li><li><code>button</code>: provides the base styling for the primary submit action.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>column</code>: spaces text elements in the radio group.</li><li><code>btnStrong</code>: presents form submission as the primary action.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">Other</h5><ul pgs="flex['column' 'gapTexts']"><li><code>alertContainer</code>: is found or created automatically by the alert API when form validation uses inline alerts.</li></ul></div></div></div></div><div class="exampleSource" data-kind="js"><strong class="exampleSource-title">JavaScript Usage</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-js">import { pgs } from &quot;mypgs&quot;;

const form = pgs(document).querySelector(&quot;form&quot;);

const password = form.querySelector(&#39;input[name=&quot;password&quot;]&#39;);
const confirmPassword = form.querySelector(&#39;input[name=&quot;confirmPassword&quot;]&#39;);
if (!password || !confirmPassword) return;

const formValidate = new pgs.formValidate(form, {
    typeNotice: &quot;alert&quot;
});

//== new roules
formValidate.addNewRule(() =&gt; {
    if (password.value &amp;&amp; confirmPassword.value &amp;&amp; password.value !== confirmPassword.value) {
        pgs(confirmPassword).data.setValueBrackets(&quot;formMessage&quot;, &quot;Passwords do not match&quot;);
        return [confirmPassword, password];
    }
});

//== validate
formValidate.validator(event =&gt; {
    const values = Object.fromEntries(new FormData(form));

    // Replace this log with a request to your backend.
    console.log(values);
}, &quot;submit&quot;);</code></pre></div><div pgs="container flex['column' 'gapElements']"><form pgs="form" pgs-data="formFieldErrorTitle[Check the form] formFieldError[Complete this field] formFieldsError[Complete all required fields] formSuccessTitle[Submitted] formSuccess[Submitted successfully]" action="#" method="post">

searchPlaceholder</code>: overrides the placeholder message shown below minLength, as searchPlaceholder[your text]. Write {minLength} in it to insert the configured minLength; defaults to &quot;Type at least {minLength} characters&quot;.</li><li><code>searchNoResults</code>: overrides the message shown when a search returns no items, as searchNoResults[your text]. Defaults to &quot;No results found&quot;.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS States</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>open</code>: identifies the open element used by Search.</li><li><code>loading</code>: identifies the loading element used by Search.</li><li><code>error</code>: identifies the error element used by Search.</li><li><code>selected</code>: identifies the selected element used by Search.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">API</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>pgs.search.init(root)</code>: initializes matching elements within the specified root.</li><li><code>pgs.search.api(element)</code>: returns the instance associated with the specified initialized element.</li><li><code>instance.configure(options)</code>: provides the documented operation through the component public API.</li><li><code>instance.setSource(source)</code>: provides the documented operation through the component public API.</li><li><code>instance.search(query)</code>: provides the documented operation through the component public API.</li><li><code>instance.open()</code>: opens the component.</li><li><code>instance.close()</code>: closes the component.</li><li><code>instance.clear()</code>: provides the documented operation through the component public API.</li><li><code>instance.cancel()</code>: annulla debounce e richiesta attiva.</li><li><code>instance.select(index, submit)</code>: provides the documented operation through the component public API.</li><li><code>instance.refresh()</code>: refreshes the component and returns its updated instance.</li><li><code>instance.destroy()</code>: removes listeners and releases the component instance.</li><li><code>instance.items()</code>: provides the documented operation through the component public API.</li><li><code>instance.isOpen()</code>: returns true when the component is open.</li><li><code>instance.isLoading()</code>: returns true while the component is loading.</li><li><code>instance.setActiveIndex(index)</code>: provides the documented operation through the component public API.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>flex</code>: provides the flex layout; direction and spacing are flags in its bracket.</li><li><code>button</code>: provides the base styling for search controls.</li><li><code>modal</code>: uses the related modal component or utility in this example.</li><li><code>modal-button</code>: uses the related modal-button component or utility in this example.</li><li><code>modal-close</code>: uses the related modal-close component or utility in this example.</li><li><code>section</code>: uses the related section component or utility in this example.</li><li><code>icon</code>: draws the glyph at the start of every suggestion; see Icon for the whole set.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>row</code>: sets the horizontal direction inside the flex bracket.</li><li><code>hoverNot</code>: disables hover behavior on the search container.</li><li><code>btnIconOnly</code>: presents search and close actions as icon buttons.</li><li><code>btnTransparent</code>: keeps the submit button flat inside the field, so only the icon shows.</li><li><code>icon-magnifyingGlass</code>: the glyph used there.</li><li><code>icon-close</code>: the cross that dismisses.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Data</h5><ul pgs="flex['column' 'gapTexts']"><li><code>modalContainerPGS</code>: identifies the modalContainerPGS element used by Search.</li></ul></div></div></div><div class="demoContent-doc-cssVariables" pgs="accordion"><h4 pgs="accordion-button">CSS Variables</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>--search-suggestions-background</code></li><li><code>--search-suggestions-border</code></li><li><code>--search-suggestions-borderRadius</code></li><li><code>--search-suggestions-boxShadow</code></li><li><code>--search-suggestions-color</code></li><li><code>--search-suggestions-gap</code></li><li><code>--search-suggestions-item-padding</code></li><li><code>--search-suggestions-item-selected-background</code></li><li><code>--search-suggestions-item-selected-color</code></li><li><code>--search-suggestions-maxHeight</code></li><li><code>--search-suggestions-offset</code></li><li><code>--search-suggestions-padding</code></li></ul></div></div><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h2 class="demoContent-heading demoContent-heading-h2">Examples</h2></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Inline search</h3><p>Search field with live suggestions embedded directly in the page.</p></div><div pgs="container flex['column' 'gapElements']"><section>

&lt;/form&gt;</code></pre></div></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Mobile search overlay</h3><p>Search opened from an icon button inside a full-width modal, intended for the mobile navigation.</p></div><div pgs="container flex['column' 'gapElements']"><section>

&lt;/div&gt;</code></pre></div></div></section></div><div id="components-summary" pgs="pageNav-panels-content"><section class="demoContent" data-reference="components/summary.html" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h1 class="demoContent-heading demoContent-heading-h1">Summary</h1><p>Long content collapsed to a few lines, with a button that expands it. The module measures the content against the collapsed height, --summary-lines lines of text (3 by default), and only shows the button when there is something hidden: content that already fits keeps the button out of the page and out of the accessibility tree, so nothing offers to expand what is fully visible. A button written in the markup is used as is; without one the module generates it, and its two labels come from the showMore and showLess options, then from the options passed to init, then from the English defaults.</p></div><div class="demoContent-doc" pgs="box accordionContainer" style="padding:10px;"><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>summary</code>: identifies the root the module initializes, and the element the instance is stored against.</li><li><code>summary-content</code>: the collapsed content, cut to --summary-lines lines while it is closed.</li><li><code>summary-button</code>: the control that expands and collapses the content. Write it to place it yourself; leave it out and the module generates one.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS Data</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>showMore</code>: defines the collapsed button text through `showMore[...]`.</li><li><code>showLess</code>: defines the expanded button text through `showLess[...]`.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS States</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>overflow</code>: written by the module while the content is taller than its collapsed height, which is also what decides whether the button is shown at all.</li><li><code>open</code>: written while the content is expanded.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">API</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>pgs.summary.init(root, options)</code>: initializes matching elements; missing `pgs-data` texts use `options.message.showMore` and `options.message.showLess`, then the English library defaults.</li><li><code>pgs.summary.api(element)</code>: returns the instance associated with the specified initialized element.</li><li><code>instance.open()</code>: expands the content.</li><li><code>instance.close()</code>: collapses the content.</li><li><code>instance.toggle()</code>: expands the content, or collapses it when it is already expanded.</li><li><code>instance.refresh()</code>: measures the content again and returns the instance, after the text or the width has changed.</li><li><code>instance.isOpen()</code>: returns true while the content is expanded.</li></ul></div><div class="demoContent-doc-cssVariables" pgs="accordion"><h4 pgs="accordion-button">CSS Variables</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>--summary-fade-background</code></li><li><code>--summary-fade-size</code></li><li><code>--summary-lines</code></li></ul></div></div><div pgs="container flex['column' 'gapElements']"><div pgs="summary" pgs-data="showMore[Show more] showLess[Show less]">

gs="accordion"><h4 pgs="accordion-button">API</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>pgs.menu.init(root)</code>: initializes matching elements within the specified root.</li><li><code>pgs.menu.api(element)</code>: returns the instance associated with the specified initialized element.</li><li><code>instance.refresh()</code>: refreshes the component and returns its updated instance.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>flex</code>: provides the flex layout; direction and spacing are flags in its bracket.</li><li><code>button</code>: styles a menu link, now that the menu no longer does it itself.</li><li><code>icon</code>: draws the glyphs this example shows; see Icon for the whole set.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>btnTransparent</code>: the appearance a navigation link takes, whatever the menu&#39;s direction; see Button for the whole set of variants.</li><li><code>row</code>: lays the top-level list out as a row, so a long menu can be measured against the space it has.</li><li><code>wrap</code>: lets that row break onto a second line instead of overflowing.</li><li><code>icon-circle</code>: a plain disc, standing in for a section icon.</li><li><code>icon-circleInfo</code>: the information mark.</li><li><code>icon-sliders</code>: the sliders glyph, standing in for a section icon.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">Other</h5><ul pgs="flex['column' 'gapTexts']"><li><code>dropdown</code>: uses the related dropdown component or utility in this example.</li><li><code>dropdo d width option sizes.</li><li><code>modal-dialog-content-header</code>: the fixed heading area at the top of the panel; it is also what takes focus when the dialog opens.</li><li><code>modal-dialog-content-scroll</code>: the part of the panel that scrolls, leaving the header and anything beside it still.</li><li><code>modal-close</code>: write one yourself, bare like this, anywhere inside the wrapper or the dialog to place the close button yourself; the module leaves it alone and never generates a second one.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS generated by JavaScript</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>modal-dialog</code>: added to the dialog element on initialization, which is why the example writes a bare dialog tag.</li><li><code>_dialog</code>: added alongside modal-dialog to carry whichever options were authored on the wrapper; never write it by hand.</li><li><code>_modal-close</code>: appended to the content header, or to the dialog itself when there is no header, when no modal-close was written by hand.</li></ul></div><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS Options (component brackets)</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>dialogBottom</code>: aligns the dialog content to the bottom of the viewport.</li><li><code>dialogCenter</code>: centers the dialog content both horizontally and vertically; this is also the default, so it only matters when combined with a component that changes that default.</li><li><code>dialogDisableBackdropClose</code>: keeps a click on the backdrop from closing the dialog, so it only closes through its own controls or its API.</li><li><code>dialogFull</code>: expands the dialog content to the full width of the viewport, instead of capping it at the page width.</li><li><code>dialogLeft</code>: aligns the dialog content to the left of the viewport.</li><li><code>dialogMedium</code>: shrinks the dialog content to half the page width instead of filling the viewport.</li><li><code>dialogMini</code>: shrinks the dialog content to a compact width (max 400px) instead of filling the viewport.</li><li><code>dialogRight</code>: aligns the dialog content to the right of the viewport.</li><li><code>dialogTop</code>: aligns the dialog content to the top of the viewport.</li><li><code>dialogTopLevel</code>: leaves the dialog inside its wrapper and opens it with showModal(), on the browser&#39;s top layer above everything else, instead of moving it into a container and opening it with show().</li><li><code>dialogHistory</code>: writes ?modal=&lt;id of the opening button&gt; into the URL while the dialog is open, and opens or closes it again on back and forward. It needs a modal-button with an id.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS Data</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>modalContainerID</code>: moves the dialog into the element with this id instead of the body, with the syntax modalContainerID[myContainer] — the id is written without the #.</li><li><code>modalContainerPGS</code>: moves the dialog into the first element carrying this pgs token instead of the body, with the syntax modalContainerPGS[header].</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">API</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>pgs.modal.init(root)</code>: initializes matching elements within the specified root.</li><li><code>pgs.modal.api(element)</code>: returns the instance associated with the specified initialized element.</li><li><code>instance.open()</code>: opens the dialog, and does nothing when it is already open.</li><li><code>instance.close()</code>: closes the dialog.</li><li><code>instance.toggle()</code>: opens the dialog, or closes it when it is already open.</li><li><code>instance.refresh()</code>: re-reads the dialog and the options, and returns the updated instance.</li><li><code>instance.isOpen()</code>: returns true while the dialog is open.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>flex</code>: provides the flex layout; direction and spacing are flags in its bracket.</li><li><code>modal-container-pgs-demo</code>: demo-only target token for the modalContainerPGS example; write your own token on your own real target instead.</li><li><code>button</code>: uses the related button component or utility in this example.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>column</code>: vertically organizes modal content.</li><li><code>gapElements</code>: applies element spacing to modal content.</li><li><code>row</code>: arranges the dialog actions in a row.</li><li><code>justifyEnd</code>: pushes the dialog actions to the end of that row.</li><li><code>btnStrong</code>: applies stronger emphasis to the save action.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">Other</h5><ul pgs="flex['column' 'gapTexts']"><li><code>icon</code>: draws the cross inside the generated close button; see Icon for the whole set.</li><li><code>icon-close</code>: the glyph in that button.</li></ul></div></div></div><div class="demoContent-doc-cssVariables" pgs="accordion"><h4 pgs="accordion-button">CSS Variables</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>--modal-backdrop</code></li><li><code>--modal-background</code></li><li><code>--modal-borderRadius</code></li><li><code>--modal-color</code></li><li><code>--modal-content-padding</code></li><li><code>--modal-offset</code></li></ul></div></div><div class="demo panels-content</code>: identifies one panel, addressed by its own id. Hidden by default, with no [hidden] to write by hand — give its own content&#39;s layout to an inner wrapper, not to this element.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS States</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>active</code>: identifies the visible panel; the module writes it, and reads it back on a hashless load to honour one already marked in the markup, the same convention Tabs uses. A link&#39;s own selected state is separate, aria-current=&quot;page&quot;, not pgs-state.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">API</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>pgs.pageNav.init(root)</code>: initializes pageNav inside the specified Document or Element, including the root when it is pageNav.</li><li><code>pgs.pageNav.api(element)</code>: returns the instance associated with an initialized pageNav root.</li><li><code>instance.select(id)</code>: navigates to the panel with that id, the same as following a link to #id.</li><li><code>instance.getCurrent()</code>: returns the currently visible panel element.</li><li><code>instance.refresh()</code>: re-initializes the root and returns the new instance.</li></ul></div></div><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h2 class="demoContent-heading demoContent-heading-h2">Examples</h2></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Page Nav</h3><p>Two independent lists of links, kept in sync, switching the same set of full panels by hash. Only one pageNav can exist on a page — usually pgs=&quot;pageNav&quot; on the body itself — so this is markup to copy and adapt, not a live preview to click through.</p></div><div pgs="hidden"><section>
    <div pgs="pageNav">
        <div pgs="pageNav-list" aria-label="Sections">
            <a href="#pageNav-html" pgs="pageNav-list-item">HTML</a>
            <a href="#pageNav-react" pgs="pageNav-list-item">React</a>
            <a href="#pageNav-vue" pgs="pageNav-list-item">Vue</a>
        </div>

        <!-- a second, independent list of links to the same panels, kept in sync automatically -->
        <div pgs="pageNav-list" aria-label="Sections (copy)">
            <a href="#pageNav-html" pgs="pageNav-list-item">HTML</a>
            <a href="#pageNav-react" pgs="pageNav-list-item">React</a>
            <a href="#pageNav-vue" pgs="pageNav-list-item">Vue</a>
        </div>

        <div pgs="pageNav-panels">

            </section>

            </section>
        </div>
    </div>
</section></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;div pgs=&quot;pageNav&quot;&gt;
    &lt;div pgs=&quot;pageNav-list&quot; aria-label=&quot;Sections&quot;&gt;
        &lt;a href=&quot;#pageNav-html&quot; pgs=&quot;pageNav-list-item&quot;&gt;HTML&lt;/a&gt;

    &lt;/div&gt;

    &lt;!-- a second, independent list of links to the same panels, kept in sync automatically --&gt;
    &lt;div pgs=&quot;pageNav-list&quot; aria-label=&quot;Sections (copy)&quot;&gt;
        &lt;a href=&quot;#pageNav-html&quot; pgs=&quot;pageNav-list-item&quot;&gt;HTML&lt;/a&gt;
        &lt;a href=&quot;#pageNav-react&quot; pgs=&quot;pageNav-list-item&quot;&gt;React&lt;/a&gt;
        &lt;a href=&quot;#pageNav-vue&quot; pgs=&quot;pageNav-list-item&quot;&gt;Vue&lt;/a&gt;
    &lt;/div&gt;

    &lt;div pgs=&quot;pageNav-panels&quot;&gt;
        &lt;section id=&quot;pageNav-html&quot; pgs=&quot;pageNav-panels-content&quot;&gt;

            &lt;p&gt;Semantic markup ready to copy into a page.&lt;/p&gt;
        &lt;/section&gt;
        &lt;section id=&quot;pageNav-react&quot; pgs=&quot;pageNav-panels-content&quot;&gt;

            &lt;p&gt;The same structure written in JSX with pgs attributes.&lt;/p&gt;
        &lt;/section&gt;
        &lt;section id=&quot;pageNav-vue&quot; pgs=&quot;pageNav-panels-content&quot;&gt;
            &lt;h3&gt;Vue&lt;/h3&gt;
            &lt;p&gt;Component markup ready for a Vue template.&lt;/p&gt;
        &lt;/section&gt;
    &lt;/div&gt;
&lt;/div&gt;</code></pre></div></div></section></div><div id="components-stepTabs" pgs="pageNav-panels-content"><section class="demoContent" data-reference="components/stepTabs.html" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h1 class="demoContent-heading demoContent-heading-h1">Step Tabs</h1><p>A step-by-step wizard: one panel at a time, a row of dots showing where the reader is, and previous, next and restart controls the module enables and disables for you. A step marked is-locked in the markup blocks the next button until something unlocks it, which is how a form gates its own progress; restart returns to the first step and puts those locks back exactly as the markup declared them, whatever was unlocked in between. Moving to a step scrolls the wizard into view and focuses the panel, unless it sits inside a dialog, and dispatches pgs:stepTabs:change on the root with detail { current, total }, current being zero-based.</p></div><div class="demoContent-doc" pgs="box accordionContainer" style="padding:10px;"><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>stepTabs</code>: identifies the root the module initializes, and the element the instance is stored against.</li><li><code>stepTabs-dots</code>: the row the dots are built into; its content is replaced on initialization, one dot per step. (Optional)</li><li><code>stepTabs-container</code>: the wrapper holding the steps, and the only place the module looks for them.</li><li><code>stepTabs-container-tab</code>: one step, shown when it is the current one.</li><li><code>stepTabs-prev</code>: the control that goes back a step; the module disables it on the first one.</li><li><code>stepTabs-restart</code>: the control that returns to the first step and restores the locks the markup declared.</li><li><code>stepTabs-next</code>: the control that goes on a step; the module disables it on the last one, and on a step marked is-locked.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS generated by JavaScript</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>_stepTabs-dots-dot</code>: one dot per tab, created inside stepTabs-dots, showing the icon declared by that tab&#39;s stepTabsIcon option.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS Data</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>stepTabsIcon</code>: the icon drawn in this tab&#39;s dot, in brackets, in one of three shapes. Markup, opening with a &quot;&lt;&quot;, is built as written, which is what puts every icon set in reach — including the ones a class cannot describe, such as stepTabsIcon[&lt;span class=&#39;material-symbols-outlined&#39;&gt;check&lt;/span&gt;] or stepTabsIcon[&lt;i data-lucide=&#39;check&#39;&gt;&lt;/i&gt;]; write the inner attributes with single quotes, since the value already lives inside one, and mark your own element with pgs=&#39;icon&#39; so it gets the same box the dot gives an icon — without it a set that renders its name as text has nothing sizing it. A plain name is a built-in glyph, as in stepTabsIcon[icon-circleCheck]. Anything else is a class list for whatever set the page loaded, written through untouched, as in stepTabsIcon[bi-check] or stepTabsIcon[fa-regular fa-star]; a lone Font Awesome name such as stepTabsIcon[fa-user] also gets fa-solid, since that set needs a style class. Leave it out and the dot gets icon-circle.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS States</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>is-active</code>: written by the module on the current step and on its dot.</li><li><code>is-completed</code>: written by the module on the dots of the steps already behind the current one.</li><li><code>is-locked</code>: the one state written by hand as well: a step carrying it holds the next button down until it is taken off, and restart puts it back on every step that had it.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">API</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>pgs.stepTabs.init(root)</code>: initializes matching elements within the specified root.</li><li><code>pgs.stepTabs.api(element)</code>: returns the instance associated with the specified initialized element.</li><li><code>instance.restart()</code>: returns to the first tab and restores the locks declared in the markup.</li><li><code>instance.goTo(index, scroll)</code>: moves to the zero-based step, clamped to the ones that exist; pass false as the second argument to move without scrolling the wizard into view.</li><li><code>instance.next()</code>: moves on a step.</li><li><code>instance.prev()</code>: moves back a step.</li><li><code>instance.toggleLock(index, lock)</code>: locks or unlocks the step at that position, lock defaulting to true, and redraws the controls.</li><li><code>instance.refresh()</code>: initializes the wizard again and returns the updated instance.</li><li><code>instance.getCurrent()</code>: returns the zero-based index of the current step.</li><li><code>instance.getState()</code>: returns { current, total }, the same detail the change event carries.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>flex</code>: provides the flex layout; direction and spacing are flags in its bracket.</li><li><code>button</code>: uses the related button component or utility in this example.</li><li><code>icon</code>: draws the glyph inside a dot when the tab does not name its own; see Icon for the whole set.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>column</code>: sets the vertical direction inside the flex bracket.</li><li><code>gapElements</code>: applies element spacing to the step tab container.</li><li><code>row</code>: sets the horizontal direction inside the flex bracket.</li><li><code>btnReverse</code>: reverses text and icon on the example buttons and belongs to the button component.</li><li><code>icon-arrowLeft</code>: the glyph that points back.</li><li><code>icon-arrowRight</code>: the glyph that points forward.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">Other</h5><ul pgs="flex['column' 'gapTexts']"><li><code>icon-circle</code>: the glyph a dot gets by default.</li></ul></div></div></div></div><div pgs="container flex['column' 'gapElements']"><div pgs="stepTabs flex['column' 'gapElements']">
    <div pgs="stepTabs-dots" aria-label="Progress"></div>

    <div pgs="stepTabs-container">
        <section pgs="stepTabs-container-tab flex['column']" pgs-data="stepTabsIcon[<i pgs=&quot;icon['icon-circle']&quot;></i>]" tabindex="-1">
            <h3>Lorem ipsum dolor</h3>
            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
        </section>

        <section pgs="stepTabs-container-tab flex['column']" pgs-data="stepTabsIcon[<i pgs=&quot;icon['icon-sliders']&quot;></i>]" tabindex="-1">
            <h3>Sit amet consectetur</h3>
            <p>Sed do eiusmod tempor incididunt ut labore et dolore.</p>
        </section>

        <section pgs="stepTabs-container-tab flex['column']" pgs-data="stepTabsIcon[<i pgs=&quot;icon['icon-check']&quot;></i>]" tabindex="-1">
            <h3>Adipiscing elit sed</h3>
            <p>Ut enim ad minim veniam, quis nostrud exercitation.</p>
        </section>
    </div>

    <div pgs="flex['row']">
        <button pgs="stepTabs-prev button" type="button">
            <i pgs="icon['icon-arrowLeft']" aria-hidden="true"></i>
            Back
        </button>

        <button pgs="stepTabs-restart button" type="button">
            Restart
        </button>

        <button pgs="stepTabs-next button['btnReverse']" type="button">
            Next
            <i pgs="icon['icon-arrowRight']" aria-hidden="true"></i>
        </button>
    </div>
</div></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;div pgs=&quot;stepTabs flex[&#39;column&#39; &#39;gapElements&#39;]&quot;&gt;
    &lt;div pgs=&quot;stepTabs-dots&quot; aria-label=&quot;Progress&quot;&gt;&lt;/div&gt;

    &lt;div pgs=&quot;stepTabs-container&quot;&gt;
        &lt;section pgs=&quot;stepTabs-container-tab flex[&#39;column&#39;]&quot; pgs-data=&quot;stepTabsIcon[&lt;i pgs=&amp;quot;icon[&#39;icon-circle&#39;]&amp;quot;&gt;&lt;/i&gt;]&quot; tabindex=&quot;-1&quot;&gt;
            &lt;h3&gt;Lorem ipsum dolor&lt;/h3&gt;
            &lt;p&gt;Lorem ipsum dolor sit amet, consectetur adipiscing elit.&lt;/p&gt;
        &lt;/section&gt;

        &lt;section pgs=&quot;stepTabs-container-tab flex[&#39;column&#39;]&quot; pgs-data=&quot;stepTabsIcon[&lt;i pgs=&amp;quot;icon[&#39;icon-sliders&#39;]&amp;quot;&gt;&lt;/i&gt;]&quot; tabindex=&quot;-1&quot;&gt;
            &lt;h3&gt;Sit amet consectetur&lt;/h3&gt;
            &lt;p&gt;Sed do eiusmod tempor incididunt ut labore et dolore.&lt;/p&gt;
        &lt;/section&gt;

        &lt;section pgs=&quot;stepTabs-container-tab flex[&#39;column&#39;]&quot; pgs-data=&quot;stepTabsIcon[&lt;i pgs=&amp;quot;icon[&#39;icon-check&#39;]&amp;quot;&gt;&lt;/i&gt;]&quot; tabindex=&quot;-1&quot;&gt;
            &lt;h3&gt;Adipiscing elit sed&lt;/h3&gt;
            &lt;p&gt;Ut enim ad minim veniam, quis nostrud exercitation.&lt;/p&gt;
        &lt;/section&gt;
    &lt;/div&gt;

    &lt;div pgs=&quot;flex[&#39;row&#39;]&quot;&gt;
        &lt;button pgs=&quot;stepTabs-prev button&quot; type=&quot;button&quot;&gt;
            &lt;i pgs=&quot;icon[&#39;icon-arrowLeft&#39;]&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
            Back
        &lt;/button&gt;

        &lt;button pgs=&quot;stepTabs-restart button&quot; type=&quot;button&quot;&gt;
            Restart
        &lt;/button&gt;

        &lt;button pgs=&quot;stepTabs-next button[&#39;btnReverse&#39;]&quot; type=&quot;button&quot;&gt;
            Next
            &lt;i pgs=&quot;icon[&#39;icon-arrowRight&#39;]&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;

s 1-based position otherwise, as ?tab=2.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS States</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>active</code>: identifies the selected tab and its visible panel; the first pair is selected when no pair starts active, and a tab named in the URL by tabsHistory wins over both.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">API</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>pgs.tabs.init(root)</code>: initializes tabs inside the specified Document or Element, including the root when it is tabs.</li><li><code>pgs.tabs.api(element)</code>: returns the instance associated with an initialized tabs root.</li><li><code>instance.select(index)</code>: selects the zero-based tab and its matching panel.</li><li><code>instance.getCurrent()</code>: returns the zero-based index of the selected tab.</li><li><code>instance.refresh()</code>: returns the existing instance after initialization is requested again.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>flex</code>: provides the flex layout; direction and spacing are flags in its bracket.</li><li><code>card</code>: provides the outer surface for this example.</li><li><code>card-content</code>: provides the spacing wrapper around the tab list and panels.</li><li><code>button</code>: supplies the base style for each tab control.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>row</code>: lets the tab controls wrap in a row.</li><li><code>btnMini</code>: makes each tab control compact.</li></ul></div></div></div></div>< asts until the reader works that panel themselves: the first time it is opened or closed by hand the module drops the token, and from there it is an ordinary panel of the group. It is the authored form of the open state: pgs-state belongs to the runtime, and the module writes it from here.</li><li><code>accMultiOpen</code>: written on an accordionContainer, it lifts the one-at-a-time rule for that group, so its panels can be open together. Without a container this is already the behaviour, so the option only means something on the container.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS States</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>open</code>: indicates the accordion element that is currently open and visible. It styles only that accordion&#39;s own button and content, so an accordion nested inside an open panel keeps its own closed state.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">API</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>pgs.accordion.init(root)</code>: initializes unregistered accordions within the specified Document or Element.</li><li><code>pgs.accordion.api(element)</code>: returns the instance associated with an initialized accordion root.</li><li><code>instance.open()</code>: opens the panel and, inside an accordionContainer without accMultiOpen, closes the other panels of the same group.</li><li><code>instance.close()</code>: closes the current panel.</li><li><code>instance.toggle()</code>: toggles the panel between its open and closed states.</li><li><code>instance.refresh()</code>: reruns initialization within the accordion container and returns the instance.</li><li><code>instance.isOpen()</code>: returns true when the open state is active.</li></ul></div><div class="demoContent-doc-cssVariables" pgs="accordion"><h4 pgs="accordion-button">CSS Variables</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>--accordion-background</code></li><li><code>--accordion-background-open</code></li><li><code>--accordion-borderRadius</code></li><li><code>--accordion-icon</code></li><li><code>--accordion-padding</code></li><li><code>--accordion-timing</code></li></ul></div></div><div pgs="container flex['column' 'gapElements']"><ul pgs="accordionContainer">

s a condition that requires attention.</li><li><code>error</code>: presents a failure or blocking problem.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">API</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>pgs.alert.error(options)</code>: creates an error alert and renders it in a managed container when root or container is provided.</li><li><code>pgs.alert.success(options)</code>: creates a success alert and renders it in a managed container when root or container is provided.</li><li><code>pgs.alert.info(options)</code>: creates an informational alert and renders it in a managed container when root or container is provided.</li><li><code>pgs.alert.warning(options)</code>: creates a warning alert and renders it in a managed container when root or container is provided.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>flex</code>: provides the flex layout; direction and spacing are flags in its bracket.</li><li><code>icon</code>: draws the glyph that marks the alert type; see Icon for the whole set.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>column</code>: arranges the static alert examples vertically.</li><li><code>icon-circleXmark</code>: the glyph of the error type.</li><li><code>icon-circleCheck</code>: the glyph of the success type.</li><li><code>icon-circleInfo</code>: the glyph of the info type.</li><li><code>icon-triangleExclamation</code>: the glyph of the warning type.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">Other</h5><ul pgs="flex['column' 'gapTexts']"><li><code>notification</code>: provides dynamic floating alerts and toast messages.</li></ul></div></div></div></div><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h2 class="demoContent-heading demoContent-heading-h2">Examples</h2></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Information</h3><p>Neutral informational feedback.</p></div><div pgs="container flex['column' 'gapElements']"><section>

on"><h4 pgs="accordion-button">PGS States</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>open</code>: indicates that the dropdown is open and its content is visible.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">API</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>pgs.dropdown.init(root)</code>: initializes unregistered dropdowns within the specified Document or Element.</li><li><code>pgs.dropdown.api(element)</code>: returns the instance associated with an initialized dropdown root.</li><li><code>instance.open()</code>: opens the dropdown and closes any other open dropdowns.</li><li><code>instance.close()</code>: closes the current dropdown.</li><li><code>instance.toggle()</code>: toggles between the open and closed states.</li><li><code>instance.refresh()</code>: reinitializes the context and recalculates content positioning.</li><li><code>instance.isOpen()</code>: returns true when the dropdown is open.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>button</code>: applies standard styling to dropdown controls.</li><li><code>icon</code>: draws the glyphs this example shows; see Icon for the whole set.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>btnReverse</code>: reverses text and icon on the example buttons and belongs to the button component.</li><li><code>icon-chevronDown</code>: the glyph that says this button opens something.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">Other</h5><ul pgs="flex['column' 'gapTexts']"><li><code>flex</code>: provides the flex layout; direction and spacing are flags in its bracket.</li><li><code>row</code>: arranges the placement examples on the same flexible row.</li></ul></div></div></div><div class="demoContent-doc-cssVariables" pgs="accordion"><h4 pgs="accordion-button">CSS Variables</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>--dropdown-arrow-size</code></li><li><code>--dropdown-background</code></li><li><code>--dropdown-border</code></li><li><code>--dropdown-borderRadius</code></li><li><code>--dropdown-color</code></li><li><code>--dropdown-display</code></li><li><code>--dropdown-inline-size</code></li><li><code>--dropdown-max-inline-size</code></li><li><code>--dropdown-padding</code></li></ul></div></div><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h2 class="demoContent-heading demoContent-heading-h2">Examples</h2></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Bottom center</h3><p>Default dropdown placement, opened below and centered on its trigger.</p></div><div pgs="container flex['column' 'gapElements']"><section>

s an array containing every steps-step element.</li><li><code>instance.getStep(index)</code>: returns the step at the specified index.</li><li><code>instance.getTotal()</code>: returns the total number of steps.</li><li><code>instance.refresh()</code>: reinitializes the list, recreates missing elements, and returns the new instance.</li></ul></div><div class="demoContent-doc-cssVariables" pgs="accordion"><h4 pgs="accordion-button">CSS Variables</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>--steps-circle-color</code></li><li><code>--steps-circle-size</code></li><li><code>--steps-line-color</code></li><li><code>--steps-line-size</code></li></ul></div></div><div pgs="container flex['column' 'gapElements']"><ol pgs="steps">

&lt;/div&gt;</code></pre></div></section></div><div id="components-toast" pgs="pageNav-panels-content"><section class="demoContent" data-reference="components/toast.html" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h1 class="demoContent-heading demoContent-heading-h1">Toast</h1><p>Toast markup, configuration, behavior, and usage example. An ephemeral, auto-dismissing message shown one at a time (e.g. &quot;saved&quot;, &quot;error&quot;). Split from Notification, which is a persistent, manually-dismissed panel. Full JSON field list is under @pgs-data &quot;toast&quot;; full JS options list is under each @api method below. The JSON form and the JS options now use the same names; the previous message, title-link, title-close and duration keys are still accepted as aliases.</p></div><div class="demoContent-doc" pgs="box accordionContainer" style="padding:10px;"><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>toastLoad</code>: creates one toast from a JSON object on page load; see @pgs-data &quot;toast&quot; for every accepted field.</li><li><code>toastExe</code>: creates one toast from a JSON object each time the element is clicked; same fields as toastLoad.</li><li><code>toast</code>: write it yourself, bare like this, to place the container elsewhere; the module leaves it alone and never generates a second one. Leave it empty, because its content is replaced at every toast.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS generated by JavaScript</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>_toast</code>: the container the toasts are shown in, appended at the end of the body when no toast was written by hand.</li><li><code>_toast-element</code>: a single toast inside the container, replacing whatever was there before.</li><li><code>_toast-element-content</code>: contains the icon, title, and description.</li><li><code>_toast-element-content-icon</code>: contains the icon displayed to the left of the text.</li><li><code>_toast-element-buttons</code>: contains the link and dismiss actions below the content.</li><li><code>_toast-element-content-delete</code>: identifies the dismiss button generated at the end of the content row; it draws a cross, and closeTitle is its accessible name, not visible text.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS Data</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>toast</code>: JSON object read by toastLoad/toastExe on page load or click; a new toast replaces whatever is currently shown — every field, with its accepted values and its default, is annotated in the reference below.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS States</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>neutral</code>: the plain toast: no severity colour, no glyph and no title of its own, so it stays on the box surface.</li><li><code>success</code>: identifies the success element used by Toast.</li><li><code>error</code>: identifies the error element used by Toast.</li><li><code>warning</code>: identifies the warning element used by Toast.</li><li><code>info</code>: identifies the info element used by Toast.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">API</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>pgs.toast.init(root)</code>: scans root for toastLoad and toastExe and initializes them; runs automatically on page load and again via pgs.init(root) for content added later.</li><li><code>pgs.toast.trigger(root)</code>: alias of pgs.toast.init(root).</li><li><code>pgs.toast.error(optionsOrTitle)</code>: a title string, or an options object — see the full field reference in the commented example below.</li><li><code>pgs.toast.success(optionsOrTitle)</code>: a title string, or an options object — see the full field reference in the commented example below.</li><li><code>pgs.toast.info(optionsOrTitle)</code>: a title string, or an options object — see the full field reference in the commented example below.</li><li><code>pgs.toast.warning(optionsOrTitle)</code>: a title string, or an options object — see the full field reference in the commented example below.</li><li><code>pgs.toast.neutral(optionsOrTitle)</code>: the plain toast, same arguments as the others; it has no title or glyph of its own, so pass at least a description.</li><li><code>pgs.toast.deleteAll()</code>: removes the currently shown toast, if any.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>hidden</code>: uses the related hidden component or utility in this example.</li><li><code>button</code>: uses the related button component or utility in this example.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">Other</h5><ul pgs="flex['column' 'gapTexts']"><li><code>icon</code>: draws the glyph that marks the toast type; see Icon for the whole set.</li><li><code>icon-circleXmark</code>: the glyph of the error type.</li><li><code>icon-circleCheck</code>: the glyph of the success type.</li><li><code>icon-circleInfo</code>: the glyph of the info type.</li><li><code>icon-triangleExclamation</code>: the glyph of the warning type.</li><li><code>icon-close</code>: the cross the dismiss button draws.</li><li><code>btnIconOnly</code>: shapes that dismiss button as an icon-only button; see Button.</li></ul></div></div></div><div class="demoContent-doc-cssVariables" pgs="accordion"><h4 pgs="accordion-button">CSS Variables</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>--toast-background</code></li><li><code>--toast-background-timer</code></li><li><code>--toast-color</code></li><li><code>--toast-shadow-color</code></li></ul></div></div><div class="exampleSource" data-kind="json"><strong class="exampleSource-title">PGS Data fields</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-json">pgs-data=&#39;toast[{
    &quot;title&quot;: &quot;&quot;,            // omitted falls back to the title of the type
    &quot;description&quot;: &quot;&quot;,      // plain text under the title; a newline becomes a line break
    &quot;type&quot;: &quot;info&quot;,         // neutral | error | success | warning | info, and anything else falls back to info
    &quot;icon&quot;: null,           // HTML string; null uses the icon of the type
    &quot;timeout&quot;: 4000,        // milliseconds before it dismisses itself; a value that is not a number is ignored
    &quot;link&quot;: null,           // shows the link button and navigates there
    &quot;linkTitle&quot;: &quot;Open&quot;,    // label of the link button, only used when link is set
    &quot;closeTitle&quot;: &quot;Close&quot;   // accessible name of the dismiss button, which always draws a cross
}]&#39;</code></pre></div><div class="exampleSource" data-kind="js"><strong class="exampleSource-title">JavaScript Usage</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-js">pgs.toast.success({
    title: &quot;&quot;,
    description: &quot;&quot;,
    icon: null,
    timeout: 4000,
    link: null,
    linkTitle: &quot;Open&quot;,
    closeTitle: &quot;Close&quot;
});</code></pre></div><div pgs="container flex['column' 'gapElements']"><!-- <div pgs="toast" aria-live="polite"></div> -->

    }]'></div>

<button pgs="button toastExe" pgs-data='toast[{

}]'> Trigger Toast</button>

}]'> Trigger Toast neutral</button></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;!-- &lt;div pgs=&quot;toast&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt; --&gt;

&lt;div pgs=&quot;hidden toastLoad&quot; pgs-data=&#39;toast[{
        &quot;title&quot;: &quot;Benvenuto&quot;,
        &quot;description&quot;: &quot;Message&quot;,
        &quot;type&quot;: &quot;success&quot;,

        &quot;timeout&quot;: &quot;3000&quot;,

        &quot;linkTitle&quot;: &quot;Open&quot;,
        &quot;closeTitle&quot;: &quot;Close&quot;
    }]&#39;&gt;&lt;/div&gt;

&lt;button pgs=&quot;button toastExe&quot; pgs-data=&#39;toast[{
    &quot;title&quot;: &quot;Benvenuto&quot;,
    &quot;description&quot;: &quot;Message&quot;,
    &quot;type&quot;: &quot;success&quot;,
    &quot;icon&quot;: null,
    &quot;timeout&quot;: &quot;7000&quot;,
    &quot;link&quot;: &quot;#&quot;,
    &quot;linkTitle&quot;: &quot;Open&quot;,
