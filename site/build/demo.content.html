<template id="demo-content-main"><div id="welcome" pgs="pageNav-panels-content"><!-- Landing panel for the demo: fetched and injected by demo.js as the first nav entry, so the
     demo opens on something that explains the library instead of on a reference. Hand-maintained,
     kept in sync in substance with the project README, but free to look different since this is
     the demo's own page rather than a generated reference. -->

<section pgs="flex['column']">
    <div pgs="flex['column' 'gapTexts']">
        <h1 class="demoContent-heading demoContent-heading-h1">MyPGS</h1>
        <p>A shared frontend library for building consistent interfaces through <strong>pgs attributes</strong>, SCSS sources, UI components and reusable JavaScript behaviours. Layouts, spacing, colours, buttons, forms, alerts, menus, modals, dropdowns, suggestion search, slides and notifications are defined once and reused across projects.</p>
    </div>

    <div pgs="flex['column' 'gapTexts']">
        <h2 class="demoContent-heading demoContent-heading-h2">Three attributes</h2>
        <p>Everything is composed from tokens on three attributes, instead of from a class per variant.</p>

        <div pgs="flex['column' 'gapTexts' 'wrap']">
            <div pgs="box['boxMini'] flex['column' 'gapTexts'] background['bgPrimarySoft']">
                <strong>pgs</strong>
                <p>What the element is, its visual options and its JavaScript-only flags: <code>pgs="flex['column' 'wrap']"</code>, <code>pgs="header['headerScroll']"</code>. Several components can sit together, each with its own bracket.</p>
            </div>
            <div pgs="box['boxMini'] flex['column' 'gapTexts'] background['bgSecondarySoft']">
                <strong>pgs-data</strong>
                <p>Values passed from HTML to JavaScript, always as <code>key[payload]</code>: <code>dropdownPosition[top left]</code>.</p>
            </div>
            <div pgs="box['boxMini'] flex['column' 'gapTexts'] background['bgTertiarySoft']">
                <strong>pgs-state</strong>
                <p>What it is doing right now. The library writes these at runtime: <code>open</code>, <code>is-active</code>, <code>errorField</code>.</p>
            </div>
        </div>

    </div>

    <div pgs="flex['column' 'gapTexts']">
        <h2 class="demoContent-heading demoContent-heading-h2">Getting started</h2>
        <div pgs="box['boxMini'] background['bgPrimarySoft'] textColor['txtPrimaryStrong']"><code>npm install mypgs</code></div>
        <div pgs="box['boxMini'] background['bgPrimarySoft'] textColor['txtPrimaryStrong']">
            <code>
                import "mypgs"; <br>
                import "mypgs/style.css";
            </code>
        </div>
        <p>The bundle initializes the registered behaviours on load. For markup added later, by JavaScript, JSX or a fetch, initialize its container with <code>pgs.init(container)</code>.</p>
    </div>

    <div pgs="flex['column' 'gapTexts']">
        <h2 class="demoContent-heading demoContent-heading-h2">CSS and SCSS</h2>
        <p>Prefer the library's custom properties, such as <code>--color-primary</code>, <code>--padding</code>, <code>--gap-elements</code> and <code>--border-radius</code>, to hardcoded values:</p>
        <div pgs="box['boxMini'] background['bgPrimarySoft'] textColor['txtPrimaryStrong']">
            <code>
                #danger-action { <br>
                &nbsp;&nbsp;--button-background: var(--color-error); <br>
                &nbsp;&nbsp;--button-color: var(--color-whiteFixed); <br>
                }
            </code>
        </div>
        <p>Component styling composes from small mixins instead of one bundled rule, so each consumer only includes what it needs: a standard button is <code>buttonBase</code> + <code>buttonContent</code>, an icon-only one swaps in <code>iconOnly</code>. The hover treatment is no longer part of any component's composition: it lives under <code>pgs="hover"</code>, which the library marks on clickable surfaces by itself, and <code>hoverNot</code> opts any surface out of it. Variant mixins such as <code>strong</code> or <code>text</code> only add their own declarations and must follow that base. Menus, accordions, forms and step tabs follow the same explicit-composition pattern.</p>
    </div>

    <div pgs="flex['column' 'gapTexts']">
        <h2 class="demoContent-heading demoContent-heading-h2">JavaScript helpers</h2>
        <p>Helpers collect reusable behaviour that is not a component of its own. They are registered on <code>pgs</code> by the library entrypoint, and their sources live in <code>assets/javascript/helper/</code>:</p>
        <ul pgs="list">
            <li><code>pgs(root)</code>: finds and edits PGS tokens, states and options.</li>
            <li><code>pgs.init(root)</code>: initializes components added through JavaScript, JSX or an asynchronous request.</li>
            <li><code>pgs.formValidate</code>: form validation, messages, custom rules and external errors.</li>
            <li><code>pgs.scrollHorizontal</code>: turns vertical wheel movement into horizontal scrolling while the container can still scroll, whatever the input device; also registers <code>pgs.scrollHorizontalWithMouse</code>, the same conversion but for a plain mouse wheel only.</li>
        </ul>
    </div>

    <div pgs="flex['column' 'gapTexts']">
        <h2 class="demoContent-heading demoContent-heading-h2">Conventions</h2>
        <ul pgs="list">
            <li>Prefer an existing token to a new class.</li>
            <li>Use component brackets for visual options, <code>pgs-data</code> for JavaScript configuration, and custom properties for adjustable styling.</li>
            <li>Keep runtime state in <code>pgs-state</code>, never in parallel classes.</li>
            <li>Reuse the custom properties, such as <code>--color-primary</code>, <code>--gap-elements</code> and <code>--border-radius</code>, instead of hardcoding values.</li>
            <li>Keep project-specific work outside the library.</li>
        </ul>
    </div>
</section>
</div><div id="base-body" pgs="pageNav-panels-content"><section class="demoContent" data-reference="base/body.html" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h1 class="demoContent-heading demoContent-heading-h1">Html and Body</h1><p>Base HTML document that enables MyPGS: the root rules and the shared custom property scope on the html element, the essential metadata, and the background, image, text and heading variants on the body.</p></div><div class="demoContent-doc" pgs="box accordionContainer" style="padding:10px;"><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>htmlBase</code>: applies the fundamental rules and the CSS custom property scope to the html element.</li><li><code>body</code>: identifies the body element; each style bundle below is an option in its own bracket.</li></ul></div><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS Options (component brackets)</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>bodyBase</code>: inside body&#39;s own bracket, applies the base structure and spacing to the body.</li><li><code>bodyImg</code>: inside body&#39;s own bracket, enables shared rules for images contained in the page. It also sizes every &lt;i&gt; and every icon element from --icon-size, which is what gives an icon font the same box the library&#39;s own glyphs get; a page whose icon font wants a size of its own sets --fa-size, read here in preference to --icon-size.</li><li><code>bodyText</code>: inside body&#39;s own bracket, enables text typography and spacing.</li><li><code>bodyHeading</code>: inside body&#39;s own bracket, enables the typographic heading hierarchy.</li><li><code>bodyHoverAuto</code>: inside body&#39;s own bracket, activates pgs.hover, the module that marks a button, and a card or box written as a link, with the hover token at load and keeps them in sync afterwards. Without it nothing is marked on its own; a pgs=&quot;hover&quot; written by hand is unaffected either way, and pgs.hover.init(root) still runs on request.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS States</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>darkmode</code>: is applied dynamically to html and body to activate the dark theme.</li></ul></div></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;it-IT&quot; pgs=&quot;htmlBase&quot;&gt;

&lt;head&gt;
	&lt;meta charset=&quot;UTF-8&quot;&gt;
	&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
	&lt;title&gt;MyPGS&lt;/title&gt;

	&lt;!-- Colori Browsers --&gt;
	&lt;meta name=&quot;theme-color&quot; content=&quot;&quot;&gt;
	&lt;meta name=&quot;apple-mobile-web-app-status-bar-color&quot; content=&quot;&quot;&gt;

	&lt;link rel=&quot;stylesheet&quot; href=&quot;../dist/css/index.css&quot;&gt;
	&lt;script src=&quot;../dist/javascript/index.js&quot;&gt;&lt;/script&gt;
&lt;/head&gt;

&lt;body pgs=&quot;body[&#39;bodyBase&#39; &#39;bodyImg&#39; &#39;bodyText&#39; &#39;bodyHeading&#39; &#39;bodyHoverAuto&#39;]&quot;&gt;

&lt;/body&gt;

&lt;/html&gt;</code></pre></div></section></div><div id="base-general" pgs="pageNav-panels-content"><section class="demoContent" data-reference="base/general.html" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h1 class="demoContent-heading demoContent-heading-h1">General</h1><p>Standalone utilities for shadow, cursor, image fitting, list styling and forced colour scheme. Border, outline and radius utilities moved to their own reference, Border; the hover treatment moved to Hover.</p></div><div class="demoContent-doc" pgs="box accordionContainer" style="padding:10px;"><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>boxShadow</code>: applies the shared box shadow token.</li><li><code>textShadow</code>: applies the shared text shadow token.</li><li><code>pointer</code>: shows the pointer cursor on an element that is clickable but is not a control.</li><li><code>appearanceNone</code>: strips every inherited style and the native appearance, to build a control from scratch.</li><li><code>img</code>: fits or crops an image depending on the option in its bracket; written bare it does nothing.</li><li><code>list</code>: styles a plain ul or ol with the shared marker and spacing.</li><li><code>lightmode</code>: forces the light colour scheme on a subtree, whatever the page theme is.</li><li><code>darkmode</code>: forces the dark colour scheme on a subtree, whatever the page theme is.</li></ul></div><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS Options (component brackets)</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>imgContain</code>: inside img&#39;s own bracket, fits the whole image inside its box without cropping it.</li><li><code>imgCover</code>: inside img&#39;s own bracket, crops the image to fill its box, the counterpart of contain.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>flex</code>: provides the flex layout; direction and spacing are flags in its bracket.</li><li><code>box</code>: makes each example visible as a surface.</li><li><code>background</code>: holds the same light background whatever the page theme is, so the two forced schemes read against one ground.</li><li><code>borderRadius</code>: rounds the image fitting examples; see Border for the whole family.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>column</code>: stacks the utility groups vertically.</li><li><code>row</code>: arranges the examples in a row.</li><li><code>bgWhiteFixed</code>: inside background&#39;s own bracket, the fixed light background used here.</li><li><code>gapTexts</code>: spaces the examples inside a group.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">Other</h5><ul pgs="flex['column' 'gapTexts']"><li><code>gapSections</code>: separates the groups.</li></ul></div></div></div></div><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h2 class="demoContent-heading demoContent-heading-h2">Examples</h2></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Shadow</h3><p>The shared shadow tokens, one for a surface and one for text.</p></div><div pgs="container flex['column' 'gapElements']"><section pgs="flex['column' 'gapTexts']">
    <div pgs="flex['row' 'gapTexts']">
        <span pgs="box boxShadow">boxShadow</span>
        <strong pgs="textShadow">textShadow</strong>
    </div>
</section></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;span pgs=&quot;box boxShadow&quot;&gt;boxShadow&lt;/span&gt;
&lt;strong pgs=&quot;textShadow&quot;&gt;textShadow&lt;/strong&gt;</code></pre></div></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Interaction</h3><p>Pointer cursor on a non-control surface, and a full reset to build a control from scratch.</p></div><div pgs="container flex['column' 'gapElements']"><section pgs="flex['column' 'gapTexts']">
    <div pgs="flex['row' 'gapTexts']">
        <span pgs="box pointer">pointer</span>
        <button pgs="appearanceNone pointer" type="button">appearanceNone</button>
    </div>
</section></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;span pgs=&quot;box pointer&quot;&gt;pointer&lt;/span&gt;
&lt;button pgs=&quot;appearanceNone pointer&quot; type=&quot;button&quot;&gt;appearanceNone&lt;/button&gt;</code></pre></div></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Image fitting</h3><p>img[&#39;imgContain&#39;] keeps the whole image inside the box, img[&#39;imgCover&#39;] crops it to fill the box.</p></div><div pgs="container flex['column' 'gapElements']"><section pgs="flex['column' 'gapTexts']">
    <div pgs="flex['row' 'gapTexts']">
        <img pgs="img['imgContain'] borderRadius" src="../assets/img/placeholder.jpg" alt="Contained image" style="width: 220px; height: 140px;">
        <img pgs="img['imgCover'] borderRadius" src="../assets/img/placeholder.jpg" alt="Cropped image" style="width: 220px; height: 140px;">
    </div>
</section></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;img pgs=&quot;img[&#39;imgContain&#39;] borderRadius&quot; src=&quot;../assets/img/placeholder.jpg&quot; alt=&quot;Contained image&quot; style=&quot;width: 220px; height: 140px;&quot;&gt;

ve only, at 4.5px.</li><li><code>brdRight</code>: inside border&#39;s own bracket, draws it on the right only, at the default thickness.</li><li><code>brdRightThin</code>: inside border&#39;s own bracket, draws it on the right only, at 1px.</li><li><code>brdRightThick</code>: inside border&#39;s own bracket, draws it on the right only, at 3px.</li><li><code>brdRightThicker</code>: inside border&#39;s own bracket, draws it on the right only, at 4.5px.</li><li><code>brdBottom</code>: inside border&#39;s own bracket, draws it below only, at the default thickness.</li><li><code>brdBottomThin</code>: inside border&#39;s own bracket, draws it below only, at 1px.</li><li><code>brdBottomThick</code>: inside border&#39;s own bracket, draws it below only, at 3px.</li><li><code>brdBottomThicker</code>: inside border&#39;s own bracket, draws it below only, at 4.5px.</li><li><code>brdLeft</code>: inside border&#39;s own bracket, draws it on the left only, at the default thickness.</li><li><code>brdLeftThin</code>: inside border&#39;s own bracket, draws it on the left only, at 1px.</li><li><code>brdLeftThick</code>: inside border&#39;s own bracket, draws it on the left only, at 3px.</li><li><code>brdLeftThicker</code>: inside border&#39;s own bracket, draws it on the left only, at 4.5px.</li><li><code>brdInline</code>: inside border&#39;s own bracket, draws it on both sides of the inline axis, at the default thickness.</li><li><code>brdInlineThin</code>: inside border&#39;s own bracket, draws it on both sides of the inline axis, at 1px.</li><li><code>brdInlineThick</code>: inside border&#39;s own bracket, draws it on both sides of the inline axis, at 3px.</li><li><code>brdInlineThicker</code>: inside border&#39;s own bracket, draws it on both sides of the inline axis, at 4.5px.</li><li><code>brdBlock</code>: inside border&#39;s own bracket, draws it on both sides of the block axis, at the default thickness.</li><li><code>brdBlockThin</code>: inside border&#39;s own bracket, draws it on both sides of the block axis, at 1px.</li><li><code>brdBlockThick</code>: inside border&#39;s own bracket, draws it on both sides of the block axis, at 3px.</li><li><code>brdBlockThicker</code>: inside border&#39;s own bracket, draws it on both sides of the block axis, at 4.5px.</li><li><code>otlThin</code>: inside outline&#39;s own bracket, draws it at 1px instead of the default 1.5px.</li><li><code>otlThick</code>: inside outline&#39;s own bracket, draws it at 3px.</li><li><code>otlThicker</code>: inside outline&#39;s own bracket, draws it at 4.5px.</li><li><code>brPrimary</code>: inside border&#39;s own bracket, recolours it with the primary colour.</li><li><code>brSecondary</code>: inside border&#39;s own bracket, recolours it with the secondary colour.</li><li><code>brTertiary</code>: inside border&#39;s own bracket, recolours it with the tertiary colour.</li><li><code>brQuaternary</code>: inside border&#39;s own bracket, recolours it with the quaternary colour.</li><li><code>brWhite</code>: inside border&#39;s own bracket, recolours it white.</li><li><code>brBlack</code>: inside border&#39;s own bracket, recolours it black.</li><li><code>brBox</code>: inside border&#39;s own bracket, recolours it with the box surface colour.</li><li><code>brBoxDark</code>: inside border&#39;s own bracket, recolours it with the dark box surface colour.</li><li><code>brLink</code>: inside border&#39;s own bracket, recolours it with the link colour.</li><li><code>brInfo</code>: inside border&#39;s own bracket, recolours it with the info colour.</li><li><code>brError</code>: inside border&#39;s own bracket, recolours it with the error colour.</li><li><code>brWarning</code>: inside border&#39;s own bracket, recolours it with the warning colour.</li><li><code>brSuccess</code>: inside border&#39;s own bracket, recolours it with the success colour.</li><li><code>brGray</code>: inside border&#39;s own bracket, recolours it gray.</li><li><code>olPrimary</code>: inside outline&#39;s own bracket, recolours it with the primary colour.</li><li><code>olSecondary</code>: inside outline&#39;s own bracket, recolours it with the secondary colour.</li><li><code>olTertiary</code>: inside outline&#39;s own bracket, recolours it with the tertiary colour.</li><li><code>olQuaternary</code>: inside outline&#39;s own bracket, recolours it with the quaternary colour.</li><li><code>olWhite</code>: inside outline&#39;s own bracket, recolours it white.</li><li><code>olBlack</code>: inside outline&#39;s own bracket, recolours it black.</li><li><code>olBox</code>: inside outline&#39;s own bracket, recolours it with the box surface colour.</li><li><code>olBoxDark</code>: inside outline&#39;s own bracket, recolours it with the dark box surface colour.</li><li><code>olLink</code>: inside outline&#39;s own bracket, recolours it with the link colour.</li><li><code>olInfo</code>: inside outline&#39;s own bracket, recolours it with the info colour.</li><li><code>olError</code>: inside outline&#39;s own bracket, recolours it with the error colour.</li><li><code>olWarning</code>: inside outline&#39;s own bracket, recolours it with the warning colour.</li><li><code>olSuccess</code>: inside outline&#39;s own bracket, recolours it with the success colour.</li><li><code>olGray</code>: inside outline&#39;s own bracket, recolours it gray.</li><li><code>radInput</code>: inside borderRadius&#39;s own bracket, uses the smaller radius used by form controls instead of the standard one.</li><li><code>radExternal</code>: inside borderRadius&#39;s own bracket, uses the wider radius used by outer containers instead of the standard one.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>flex</code>: provides the flex layout; direction and spacing are flags in its bracket.</li><li><code>padding</code>: applies the shared padding utility to each example.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>column</code>: stacks the utility groups vertically.</li><li><code>row</code>: arranges the examples in a row.</li><li><code>padSections</code>: inside padding&#39;s own bracket, uses the section spacing scale for the radius example&#39;s padding.</li><li><code>wrap</code>: lets the border and outline examples flow onto a second row.</li><li><code>gapTexts</code>: spaces the examples inside a group.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">Other</h5><ul pgs="flex['column' 'gapTexts']"><li><code>gapSections</code>: separates the groups.</li></ul></div></div></div><div class="demoContent-doc-cssVariables" pgs="accordion"><h4 pgs="accordion-button">CSS Variables</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>--border-color</code></li><li><code>--border-complete</code></li><li><code>--border-radius</code></li><li><code>--border-radius-external</code></li><li><code>--border-radius-input</code></li><li><code>--border-style</code></li><li><code>--border-width</code></li></ul></div></div><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h2 class="demoContent-heading demoContent-heading-h2">Examples</h2></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Border</h3><p>A line drawn on the edge of the box, taking its space in the layout. It comes one side at a time as well, named like the margin and padding utilities. Recolour it with a br* utility from Colors, and change its weight with a thickness option.</p></div><div pgs="container flex['column' 'gapElements']">< </section></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;span pgs=&quot;padding[&#39;padSections&#39;] border borderRadius[&#39;radExternal&#39;]&quot;&gt;borderRadius[&#39;radExternal&#39;]&lt;/span&gt;
&lt;span pgs=&quot;padding[&#39;padSections&#39;] border borderRadius&quot;&gt;borderRadius&lt;/span&gt;
&lt;span pgs=&quot;padding[&#39;padSections&#39;] border borderRadius[&#39;radInput&#39;]&quot;&gt;borderRadius[&#39;radInput&#39;]&lt;/span&gt;</code></pre></div></div></section></div><div id="base-hover" pgs="pageNav-panels-content"><section class="demoContent" data-reference="base/hover.html" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h1 class="demoContent-heading demoContent-heading-h1">Hover</h1><p>The shared hover treatment for a surface and the text marked inside it. It is written once here and nowhere else: the component selectors no longer repeat it, so a surface recolours on hover only while it carries this token. With `bodyHoverAuto` on the page&#39;s `&lt;body&gt;`, `pgs.hover` adds it on its own to the surfaces that are clickable by definition, and keeps them in sync when the markup changes: every `button`, and `card` or `box` when they are written as a link (`&lt;a&gt;`). Without `bodyHoverAuto` nothing is marked automatically, and the token is written by hand instead — the only way to opt a surface out then is to simply not write it. `hoverNot` is for a page that does run the automatic marking and wants one surface left out of it. The keyboard focus ring is part of the treatment and arrives with the token, so it too depends on the JavaScript being loaded.</p></div><div class="demoContent-doc" pgs="box accordionContainer" style="padding:10px;"><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>hover</code>: enables the shared hover treatment on a surface.</li><li><code>hover-text</code>: recolours this text when the surrounding hover element is hovered.</li></ul></div><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS Options (component brackets)</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>hoverNot</code>: opts the surface out of the treatment, whatever component it is. `pgs.hover` leaves it unmarked and the surface stops answering the pointer.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">API</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>pgs.hover.init(root)</code>: marks the clickable surfaces inside the given root, and unmarks the ones that stopped being clickable. It does nothing at all without bodyHoverAuto on the page, whether it runs on its own — at load and on every later change — or is called by hand, directly or through pgs.init(root); with bodyHoverAuto the automatic pass already covers the whole document, so a call is only needed for markup outside it, such as a shadow root.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>box</code>: makes the example visible as a surface.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">Other</h5><ul pgs="flex['column' 'gapTexts']"><li><code>bodyHoverAuto</code>: activates the automatic marking this reference otherwise has to write by hand; see Html and Body.</li></ul></div></div></div><div class="demoContent-doc-cssVariables" pgs="accordion"><h4 pgs="accordion-button">CSS Variables</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>--hover-background</code></li><li><code>--hover-behavior</code></li><li><code>--hover-border</code></li><li><code>--hover-color</code></li><li><code>--hover-primaryColor</code></li><li><code>--hover-st1-background-delay</code></li><li><code>--hover-st1-transform-origin</code></li><li><code>--hover-timing</code></li></ul></div></div><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h2 class="demoContent-heading demoContent-heading-h2">Examples</h2></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Hover</h3><p>Hovering the surface recolours it and the text marked inside it together. The token is written out here to show it, which is what a page without bodyHoverAuto has to do on every clickable surface; the demo&#39;s own page carries bodyHoverAuto, so a link box like this one already receives it at load there.</p></div><div pgs="container flex['column' 'gapElements']"><section>
    <a pgs="box hover" href="#">
        <strong pgs="hover-text">hover + hover-text</strong>
    </a>
</section></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;a pgs=&quot;box hover&quot; href=&quot;#&quot;&gt;
    &lt;strong pgs=&quot;hover-text&quot;&gt;hover + hover-text&lt;/strong&gt;
&lt;/a&gt;</code></pre></div></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Hover not</h3><p>The opt-out: on a page with bodyHoverAuto, a surface that would otherwise be marked at load stays inert and keeps the look it has at rest.</p></div><div pgs="container flex['column' 'gapElements']"><section>
    <a pgs="box['hoverNot']" href="#">
        <strong>box + hoverNot</strong>
    </a>

</main></div></section></div><div id="base-darkmode" pgs="pageNav-panels-content"><section class="demoContent" data-reference="base/darkmode.html" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h1 class="demoContent-heading demoContent-heading-h1">Darkmode</h1><p>Global light and dark theme switch. The choice is persisted in localStorage under screenIsDarkMode and re-applied to the html element as soon as the bundle is parsed, before the page paints, so a reload never flashes the wrong theme. Every control marked toggleDarkmode flips the theme and stays in sync with the others, and its inner icon is swapped between the built-in icon-moon and icon-sun glyphs automatically, so the control is never blank even with no icon set loaded; the fa-moon and fa-sun classes are still set alongside, for pages that style them. Each switch dispatches pgs:svg:changeColor on the document with detail { isDarkMode }, which is what recolours the SVG and Lottie files; see SVG colors.</p></div><div class="demoContent-doc" pgs="box accordionContainer" style="padding:10px;"><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>toggleDarkmode</code>: turns a control into a theme switch; every one of them on the page reflects the same state.</li></ul></div><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS Options (component brackets)</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>tglLabelled</code>: writes the theme the click leads to next to the glyph, &quot;Dark mode&quot; while the page is light and &quot;Light mode&quot; while it is dark. It reads the theme from the html element rather than the glyph on the button, so it keeps working whatever icon set drew it; retitle or translate it with --darkmode-label-toDark and --darkmode-label-toLight, whose values are CSS strings, quotes included.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS States</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>darkmode</code>: applied to the html and body elements while the dark theme is active, and read by the whole colour layer.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">API</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>pgs.darkmode.init(root)</code>: initializes the switches within the specified root, and re-applies the stored theme.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>flex</code>: provides the flex layout; direction and spacing are flags in its bracket.</li><li><code>button</code>: presents the switch as a button.</li><li><code>icon</code>: marks the element the switch draws its glyph on; the library sets icon-moon or icon-sun on it, so it needs no option of your own.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>btnIconOnly</code>: presents the switch as an icon-only button.</li><li><code>column</code>: stacks the example and its notes vertically.</li><li><code>gapTexts</code>: spaces the example content.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">Other</h5><ul pgs="flex['column' 'gapTexts']"><li><code>lightmode</code>: pins a subtree to the light scheme, ignoring this switch; see General.</li><li><code>darkmode</code>: pins a subtree to the dark scheme, ignoring this switch; see General.</li></ul></div></div></div><div class="demoContent-doc-cssVariables" pgs="accordion"><h4 pgs="accordion-button">CSS Variables</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>--darkmode-label-toDark</code></li><li><code>--darkmode-label-toLight</code></li></ul></div></div><div class="exampleSource" data-kind="js"><strong class="exampleSource-title">JavaScript Usage</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-js">/* Re-run it after adding a switch to the page. */
pgs.darkmode.init(document);

/* Dispatched on the document at every switch, and at the initial pass on load. */
document.addEventListener(&quot;pgs:svg:changeColor&quot;, event =&gt; console.log(event.detail.isDarkMode));

/* The persisted choice, should you need to read it yourself. */
localStorage.getItem(&quot;screenIsDarkMode&quot;);</code></pre></div><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h2 class="demoContent-heading demoContent-heading-h2">Examples</h2></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Theme switch</h3><p>The icon is swapped by the library, so author it as fa-moon and leave it alone. Several switches can coexist: they all read and write the same stored value.</p></div><div pgs="container flex['column' 'gapElements']"><div pgs="flex['column' 'gapTexts']">

    <button pgs="button['btnIconOnly'] toggleDarkmode" type="button" aria-label="Change theme">
        <i pgs="icon"></i>
    </button>

    
</div></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;button pgs=&quot;button[&#39;btnIconOnly&#39;] toggleDarkmode&quot; type=&quot;button&quot; aria-label=&quot;Change theme&quot;&gt;
    &lt;i pgs=&quot;icon&quot;&gt;&lt;/i&gt;
&lt;/button&gt;</code></pre></div></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Labelled switch</h3><p>tglLabelled adds the written label, so the control says where the click leads instead of relying on the glyph alone. Override --darkmode-label-toDark and --darkmode-label-toLight to write it in another language: both take a CSS string, quotes included.</p></div><div pgs="container flex['column' 'gapElements']"><div>

    <button pgs="button toggleDarkmode['tglLabelled']" type="button" aria-label="Change theme">
        <i pgs="icon"></i>
    </button>

</div></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;button pgs=&quot;button toggleDarkmode[&#39;tglLabelled&#39;]&quot; type=&quot;button&quot; aria-label=&quot;Change theme&quot;&gt;
    &lt;i pgs=&quot;icon&quot;&gt;&lt;/i&gt;
&lt;/button&gt;</code></pre></div></div></section></div><div id="base-svg" pgs="pageNav-panels-content"><section class="demoContent" data-reference="base/svg.html" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h1 class="demoContent-heading demoContent-heading-h1">SVG colors</h1><p>Recolours external SVG and Lottie files when the theme changes, swapping each declared colour pair between its light and dark value. One token enables both passes, since they read the same --svg-color-N pairs: any object type=&quot;image/svg+xml&quot; and any lottie-player on the page recolour together. Alongside it, and needing no token at all, every &lt;object type=&quot;image/svg+xml&quot;&gt; on the page has its preserveAspectRatio kept in step with the object-fit it is given in CSS — slice for cover, meet for anything else — and re-read whenever the element is resized, so an external SVG crops and scales the way an &lt;img&gt; in the same box would. Both passes need the file to be same-origin, since they reach inside its document.</p></div><div class="demoContent-doc" pgs="box accordionContainer" style="padding:10px;"><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>svgChangeColor</code>: enables the whole recolouring pass, for every matching object and lottie-player on the page — a Lottie player needs no marker of its own, since there is nothing left to opt out of it independently.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS States</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>darkmode</code>: read on the document to decide which side of every colour pair to apply.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">API</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>pgs.svg.init(root)</code>: initializes matching elements within the specified root.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>flex</code>: provides the flex layout; direction and spacing are flags in its bracket.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>column</code>: stacks the example and its notes vertically.</li><li><code>gapTexts</code>: spaces the example content.</li></ul></div></div></div></div><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h2 class="demoContent-heading demoContent-heading-h2">Examples</h2></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Theme-aware SVG</h3><p>Colours are declared on the document as pairs, light value first and dark value second, and every --svg-color-N from 0 to 19 is read. The file must be same-origin, because the pass rewrites the fill and stroke attributes inside its document. The same svgChangeColor token also recolours every lottie-player on the page, from these same pairs.</p></div><div pgs="container flex['column' 'gapElements']"><object pgs="svgChangeColor" type="image/svg+xml" data="../assets/img/svg-logo.svg" width="200" height="200">
    Theme-aware logo
</object></div></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div pgs="container flex['column' 'gapElements']"><style>
    /* The pairs live on the document, so a single declaration serves every file.
       Each value must match the attribute exactly as written in the file: #000 is
       not the same string as #000000. Avoid mirrored pairs such as
       "#000 & #fff" together with "#fff & #000": every pair is applied in turn to
       the same attribute, so the second would undo the first. */
    :root {
        --svg-color-0: #000 & #f5f5f5;
        --svg-color-1: #ffffff & #101010;
        --svg-color-2: #ffb13b & #ffc966;
    }
</style></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">/* The pairs live on the document, so a single declaration serves every file.
   Each value must match the attribute exactly as written in the file: #000 is
   not the same string as #000000. Avoid mirrored pairs such as
   &quot;#000 &amp; #fff&quot; together with &quot;#fff &amp; #000&quot;: every pair is applied in turn to
   the same attribute, so the second would undo the first. */
:root {
    --svg-color-0: #000 &amp; #f5f5f5;
    --svg-color-1: #ffffff &amp; #101010;
    --svg-color-2: #ffb13b &amp; #ffc966;
}</code></pre></div></div></section></div><div id="components-notification" pgs="pageNav-panels-content"><section class="demoContent" data-reference="components/notification.html" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h1 class="demoContent-heading demoContent-heading-h1">Notification</h1><p>Notification markup, configuration, behavior, and usage example. A persistent, manually-dismissed panel of messages. Author only the modal wrapping notificationBell (no dialog inside it); the first time it is needed, pgs.notification generates the dialog and re-initializes that modal automatically. It lives inside a modal dialog (see Modal) opened and closed by notificationBell — opening any other dialog on the page (e.g. the mobile menu) closes it automatically, and vice versa. Split from Toast, which is ephemeral and auto-dismissing. Full JSON field list is under @pgs-data &quot;notification&quot;; full JS options list is under each @api method below. The JSON form and the JS options now use the same names; the previous message and title-close keys are still accepted as aliases. Three custom events are dispatched: pgs:notification:buttonClick on a buttons[] element when clicked (detail: id, buttonId, type, title, description, link; cancelable — call event.preventDefault() to stop a link&#39;s navigation and finish async work first), pgs:notification:close on the notification element right before it is removed (detail: id, type, title, description), and pgs:notification:deleteAll on the panel when deleteAll() runs (detail: ids).</p></div><div class="demoContent-doc" pgs="box accordionContainer" style="padding:10px;"><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>notificationLoad</code>: creates one or more notifications from comma-separated JSON objects on page load; see @pgs-data &quot;notification&quot; for every accepted field.</li><li><code>notificationBell</code>: opens/closes the notification dialog each time it is clicked; also the modal-button for the surrounding modal.</li><li><code>notificationBell-counter</code>: write one yourself, bare like this, inside notificationBell to place it yourself; the module leaves it alone and never generates a second one.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS generated by JavaScript</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>_notificationBell-counter</code>: appended inside notificationBell when no notificationBell-counter was written by hand. Either form displays the current count of _notifications-element elements inside the panel.</li><li><code>_notificationsDialog</code>: identifies the dialog generated to hold the notification panel.</li><li><code>_notifications</code>: the scrollable list of notifications, created inside the generated dialog together with it.</li><li><code>_notifications-close</code>: the button generated at the top of that list, above the first notification, which closes the panel; its label is the internal panelCloseTitle default. It also carries _modal-close, Modal&#39;s own generated form of the close control it hands off to.</li><li><code>_notifications-element</code>: identifies a single notification inside the panel.</li><li><code>_notifications-element-content</code>: contains the icon, the title and description, and the dismiss button.</li><li><code>_notifications-element-content-icon</code>: contains the icon displayed to the left of the text.</li><li><code>_notifications-element-buttons</code>: contains the extra action buttons below the content; it is marked hidden when the notification carries none.</li><li><code>_notifications-element-content-delete</code>: identifies the dismiss button generated at the end of the content row; it draws a cross, and closeTitle is its accessible name, not visible text.</li><li><code>_notifications-empty</code>: shown inside the panel whenever it holds no notifications; its text comes from the internal emptyMessage default.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS Data</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>notification</code>: JSON object (or several, comma-separated) read by notificationLoad on page load — every field, with its accepted values and its default, is annotated in the reference below.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS States</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>neutral</code>: the plain notification: no severity colour, no glyph and no title of its own, so it stays on the box surface.</li><li><code>success</code>: identifies the success element used by Notification.</li><li><code>error</code>: identifies the error element used by Notification.</li><li><code>warning</code>: identifies the warning element used by Notification.</li><li><code>info</code>: identifies the info element used by Notification.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">API</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>pgs.notification.init(root)</code>: scans root for notificationLoad and initializes them (including the bell counter); runs automatically on page load and again via pgs.init(root) for content added later. Opening/closing the dialog itself is handled by pgs.modal (see Modal).</li><li><code>pgs.notification.trigger(root)</code>: alias of pgs.notification.init(root).</li><li><code>pgs.notification.error(optionsOrTitle)</code>: a title string, or an options object — see the full field reference in the commented example below.</li><li><code>pgs.notification.success(optionsOrTitle)</code>: a title string, or an options object — see the full field reference in the commented example below.</li><li><code>pgs.notification.info(optionsOrTitle)</code>: a title string, or an options object — see the full field reference in the commented example below.</li><li><code>pgs.notification.warning(optionsOrTitle)</code>: a title string, or an options object — see the full field reference in the commented example below.</li><li><code>pgs.notification.neutral(optionsOrTitle)</code>: the plain notification, same arguments as the others; it has no title or glyph of its own, so pass at least a description.</li><li><code>pgs.notification.deleteAll()</code>: removes every notification from the panel and dispatches pgs:notification:deleteAll (detail: ids) on the panel element.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>flex</code>: provides the flex layout; direction and spacing are flags in its bracket.</li><li><code>hidden</code>: keeps every notificationLoad out of the layout, since it only carries a payload.</li><li><code>button</code>: uses the related button component or utility in this example.</li><li><code>modal</code>: wraps notificationBell; pgs.notification generates the dialog inside it and provides open/close/toggle behavior shared with every other dialog on the page.</li><li><code>modal-button</code>: identifies notificationBell as the control that opens the dialog.</li><li><code>modal-close</code>: written by hand on notificationBell in the example below, so opening it toggles the panel through modal-button instead of just adding another close control.</li><li><code>icon</code>: draws the glyph that marks the notification type; see Icon for the whole set.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>column</code>: stacks the examples vertically.</li><li><code>gapTexts</code>: spaces the content inside each example.</li><li><code>btnIconOnly</code>: presents notificationBell, and the generated dismiss button, as icon buttons.</li><li><code>icon-bell</code>: the glyph on the control that opens the panel.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">Other</h5><ul pgs="flex['column' 'gapTexts']"><li><code>gapSections</code>: separates the examples.</li><li><code>btnTransparent</code>: the appearance the component gives the buttons passed in the payload; see Button.</li><li><code>modal-dialog-content</code>: identifies the JS-generated styled content area inside the dialog, wrapping notifications.</li><li><code>btnMini</code>: keeps the generated panel-close button small; see Button.</li><li><code>dialogRight</code>: slides the notification dialog in from the right; see Modal for other positions.</li><li><code>icon-circleXmark</code>: the glyph of the error type.</li><li><code>icon-circleCheck</code>: the glyph of the success type.</li><li><code>icon-circleInfo</code>: the glyph of the info type.</li><li><code>icon-triangleExclamation</code>: the glyph of the warning type.</li><li><code>icon-close</code>: the cross the dismiss button draws.</li></ul></div></div></div><div class="demoContent-doc-cssVariables" pgs="accordion"><h4 pgs="accordion-button">CSS Variables</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>--notification-background</code></li><li><code>--notification-color</code></li><li><code>--notification-shadow-color</code></li></ul></div></div><div class="exampleSource" data-kind="json"><strong class="exampleSource-title">PGS Data fields</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-json">pgs-data=&#39;notification[{
    &quot;id&quot;: null,                  // string; generated when omitted, and reported by every event
    &quot;title&quot;: &quot;&quot;,                 // omitted falls back to the title of the type
    &quot;description&quot;: &quot;&quot;,           // plain text under the title
    &quot;type&quot;: &quot;info&quot;,              // neutral | error | success | warning | info
    &quot;icon&quot;: null,                // HTML string; null uses the icon of the type
    &quot;closeTitle&quot;: &quot;Close&quot;,       // accessible name of the dismiss button, which always draws a cross
    &quot;buttons&quot;: [                 // omitted or empty leaves only the dismiss button
        {
            &quot;id&quot;: null,          // reported as buttonId by pgs:notification:buttonClick
            &quot;title&quot;: &quot;&quot;,         // label of the button
            &quot;link&quot;: null,        // navigates there; omit it to only dispatch the event
            &quot;close&quot;: true,       // dismisses the notification after the click
            &quot;optionButton&quot;: null // pgs-data token added to the button, e.g. btnMini
        }
    ]
}]&#39;</code></pre></div><div class="exampleSource" data-kind="js"><strong class="exampleSource-title">JavaScript Usage</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-js">pgs.notification.success({
    id: undefined,
    title: &quot;&quot;,
    description: &quot;&quot;,
    icon: null,
    closeTitle: &quot;Close&quot;,
    buttons: [
        { id: undefined, title: &quot;&quot;, link: undefined, close: true, optionButton: undefined }
    ]
});</code></pre></div><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h2 class="demoContent-heading demoContent-heading-h2">Examples</h2></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Bell</h3><p>The control that opens and closes the panel, and the only markup this component needs on the page. Wrap it in a modal and pgs.notification builds the dialog and the counter inside it on its own.</p></div><div pgs="container flex['column' 'gapElements']"><section pgs="flex['column' 'gapTexts']">
    <div pgs="modal">
        <button type="button" pgs="modal-button modal-close button['btnIconOnly'] notificationBell" aria-label="Open notifications">
            <i pgs="icon['icon-bell']"></i>
        </button>
    </div>
</section></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;div pgs=&quot;modal&quot;&gt;
    &lt;button type=&quot;button&quot; pgs=&quot;modal-button modal-close button[&#39;btnIconOnly&#39;] notificationBell&quot; aria-label=&quot;Open notifications&quot;&gt;
        &lt;i pgs=&quot;icon[&#39;icon-bell&#39;]&quot;&gt;&lt;/i&gt;
    &lt;/button&gt;
&lt;/div&gt;</code></pre></div></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Neutral</h3><p>A message with nothing to signal: no severity colour, no glyph, and the title left out so only the text shows.</p></div><div pgs="hidden"><section pgs="flex['column' 'gapTexts']">
    <div pgs="hidden notificationLoad" pgs-data='notification[{
        "title": "Hi!",
        "description": "The report you asked for is ready.",
        "type": "neutral"
    }]'></div>
</section></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;div pgs=&quot;hidden notificationLoad&quot; pgs-data=&#39;notification[{
    &quot;title&quot;: &quot;Hi!&quot;,
    &quot;description&quot;: &quot;The report you asked for is ready.&quot;,
    &quot;type&quot;: &quot;neutral&quot;
}]&#39;&gt;&lt;/div&gt;</code></pre></div></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Success</h3><p>A completed operation. The element is hidden and consumed on load: the notification it describes is moved into the panel.</p></div><div pgs="hidden"><section pgs="flex['column' 'gapTexts']">
    <div pgs="hidden notificationLoad" pgs-data='notification[{
            "title": "Profile approved",
            "description": "Your profile has been reviewed and approved.",
            "type": "success",
            "icon": null
        }]'></div>
</section></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;div pgs=&quot;hidden notificationLoad&quot; pgs-data=&#39;notification[{
        &quot;title&quot;: &quot;Profile approved&quot;,
        &quot;description&quot;: &quot;Your profile has been reviewed and approved.&quot;,
        &quot;type&quot;: &quot;success&quot;,

    }]&#39;&gt;&lt;/div&gt;</code></pre></div></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Error</h3><p>A failure the user has to know about, with a button to try the operation again.</p></div><div pgs="hidden"><section pgs="flex['column' 'gapTexts']">
    <div pgs="hidden notificationLoad" pgs-data='notification[{
            "title": "Something went wrong",

        }]'></div>
</section></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;div pgs=&quot;hidden notificationLoad&quot; pgs-data=&#39;notification[{
        &quot;title&quot;: &quot;Something went wrong&quot;,

    }]&#39;&gt;&lt;/div&gt;</code></pre></div></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Warning</h3><p>Something is missing but nothing is broken, so the button leads to where it can be completed.</p></div><div pgs="hidden"><section pgs="flex['column' 'gapTexts']">

        }]'></div>

        &quot;title&quot;: &quot;Your profile is incomplete&quot;,
        &quot;description&quot;: &quot;Complete your profile to unlock all features.&quot;,

    }]&#39;&gt;&lt;/div&gt;</code></pre></div></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Info with several buttons</h3><p>Buttons carrying an id instead of a link dispatch pgs:notification:buttonClick with that id, which is how a question is answered without leaving the page.</p></div><div pgs="hidden"><section pgs="flex['column' 'gapTexts']">
    <div pgs="hidden notificationLoad" pgs-data='notification[{
            "title": "Are you enjoying the portal?",
            "description": "Your feedback helps us improve.",

            "buttons": [
                { "id": "yes", "title": "Yes" },

</section></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;div pgs=&quot;hidden notificationLoad&quot; pgs-data=&#39;notification[{
        &quot;title&quot;: &quot;Are you enjoying the portal?&quot;,
        &quot;description&quot;: &quot;Your feedback helps us improve.&quot;,
        &quot;type&quot;: &quot;info&quot;,
        &quot;icon&quot;: null,
        &quot;buttons&quot;: [
            { &quot;id&quot;: &quot;yes&quot;, &quot;title&quot;: &quot;Yes&quot; },
            { &quot;id&quot;: &quot;no&quot;, &quot;title&quot;: &quot;No&quot; }
        ]
    }]&#39;&gt;&lt;/div&gt;</code></pre></div></div></section></div><div id="components-card" pgs="pageNav-panels-content"><section class="demoContent" data-reference="components/card.html" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h1 class="demoContent-heading demoContent-heading-h1">Card and Box</h1><p>Reusable surfaces for presenting structured card content or grouping simpler content inside a box.</p></div><div class="demoContent-doc" pgs="box accordionContainer" style="padding:10px;"><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>card</code>: identifies the main card container. Written on an `&lt;a&gt;` it becomes a clickable surface, and `pgs.hover` marks it with `hover` on a page that carries `bodyHoverAuto`, so it takes the shared hover and focus treatment; see Html and Body.</li><li><code>card-img</code>: identifies the main card image, written on the `&lt;img&gt;` or `&lt;object&gt;` itself; a bare image with no token inside a card is not styled.</li><li><code>card-imgForChild</code>: a wrapper for card media the card does not write itself, such as an image printed by a helper or a block of elements: the card-img treatment lands on its direct child, and in cardHorizontal/cardHorizontalFixed the wrapper is the one taking the 40/60 split.</li><li><code>card-content</code>: groups the text and actions of a card.</li><li><code>box</code>: identifies a lightweight content container or clickable surface. Written on an `&lt;a&gt;` it is marked with `hover` the same way a clickable card is.</li></ul></div><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS Options (component brackets)</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>cardHorizontal</code>: switches intrinsically between a horizontal 40/60 layout and a stacked layout according to the card&#39;s available width.</li><li><code>cardHorizontalFixed</code>: the same 40/60 layout as cardHorizontal, with no container query behind it — the card reads side-by-side whatever its own width is, which is what a card already known to be wide enough, or one deliberately narrow but still meant to stay horizontal, wants instead of the responsive switch.</li><li><code>cardMini</code>: reduces the content padding on the card&#39;s own card-content.</li><li><code>boxMini</code>: inside box&#39;s own bracket, the same reduced padding on the box itself.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>button</code>: presents the card action as a standard button.</li><li><code>margin</code>: provides the spacing utility used here.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>mrgTop</code>: inside margin&#39;s own bracket, separates the card action from the preceding text.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">Other</h5><ul pgs="flex['column' 'gapTexts']"><li><code>hover</code>: the treatment a clickable card or box receives, added by pgs.hover on a page that carries bodyHoverAuto, rather than written by hand; see Hover.</li><li><code>bodyHoverAuto</code>: inside body&#39;s own bracket, gates whether pgs.hover marks a clickable card or box automatically; see Html and Body.</li><li><code>hoverNot</code>: available on a clickable card or box that must stay inert; see Hover.</li></ul></div></div></div><div class="demoContent-doc-cssVariables" pgs="accordion"><h4 pgs="accordion-button">CSS Variables</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>--card-background</code></li><li><code>--card-borderRadius</code></li><li><code>--card-borderRadius-item</code></li><li><code>--card-horizontal-borderRadius-item</code></li><li><code>--card-horizontal-content-grow</code></li><li><code>--card-horizontal-img-grow</code></li><li><code>--card-horizontal-img-minHeight</code></li><li><code>--card-img-padding</code></li><li><code>--card-padding</code></li></ul></div></div><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h2 class="demoContent-heading demoContent-heading-h2">Examples</h2></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Standard card</h3><p>Descriptive card content suitable for lists, previews, and grids.</p></div><div pgs="container flex['column' 'gapElements']"><section>

    &lt;p&gt;Ut labore et dolore magna aliqua ut enim.&lt;/p&gt;

c</code>: write one yourself, bare like this, to place the previous-slide button elsewhere; the module leaves it alone and never generates a second one.</li><li><code>slides-next</code>: the same, for the next-slide button.</li><li><code>slides-dots</code>: the same, for the row of position dots.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS generated by JavaScript</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>_slides-prec</code>: appended at the end of the component when no slides-prec was written by hand.</li><li><code>_slides-next</code>: appended at the end of the component when no slides-next was written by hand.</li><li><code>_slides-dots</code>: appended at the end of the component when no slides-dots was written by hand.</li><li><code>_slides-dots-dot</code>: one dot inside the dots row, built and kept in step with the number of slides. It is written on every child of the row, so a row placed by hand holds the same dots.</li></ul></div><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS Options (component brackets)</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>slidesShadowDesktop</code>: fades the slides out at the edges from the tablet width up, only on the side that still has slides to reach.</li><li><code>slidesAnimationScale</code>: scales each slide by how much of it is in view, through the --_slides-visiblePercent custom property the module writes on it; a slide sits at 1 before the first pass of the observer.</li><li><code>slidesSingleScroll</code>: an arrow advances by a single slide, counted from the one the snap is resting on, instead of jumping past every slide currently in view.</li><li><code>slidesScrollMouse</code>: turns the vertical mouse wheel into horizontal scrolling over the slides; off by default.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS States</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>view</code>: written on each slide the observer reads as in view, at or above 97% visible. It is what the arrows, the dots and the edge fades are all driven from, and what getCurrentIndexes and getCurrentElements report.</li><li><code>notView</code>: the other side of the same pass, written on the slides that are out of view. It is not the same as :not([pgs-state~=&quot;view&quot;]), which also matches every slide before the first pass of the observer, when neither state has been written yet.</li><li><code>active</code>: written on the dot of each slide currently in view, alongside aria-current.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">API</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>pgs.slides.init(root)</code>: initializes matching elements within the specified root.</li><li><code>pgs.slides.api(element)</code>: returns the instance associated with the specified initialized element.</li><li><code>instance.previous()</code>: moves to the previous item.</li><li><code>instance.next()</code>: moves to the next item.</li><li><code>instance.goTo(index)</code>: scrolls to the zero-based slide at that position.</li><li><code>instance.getCurrentIndexes()</code>: returns the positions of every slide currently in view.</li><li><code>instance.getCurrentElements()</code>: returns the slide elements currently in view.</li><li><code>instance.getTotal()</code>: returns the total number of slides.</li><li><code>instance.isAtStart()</code>: returns true when the track is scrolled to its beginning.</li><li><code>instance.isAtEnd()</code>: returns true when the track is scrolled to its end.</li><li><code>instance.refresh()</code>: rebuilds the instance on the same element and returns it, after the slides have changed.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>card</code>: uses the related card component or utility in this example.</li><li><code>card-img</code>: uses the related card-img component or utility in this example.</li><li><code>card-content</code>: groups the textual content of each slide card.</li><li><code>img</code>: uses the related img component or utility in this example.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>imgCover</code>: inside img&#39;s own bracket, crops the image to fill its box.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">Other</h5><ul pgs="flex['column' 'gapTexts']"><li><code>icon</code>: draws the chevron inside each of the two generated buttons; see Icon for the whole set.</li><li><code>icon-chevronDown</code>: the glyph in both generated buttons, rotated to point left or right.</li><li><code>rotate</code>: rotates the chevron; the previous button uses its 90 option to point left, the next button its 270 option to point right.</li><li><code>btnIconOnly</code>: styles the previous and next actions generated at runtime; belongs to the button component.</li></ul></div></div></div><div class="demoContent-doc-cssVariables" pgs="accordion"><h4 pgs="accordion-button">CSS Variables</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>--slides-maskEnd</code></li><li><code>--slides-maskStart</code></li><li><code>--slides-paddingInline-mobile</code></li><li><code>--slides-paddingInline-tablet</code></li><li><code>--slides-sizeMaskImage</code></li></ul></div></div><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h2 class="demoContent-heading demoContent-heading-h2">Examples</h2></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapText ine while preserving the button layout and hover behavior.</li><li><code>btnPrimary</code>: applies the primary color palette.</li><li><code>btnSecondary</code>: replaces the primary button accent with the secondary color palette.</li><li><code>btnTertiary</code>: replaces the primary button accent with the tertiary color palette.</li><li><code>btnQuaternary</code>: replaces the primary button accent with the quaternary color palette.</li><li><code>btnPaddingEqual</code>: sets the same padding on every side instead of the wider left/right default.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>flex</code>: provides the flex layout; direction and spacing are flags in its bracket.</li><li><code>form</code>: wraps the checked example, so the control is shown where a form actually puts it.</li><li><code>icon</code>: draws the glyphs this example shows; see Icon for the whole set.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>row</code>: arranges the button examples in a flexible row.</li><li><code>wrap</code>: lets that row break instead of overflowing.</li><li><code>gapTexts</code>: spaces the two buttons that share the text-only example, and the three two-state buttons.</li><li><code>icon-arrowRight</code>: the glyph that points forward.</li><li><code>icon-star</code>: the neutral stand-in glyph, used where the example needs an icon but not a particular one.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">Other</h5><ul pgs="flex['column' 'gapTexts']"><li><code>hover</code>: the treatment every button receives, added by pgs.hover on a page that carries bodyHoverAuto, rather than written by hand; see Hover.</li><li><code>bodyHoverAuto</code>: inside body&#39;s own bracket, gates whether pgs.hover marks a button automatically; see Html and Body.</li><li><code>hoverNot</code>: opts a button out of that treatment, so it keeps its look and stops answering the pointer; see Hover.</li></ul></div></div></div><div class="demoContent-doc-cssVariables" pgs="accordion"><h4 pgs="accordion-button">CSS Variables</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>--button-background</code></li><li><code>--button-background-checked</code></li><li><code>--button-background-current</code></li><li><code>--button-background-hover</code></li><li><code>--button-background-strong</code></li><li><code>--button-border</code></li><li><code>--button-border-color</code></li><li><code>--button-border-color-checked</code></li><li><code>--button-border-color-current</code></li><li><code>--button-border-color-hover</code></li><li><code>--button-border-color-strong</code></li><li><code>--button-border-style</code></li><li><code>--button-border-width</code></li><li><code>--button-borderRadius</code></li><li><code>--button-color</code></li><li><code>--button-color-checked</code></li><li><code>--button-color-current</code></li><li><code>--button-color-hover</code></li><li><code>--button-color-strong</code></li><li><code>--button-font-size</code></li><li><code>--button-height</code></li><li><code>--button-padding</code></li><li><code>--button-padding-block</code></li><li><code>--button-padding-left</code></li><li><code>--button-padding-left-icon</code></li><li><code>--button-padding-right</code></li><li><code>--button-primaryColor</code></li><li><code>--button-size</code></li></ul></div></div><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h2 class="demoContent-heading demoContent-heading-h2">Examples</h2></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" p
