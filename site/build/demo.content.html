}]&#39;&gt; Trigger Toast&lt;/button&gt;

&lt;button pgs=&quot;button toastExe&quot; pgs-data=&#39;toast[{
    &quot;title&quot;: &quot;Hello&quot;,
    &quot;description&quot;: &quot;Message&quot;,
    &quot;type&quot;: &quot;neutral&quot;,
    &quot;timeout&quot;: &quot;7000&quot;
}]&#39;&gt; Trigger Toast neutral&lt;/button&gt;</code></pre></div></section></div><div id="patterns-cookieConsent" pgs="pageNav-panels-content"><section class="demoContent" data-reference="patterns/cookieConsent.html" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h1 class="demoContent-heading demoContent-heading-h1">Cookie Consent</h1><p>Accessible pattern for collecting and storing analytics cookie consent, applying preferences, and loading Google Analytics only when authorized. Author only a hidden marker element with a JSON config — pgs.cookieConsent generates the whole modal, dialog, and content from it (see the full field reference in the commented example below), then removes the marker. It lives inside a modal dialog (see Modal): open/close, backdrop, focus trap, ESC-to-close, and focus restore are all handled natively by the dialog through pgs.modal. It has no modal-button of its own — it opens itself on load when no valid saved preference exists, and can be reopened later from anywhere on the page through cookieConsent-actionOpen (e.g. a footer link).</p></div><div class="demoContent-doc" pgs="box accordionContainer" style="padding:10px;"><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>cookieConsent</code>: identifies the hidden JSON marker read on page load; pgs.cookieConsent replaces it with the generated modal wrapper carrying the same token.</li><li><code>cookieConsent-actionOpen</code>: identifies external controls that reopen the preference panel.</li><li><code>cookieConsent-gaUnavailable</code>: runtime token applied to the root when no usable measurement ID is available.</li><li><code>cookieConsent-accepted</code>: runtime token applied to the root when analytics is allowed.</li><li><code>cookieConsent-declined</code>: runtime token applied to the root when analytics is not allowed.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS generated by JavaScript</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>_cookieConsent-header</code>: identifies the introductory block above the preference panel.</li><li><code>_cookieConsent-panel</code>: identifies the configurable preference group.</li><li><code>_cookieConsent-panel-featureEssential</code>: identifies the row of always-active essential cookies.</li><li><code>_cookieConsent-panel-badge</code>: identifies the essential-cookie status indicator.</li><li><code>_cookieConsent-panel-featureAnalytics</code>: identifies the optional analytics-cookie row.</li><li><code>_cookieConsent-panel-toggleAnalytics</code>: identifies the control that enables analytics consent.</li><li><code>_cookieConsent-actionReject</code>: applies selected preferences without automatically accepting analytics.</li><li><code>_cookieConsent-actionAccept</code>: accepts all available cookies.</li></ul></div><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS Options (component brackets)</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>btnStrong</code>: presents full acceptance as the primary action.</li><li><code>dialogTopLevel</code>: centers the dialog with a backdrop instead of positioning it inline; see Modal.</li><li><code>success</code>: presents the essential-cookie badge with the success color; see Badges.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS Data</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>cookieConsent</code>: JSON object read from the hidden marker on page load — every field, with its accepted values and its default, is annotated in the reference below.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">API</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>pgs.cookieConsent.init(root)</code>: reads the JSON marker inside the provided document or element, generates the pattern from it, and initializes it.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>button</code>: presents the selection actions with standard styling.</li><li><code>hidden</code>: uses the related hidden component or utility in this example.</li><li><code>icon</code>: draws the three glyphs in the notice and its buttons; see Icon for the whole set.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>icon-cookie</code>: the glyph beside the introduction.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">Other</h5><ul pgs="flex['column' 'gapTexts']"><li><code>flex</code>: provides the flex layout; direction and spacing are flags in its bracket.</li><li><code>column</code>: vertically organizes the JS-generated dialog content and the preference panel.</li><li><code>gapElements</code>: applies element spacing to the JS-generated dialog content.</li><li><code>row</code>: arranges panel rows and actions, and the icon beside the introduction.</li><li><code>itemCenter</code>: vertically centers the icon beside the introduction against its text.</li><li><code>nowrap</code>: prevents wrapping in the essential-cookie row.</li><li><code>toggle</code>: presents analytics consent as a switch.</li><li><code>badge</code>: presents the essential-cookie status indicator; see Badges.</li><li><code>modal</code>: wraps cookieConsent and the dialog, providing open/close behavior shared with every other dialog on the page.</li><li><code>modal-dialog-content</code>: identifies the JS-generated styled content area inside the dialog.</li><li><code>icon-sliders</code>: the glyph on the button that saves the current choice.</li><li><code>icon-check</code>: the glyph on the button that accepts everything.</li></ul></div></div></div></div><div class="exampleSource" data-kind="json"><strong class="exampleSource-title">PGS Data fields</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-json">pgs-data=&#39;cookieConsent[{
    // every field is optional and falls back to the value shown here, which is the library default
    &quot;titleIntro&quot;: &quot;Cookies and privacy&quot;,            // small heading above the title
    &quot;titleHeading&quot;: &quot;Your privacy comes first&quot;,     // title of the banner
    &quot;description&quot;: &quot;&quot;,                              // body text; **double asterisks** turn bold and a newline becomes a line break
    &quot;privacyPolicyUrl&quot;: &quot;/privacy-policy/&quot;,         // target of the Privacy Policy link
    &quot;cookiePolicyUrl&quot;: &quot;/cookie-policy/&quot;,           // target of the Cookie Policy link
    &quot;panelAriaLabel&quot;: &quot;Cookie preferences&quot;,         // accessible name of the preference group
    &quot;essentialTitle&quot;: &quot;Essential cookies&quot;,          // title of the always-active row
    &quot;essentialDescription&quot;: &quot;Always active to ensure the website works correctly.&quot;,
    &quot;essentialBadge&quot;: &quot;Active&quot;,                     // text of the badge on that row
    &quot;analyticsTitle&quot;: &quot;Analytics&quot;,                  // title of the optional row
    &quot;analyticsDescription&quot;: &quot;Browsing data collected in aggregate form for anonymous statistics.&quot;,
    &quot;analyticsAriaLabel&quot;: &quot;Enable Google Analytics&quot;,// accessible name of the toggle
    &quot;titleReject&quot;: &quot;Selected only&quot;,                 // label of the button that saves the current choice
    &quot;titleAccept&quot;: &quot;Accept all&quot;,                    // label of the button that accepts everything
    &quot;gaId&quot;: &quot;&quot;                                      // GA4 measurement ID; empty adds cookieConsent-gaUnavailable to the root
}]&#39;</code></pre></div><div pgs="container flex['column' 'gapElements']"><div pgs="hidden cookieConsent" pgs-data='cookieConsent[{
    "titleHeading": "Your privacy comes first",
    "description": "We use essential cookies to provide the service and, with your consent, analytics cookies from **Google Analytics** to measure traffic anonymously and improve our content.\nYou can change your choice at any time.",
    "privacyPolicyUrl": "/privacy-policy/",
    "cookiePolicyUrl": "/cookie-policy/",
    "gaId": "G-XXXXXXXXXX"
}]'></div>

<button type="button" pgs="button cookieConsent-actionOpen" aria-haspopup="dialog">
    <i pgs="icon['icon-cookie']"></i> Cookie preferences
</button></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;div pgs=&quot;hidden cookieConsent&quot; pgs-data=&#39;cookieConsent[{
    &quot;titleHeading&quot;: &quot;Your privacy comes first&quot;,
    &quot;description&quot;: &quot;We use essential cookies to provide the service and, with your consent, analytics cookies from **Google Analytics** to measure traffic anonymously and improve our content.\nYou can change your choice at any time.&quot;,
    &quot;privacyPolicyUrl&quot;: &quot;/privacy-policy/&quot;,
    &quot;cookiePolicyUrl&quot;: &quot;/cookie-policy/&quot;,
    &quot;gaId&quot;: &quot;G-XXXXXXXXXX&quot;
}]&#39;&gt;&lt;/div&gt;

&lt;button type=&quot;button&quot; pgs=&quot;button cookieConsent-actionOpen&quot; aria-haspopup=&quot;dialog&quot;&gt;
    &lt;i pgs=&quot;icon[&#39;icon-cookie&#39;]&quot;&gt;&lt;/i&gt; Cookie preferences
&lt;/button&gt;</code></pre></div></section></div><div id="layout-header" pgs="pageNav-panels-content"><section class="demoContent" data-reference="layout/header.html" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h1 class="demoContent-heading demoContent-heading-h1">Header</h1><p>Responsive header that measures available space, switches between its full and compact content, and integrates menus, dark mode, and modal navigation.</p></div><div class="demoContent-doc" pgs="box accordionContainer" style="padding:10px;"><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>header</code>: identifies the main header observed by the JavaScript module.</li><li><code>header-element</code>: identifies the inner group measured to determine the switch to the compact layout.</li><li><code>header-element-alwaysOn</code>: identifies an area that stays visible in both layouts. Write it as many times as the header needs areas: the groups carry no styling of their own, so where each one lands is decided by document order alone.</li><li><code>header-element-onlyFull</code>: identifies content shown only in the full layout.</li><li><code>header-element-onlyCompact</code>: identifies content shown only in the compact layout.</li></ul></div><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS Options (component brackets)</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>headerCompactBottom</code>: moves header-element to the bottom of the viewport while the header is compact, so it follows the chosen breakpoint.</li><li><code>headerCompactWatch</code>: forces the compact layout from the watch width down, even when the content still fits.</li><li><code>headerCompactMobile</code>: forces the compact layout from the mobile width down, even when the content still fits.</li><li><code>headerCompactBigMobile</code>: forces the compact layout from the big-mobile width down, even when the content still fits.</li><li><code>headerCompactTablet</code>: forces the compact layout from the tablet width down, even when the content still fits.</li><li><code>headerCompactBigTablet</code>: forces the compact layout from the big-tablet width down, even when the content still fits.</li><li><code>headerCompactLaptop</code>: forces the compact layout from the laptop width down, even when the content still fits.</li><li><code>headerScroll</code>: hides the header while scrolling down and shows it again while scrolling up.</li><li><code>headerMain</code>: marks the header that owns --heightOfHeader and --heightOfHeaderScroll, the properties that push the page content down. Only needed on a page with more than one header; without it the first one keeps them.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS Data</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>headerCompactFrom</code>: forces the compact layout from a custom viewport width down, written as headerCompactFrom[600], and takes precedence over the named widths below.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS States</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>compact</code>: is applied to header and header-element when their width or the viewport requires the compact layout.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">API</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>pgs.header.init(root)</code>: initializes the headers inside the specified root, or the root itself when it is one; runs automatically on page load and again via pgs.init(root) for a header added later. A page may hold several headers, and each one manages its own compact layout, while the properties that push the page content down belong to the one marked main, or to the first one when none is marked.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>flex</code>: provides the flex layout; direction and spacing are flags in its bracket.</li><li><code>button</code>: provides the base styling for the header controls and for the navigation links, which the menu no longer styles on its own.</li><li><code>logo</code>: inserts the brand into the initial area.</li><li><code>logo-text</code>: uses the text variant of the logo.</li><li><code>menu</code>: provides both the full and the compact navigation.</li><li><code>blur</code>: applies a backdrop blur behind header-element for a frosted-glass effect.</li><li><code>notificationBell</code>: opens and closes the notification panel from the header.</li><li><code>toggleDarkmode</code>: connects the control to the global theme handler.</li><li><code>modal</code>: provides opening and closing behavior for the compact navigation.</li><li><code>modal-button</code>: opens the compact panel.</li><li><code>modal-close</code>: closes the compact panel and shares the hamburger control.</li><li><code>modal-dialog-content</code>: identifies the inner compact navigation panel; also identifies the JS-generated content area wrapping notifications inside the notification dialog.</li><li><code>icon</code>: draws the glyphs this example shows; see Icon for the whole set.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>btnTransparent</code>: the appearance of the navigation links, in the full-layout row and once they stack in the compact panel alike.</li><li><code>btnForHeader</code>: sizes a link like the other header controls; belongs to the button component.</li><li><code>btnPaddingEqual</code>: sets the same padding on every side of a navigation link instead of the wider left/right default; belongs to the button component.</li><li><code>row</code>: sets the horizontal direction inside the flex bracket.</li><li><code>nowrap</code>: uses the related nowrap component or utility in this example.</li><li><code>menuHorizontal</code>: arranges the full-layout menu horizontally.</li><li><code>menuVertical</code>: arranges the compact-layout menu vertically.</li><li><code>menuShort</code>: compacts adjacent full-layout menu links by overlapping their horizontal spacing.</li><li><code>dialogRight</code>: presents the compact navigation dialog content from the right side.</li><li><code>btnIconOnly</code>: presents theme and hamburger controls as icon buttons.</li><li><code>icon-bell</code>: the glyph on the control that opens the panel.</li><li><code>icon-hamburgerTwo</code>: draws the hamburger glyph, swapped for icon-close via CSS while the compact navigation is open.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Data</h5><ul pgs="flex['column' 'gapTexts']"><li><code>modalContainerPGS</code>: uses modalContainerPGS[header] on the modal wrapper to move the dialog into the header.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">Other</h5><ul pgs="flex['column' 'gapTexts']"><li><code>notificationBell-counter</code>: generated automatically inside notificationBell; not written by hand in this example.</li><li><code>modal-dialog</code>: identifies the compact navigation dialog.</li><li><code>notifications</code>: identifies the scrollable list of notifications inside the dialog generated by pgs.notification.</li><li><code>icon-close</code>: drawn in place of icon-hamburgerTwo via CSS while the compact navigation is open; not written in this markup.</li></ul></div></div></div><div class="demoContent-doc-cssVariables" pgs="accordion"><h4 pgs="accordion-button">CSS Variable  flex items to wrap.</li><li><code>nowrap</code>: prevents flex items from wrapping.</li><li><code>column-</code>: inside flex&#39;s own bracket, lays the children out on a responsive row of N equal columns, column-1 through column-8, dropping to fewer columns at each breakpoint.</li><li><code>column-1</code>: inside flex&#39;s own bracket, stacks the children in a single column.</li><li><code>column-2</code>: inside flex&#39;s own bracket, two columns per row; values from 1 through 8 are supported.</li><li><code>column-4</code>: inside flex&#39;s own bracket, four columns per row.</li><li><code>m2e</code>: inside flex&#39;s own bracket, keeps two items per row at the mobile breakpoint instead of one, returning to one on watch-sized containers.</li><li><code>flexInitial</code>: inside flexChild&#39;s own bracket, uses the flex initial sizing behavior on a flex child.</li><li><code>flexNone</code>: inside flexChild&#39;s own bracket, prevents a flex child from growing or shrinking.</li><li><code>flex1</code>: inside flexChild&#39;s own bracket, lets a flex child grow and shrink to fill available space.</li><li><code>flexFull</code>: inside flexChild&#39;s own bracket, makes a flex child occupy a full row.</li><li><code>flexValue</code>: inside flexChild&#39;s own bracket, sets a flex child&#39;s basis to --flex-flexValue, set inline for an arbitrary value.</li><li><code>flexS</code>: inside flexChild&#39;s own bracket, grows the item by a weight of 1 (--flexChild-size-s) on a zero basis, so sizes next to each other split the row in exact proportion.</li><li><code>flexM</code>: inside flexChild&#39;s own bracket, grows the item by a weight of 2 (--flexChild-size-m).</li><li><code>flexL</code>: inside flexChild&#39;s own bracket, grows the item by a weight of 3 (--flexChild-size-l).</li><li><code>flexXl</code>: inside flexChild&#39;s own bracket, grows the item by a weight of 4 (--flexChild-size-xl).</li><li><code>flexXxl</code>: inside flexChild&#39;s own bracket, grows the item by a weight of 5 (--flexChild-size-xxl).</li><li><code>colS</code>: inside flexChild&#39;s own bracket, makes the item take 1 column (--flexChild-col-s) of a flex[&#39;column-N&#39;] row, capped by the columns the current breakpoint leaves; outside a column-N row it does nothing. A grid item uses gridChild&#39;s own col* instead.</li><li><code>colM</code>: inside flexChild&#39;s own bracket, takes 2 columns (--flexChild-col-m) of a column-N row.</li><li><code>colL</code>: inside flexChild&#39;s own bracket, takes 3 columns (--flexChild-col-l): three of a column-4, and a full row where the breakpoint leaves only two.</li><li><code>colXl</code>: inside flexChild&#39;s own bracket, takes 4 columns (--flexChild-col-xl) of a column-N row.</li><li><code>colXxl</code>: inside flexChild&#39;s own bracket, takes 5 columns (--flexChild-col-xxl) of a column-N row.</li><li><code>flexOrderFirst</code>: inside flexChild&#39;s own bracket, places a flex child before its siblings.</li><li><code>flexOrderLast</code>: inside flexChild&#39;s own bracket, places a flex child after its siblings.</li><li><code>gapTexts</code>: the text gap between the items; also sets --flex-gap, the gap a column-N row computes its widths with.</li><li><code>gapElements</code>: the element gap between the items, and --flex-gap with it.</li><li><code>gapSections</code>: the section gap between the items, and --flex-gap with it; meant for large page blocks, since it also spaces the rows.</li><li><code>gapNone</code>: removes the gap, and sets --flex-gap to 0.</li><li><code>itemStart</code>: sets align-items to start on the flex or grid container.</li><li><code>itemCenter</code>: sets align-items to center on the flex or grid container.</li><li><code>itemEnd</code>: sets align-items to end on the flex or grid container.</li><li><code>itemStretch</code>: sets align-items to stretch on the flex or grid container.</li><li><code>itemBaseline</code>: sets align-items to baseline on the flex or grid container.</li><li><code>justifyStart</code>: sets justify-content to start on the flex or grid container.</li><li><code>justifyCenter</code>: sets justify-content to center on the flex or grid container.</li><li><code>justifyEnd</code>: sets justify-content to end on the flex or grid container.</li><li><code>justifyBetween</code>: sets justify-content to space-between on the flex or grid container.</li><li><code>justifyAround</code>: sets justify-content to space-around on the flex or grid container.</li><li><code>justifyEvenly</code>: sets justify-content to space-evenly on the flex or grid container.</li><li><code>contentStart</code>: sets align-content to start on the flex or grid container.</li><li><code>contentCenter</code>: sets align-content to center on the flex or grid container.</li><li><code>contentEnd</code>: sets align-content to end on the flex or grid container.</li><li><code>contentBetween</code>: sets align-content to space-between on the flex or grid container.</li><li><code>contentAround</code>: sets align-content to space-around on the flex or grid container.</li><li><code>contentEvenly</code>: sets align-content to space-evenly on the flex or grid container.</li><li><code>selfStart</code>: sets align-self to start on a single flex or grid child, overriding the container alignment.</li><li><code>selfCenter</code>: sets align-self to center on a single flex or grid child, overriding the container alignment.</li><li><code>selfEnd</code>: sets align-self to end on a single flex or grid child, overriding the container alignment.</li><li><code>selfStretch</code>: sets align-self to stretch on a single flex or grid child, overriding the container alignment.</li><li><code>selfBaseline</code>: sets align-self to baseline on a single flex or grid child, overriding the container alignment.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content grid-auto-flow: dense), so the visual order can differ from the source order.</li><li><code>colS</code>: inside gridChild&#39;s own bracket, makes the item span 1 column (--gridChild-col-s) of a grid[&#39;column-N&#39;], capped by the columns the current breakpoint leaves, so a span never makes the grid add columns of its own; outside a column-N grid it does nothing.</li><li><code>colM</code>: inside gridChild&#39;s own bracket, spans 2 columns (--gridChild-col-m).</li><li><code>colL</code>: inside gridChild&#39;s own bracket, spans 3 columns (--gridChild-col-l): three of a column-4, and the full row where the breakpoint leaves only two.</li><li><code>colXl</code>: inside gridChild&#39;s own bracket, spans 4 columns (--gridChild-col-xl).</li><li><code>colXxl</code>: inside gridChild&#39;s own bracket, spans 5 columns (--gridChild-col-xxl).</li><li><code>gapTexts</code>: the text gap between the items; also sets --flex-gap, the gap a column-N row computes its widths with.</li><li><code>gapElements</code>: the element gap between the items, and --flex-gap with it.</li><li><code>gapSections</code>: the section gap between the items, and --flex-gap with it; meant for large page blocks, since it also spaces the rows.</li><li><code>gapNone</code>: removes the gap, and sets --flex-gap to 0.</li><li><code>itemStart</code>: sets align-items to start on the flex or grid container.</li><li><code>itemCenter</code>: sets align-items to center on the flex or grid container.</li><li><code>itemEnd</code>: sets align-items to end on the flex or grid container.</li><li><code>itemStretch</code>: sets align-items to stretch on the flex or grid container.</li><li><code>itemBaseline</code>: sets align-items to baseline on the flex or grid container.</li><li><code>justifyStart</code>: sets justify-content to start on the flex or grid container.</li><li><code>justifyCenter</code>: sets justify-content to center on the flex or grid container.</li><li><code>justifyEnd</code>: sets justify-content to end on the flex or grid container.</li><li><code>justifyBetween</code>: sets justify-content to space-between on the flex or grid container.</li><li><code>justifyAround</code>: sets justify-content to space-around on the flex or grid container.</li><li><code>justifyEvenly</code>: sets justify-content to space-evenly on the flex or grid container.</li><li><code>contentStart</code>: sets align-content to start on the flex or grid container.</li><li><code>contentCenter</code>: sets align-content to center on the flex or grid container.</li><li><code>contentEnd</code>: sets align-content to end on the flex or grid container.</li><li><code>contentBetween</code>: sets align-content to space-between on the flex or grid container.</li><li><code>contentAround</code>: sets align-content to space-around on the flex or grid container.</li><li><code>contentEvenly</code>: sets align-content to space-evenly on the flex or grid container.</li><li><code>selfStart</code>: sets align-self to start on a single flex or grid child, overriding the container alignment.</li><li><code>selfCenter</code>: sets align-self to center on a single flex or grid child, overriding the container alignment.</li><li><code>selfEnd</code>: sets align-self to end on a single flex or grid child, overriding the container alignment.</li><li><code>selfStretch</code>: sets align-self to stretch on a single flex or grid child, overriding the container alignment.</li><li><code>selfBaseline</code>: sets align-self to baseline on a single flex or grid child, overriding the container alignment.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>box</code>: makes the demonstration cells visible.</li><li><code>flex</code>: lays out the text inside each demonstration cell; see Flex.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>column</code>: inside flex&#39;s own bracket, stacks the text of each demonstration cell; see Flex.</li></ul></div></div></div></div><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h2 class="demoContent-heading demoContent-heading-h2">Examples</h2></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Grid layout</h3><p>Four-column grid layout using column-4 with m2e to collapse to two columns per row on mobile.</p></div><div pgs="container flex['column' 'gapElements']"><section>

&lt;/div&gt;</code></pre></div></div></section></div><div id="layout-breakpoints" pgs="pageNav-panels-content"><section class="demoContent" data-reference="layout/breakpoints.html" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h1 class="demoContent-heading demoContent-heading-h1">Breakpoints</h1><p>Responsive visibility built on the shared breakpoint scale: watch 315px, mobile 430px, big mobile 615px, tablet 800px, big tablet 900px and laptop 1100px. hide alone, with no bracket, always hides — every breakpoint instead lives inside hide&#39;s own bracket, crossing the two queries with the two directions: Media reads the viewport, Container reads the nearest ancestor marked with pgs=&quot;container&quot;, Down hides at or below the width, Up hides from the width upwards. Combine more than one to hide outside a range, e.g. hide[&#39;hideMediaDownTablet&#39; &#39;hideMediaUpLaptop&#39;] to show an element only between Tablet and Laptop.</p></div><div class="demoContent-doc" pgs="box accordionContainer" style="padding:10px;"><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>hide</code>: hides the element unconditionally when written bare; with a breakpoint option in its bracket, hides only past that threshold instead.</li></ul></div><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS Options (component brackets)</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>hideMediaDownWatch</code>: hides an element when the viewport is 315px wide or narrower.</li><li><code>hideMediaDownMobile</code>: hides an element when the viewport is 430px wide or narrower.</li><li><code>hideMediaDownBigMobile</code>: hides an element when the viewport is 615px wide or narrower.</li><li><code>hideMediaDownTablet</code>: hides an element when the viewport is 800px wide or narrower.</li><li><code>hideMediaDownBigTablet</code>: hides an element when the viewport is 900px wide or narrower.</li><li><code>hideMediaDownLaptop</code>: hides an element when the viewport is 1100px wide or narrower.</li><li><code>hideMediaUpWatch</code>: hides an element when the viewport is at least 315px wide.</li><li><code>hideMediaUpMobile</code>: hides an element when the viewport is at least 430px wide.</li><li><code>hideMediaUpBigMobile</code>: hides an element when the viewport is at least 615px wide.</li><li><code>hideMediaUpTablet</code>: hides an element when the viewport is at least 800px wide.</li><li><code>hideMediaUpBigTablet</code>: hides an element when the viewport is at least 900px wide.</li><li><code>hideMediaUpLaptop</code>: hides an element when the viewport is at least 1100px wide.</li><li><code>hideContainerDownWatch</code>: hides an element when its nearest container is 315px wide or narrower.</li><li><code>hideContainerDownMobile</code>: hides an element when its nearest container is 430px wide or narrower.</li><li><code>hideContainerDownBigMobile</code>: hides an element when its nearest container is 615px wide or narrower.</li><li><code>hideContainerDownTablet</code>: hides an element when its nearest container is 800px wide or narrower.</li><li><code>hideContainerDownBigTablet</code>: hides an element when its nearest container is 900px wide or narrower.</li><li><code>hideContainerDownLaptop</code>: hides an element when its nearest container is 1100px wide or narrower.</li><li><code>hideContainerUpWatch</code>: hides an element when its nearest container is at least 315px wide.</li><li><code>hideContainerUpMobile</code>: hides an element when its nearest container is at least 430px wide.</li><li><code>hideContainerUpBigMobile</code>: hides an element when its nearest container is at least 615px wide.</li><li><code>hideContainerUpTablet</code>: hides an element when its nearest container is at least 800px wide.</li><li><code>hideContainerUpBigTablet</code>: hides an element when its nearest container is at least 900px wide.</li><li><code>hideContainerUpLaptop</code>: hides an element when its nearest container is at least 1100px wide.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>flex</code>: provides the flex layout; direction and spacing are flags in its bracket.</li><li><code>container</code>: establishes the inline-size container the containerDown* and containerUp* options are measured against; without it they fall back to the nearest container in the page, or never match at all.</li><li><code>box</code>: makes each example visible as a surface.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>column</code>: stacks the groups vertically.</li><li><code>row</code>: arranges the examples in a row.</li><li><code>wrap</code>: allows the examples to wrap onto several rows.</li><li><code>gapTexts</code>: separates the examples inside a group.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">Other</h5><ul pgs="flex['column' 'gapTexts']"><li><code>gapSections</code>: separates the groups.</li></ul></div></div></div></div><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h2 class="demoContent-heading demoContent-heading-h2">Examples</h2></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Viewport visibility</h3><p>mediaDown* and mediaUp* read the viewport width, so they answer to the browser window whatever the element is nested in. Resize the window to see them appear an &lt;/div&gt;</code></pre></div></div></section></div><div id="layout-spacing" pgs="pageNav-panels-content"><section class="demoContent" data-reference="layout/spacing.html" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h1 class="demoContent-heading demoContent-heading-h1">Spacing</h1><p>Margin and padding utilities based on the shared MyPGS spacing scales. One root each — margin, padding — with every direction and scale folded into the option name (mrgLeftTexts, padBlockPage, ...) instead of a separate root per direction, so two of them can combine in the same bracket in any order. The gap utilities live in Flex and Grid instead, because they only take effect on a flex or grid container.</p></div><div class="demoContent-doc" pgs="box accordionContainer" style="padding:10px;"><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>margin</code>: applies configurable spacing, on every side by default, or on one direction with the option in its bracket.</li><li><code>padding</code>: applies configurable inner spacing, on every side by default, or on one direction with the option in its bracket.</li></ul></div><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS Options (component brackets)</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>mrgHalf</code>: inside margin&#39;s own bracket, the double padding token, on every side.</li><li><code>mrgTexts</code>: inside margin&#39;s own bracket, the text spacing scale, on every side; also the default with no option at all.</li><li><code>mrgElements</code>: inside margin&#39;s own bracket, the element spacing scale, on every side.</li><li><code>mrgSections</code>: inside margin&#39;s own bracket, the section spacing scale, on every side.</li><li><code>mrgPage</code>: inside margin&#39;s own bracket, the page padding token, on every side.</li><li><code>mrgAuto</code>: inside margin&#39;s own bracket, auto on every side, to centre an element or push it away.</li><li><code>mrgUnset</code>: inside margin&#39;s own bracket, resets every side to its initial value.</li><li><code>mrgNegative</code>: inside margin&#39;s own bracket, negates whatever margin value is combined with it in the same bracket — the default padding on its own, or any direction/scale flag paired with it, since the sign is a single shared property read by every branch.</li><li><code>mrgLeft</code>: inside margin&#39;s own bracket, the text spacing scale on the left only, the same default as bare margin.</li><li><code>mrgLeftHalf</code>: inside margin&#39;s own bracket, the double padding token on the left only.</li><li><code>mrgLeftTexts</code>: inside margin&#39;s own bracket, the text spacing scale on the left only.</li><li><code>mrgLeftElements</code>: inside margin&#39;s own bracket, the element spacing scale on the left only.</li><li><code>mrgLeftSections</code>: inside margin&#39;s own bracket, the section spacing scale on the left only.</li><li><code>mrgLeftPage</code>: inside margin&#39;s own bracket, the page padding token on the left only.</li><li><code>mrgLeftAuto</code>: inside margin&#39;s own bracket, auto on the left only.</li><li><code>mrgLeftUnset</code>: inside margin&#39;s own bracket, unset on the left only.</li><li><code>mrgRight</code>: inside margin&#39;s own bracket, the text spacing scale on the right only, the same default as bare margin.</li><li><code>mrgRightHalf</code>: inside margin&#39;s own bracket, the double padding token on the right only.</li><li><code>mrgRightTexts</code>: inside margin&#39;s own bracket, the text spacing scale on the right only.</li><li><code>mrgRightElements</code>: inside margin&#39;s own bracket, the element spacing scale on the right only.</li><li><code>mrgRightSections</code>: inside margin&#39;s own bracket, the section spacing scale on the right only.</li><li><code>mrgRightPage</code>: inside margin&#39;s own bracket, the page padding token on the right only.</li><li><code>mrgRightAuto</code>: inside margin&#39;s own bracket, auto on the right only.</li><li><code>mrgRightUnset</code>: inside margin&#39;s own bracket, unset on the right only.</li><li><code>mrgTop</code>: inside margin&#39;s own bracket, the text spacing scale on the top only, the same default as bare margin.</li><li><code>mrgTopHalf</code>: inside margin&#39;s own bracket, the double padding token on the top only.</li><li><code>mrgTopTexts</code>: inside margin&#39;s own bracket, the text spacing scale on the top only.</li><li><code>mrgTopElements</code>: inside margin&#39;s own bracket, the element spacing scale on the top only.</li><li><code>mrgTopSections</code>: inside margin&#39;s own bracket, the section spacing scale on the top only.</li><li><code>mrgTopPage</code>: inside margin&#39;s own bracket, the page padding token on the top only.</li><li><code>mrgTopAuto</code>: inside margin&#39;s own bracket, auto on the top only.</li><li><code>mrgTopUnset</code>: inside margin&#39;s own bracket, unset on the top only.</li><li><code>mrgBottom</code>: inside margin&#39;s own bracket, the text spacing scale on the bottom only, the same default as bare margin.</li><li><code>mrgBottomHalf</code>: inside margin&#39;s own bracket, the double padding token on the bottom only.</li><li><code>mrgBottomTexts</code>: inside margin&#39;s own bracket, the text spacing scale on the bottom only.</li><li><code>mrgBottomElements</code>: inside margin&#39;s own bracket, the element spacing scale on the bottom only.</li><li><code>mrgBottomSections</code>: inside margin&#39;s own bracket, the section spacing scale on the bottom only.</li><li><code>mrgBottomPage</code>: inside margin&#39;s own bracket, the page padding token on the bottom only.</li><li><code>mrgBottomAuto</code>: inside margin&#39;s own bracket, auto on the bottom only.</li><li><code>mrgBottomUnset</code>: inside margin&#39;s own bracket, unset on the bottom only.</li><li><code>mrgInline</code>: inside margin&#39;s own bracket, the text spacing scale on the inline axis only, the same default as bare margin.</li><li><code>mrgInlineHalf</code>: inside margin&#39;s own bracket, the double padding token on the inline axis only.</li><li><code>mrgInlineTexts</code>: inside margin&#39;s own bracket, the text spacing scale on the inline axis only.</li><li><code>mrgInlineElements</code>: inside margin&#39;s own bracket, the element spacing scale on the inline axis only.</li><li><code>mrgInlineSections</code>: inside margin&#39;s own bracket, the section spacing scale on the inline axis only.</li><li><code>mrgInlinePage</code>: inside margin&#39;s own bracket, the page padding token on the inline axis only.</li><li><code>mrgInlineAuto</code>: inside margin&#39;s own bracket, auto on the inline axis only.</li><li><code>mrgInlineUnset</code>: inside margin&#39;s own bracket, unset on the inline axis only.</li><li><code>mrgBlock</code>: inside margin&#39;s own bracket, the text spacing scale on the block axis only, the same default as bare margin.</li><li><code>mrgBlockHalf</code>: inside margin&#39;s own bracket, the double padding token on the block axis only.</li><li><code>mrgBlockTexts</code>: inside margin&#39;s own bracket, the text spacing scale on the block axis only.</li><li><code>mrgBlockElements</code>: inside margin&#39;s own bracket, the element spacing scale on the block axis only.</li><li><code>mrgBlockSections</code>: inside margin&#39;s own bracket, the section spacing scale on the block axis only.</li><li><code>mrgBlockPage</code>: inside margin&#39;s own bracket, the page padding token on the block axis only.</li><li><code>mrgBlockAuto</code>: inside margin&#39;s own bracket, auto on the block axis only.</li><li><code>mrgBlockUnset</code>: inside margin&#39;s own bracket, unset on the block axis only.</li><li><code>padHalf</code>: inside padding&#39;s own bracket, the double padding token, RightPage</code>: inside padding&#39;s own bracket, the page padding token on the right only.</li><li><code>padRightUnset</code>: inside padding&#39;s own bracket, unset on the right only.</li><li><code>padTop</code>: inside padding&#39;s own bracket, the text spacing scale on the top only, the same default as bare padding.</li><li><code>padTopHalf</code>: inside padding&#39;s own bracket, the double padding token on the top only.</li><li><code>padTopTexts</code>: inside padding&#39;s own bracket, the text spacing scale on the top only.</li><li><code>padTopElements</code>: inside padding&#39;s own bracket, the element spacing scale on the top only.</li><li><code>padTopSections</code>: inside padding&#39;s own bracket, the section spacing scale on the top only.</li><li><code>padTopPage</code>: inside padding&#39;s own bracket, the page padding token on the top only.</li><li><code>padTopUnset</code>: inside padding&#39;s own bracket, unset on the top only.</li><li><code>padBottom</code>: inside padding&#39;s own bracket, the text spacing scale on the bottom only, the same default as bare padding.</li><li><code>padBottomHalf</code>: inside padding&#39;s own bracket, the double padding token on the bottom only.</li><li><code>padBottomTexts</code>: inside padding&#39;s own bracket, the text spacing scale on the bottom only.</li><li><code>padBottomElements</code>: inside padding&#39;s own bracket, the element spacing scale on the bottom only.</li><li><code>padBottomSections</code>: inside padding&#39;s own bracket, the section spacing scale on the bottom only.</li><li><code>padBottomPage</code>: inside padding&#39;s own bracket, the page padding token on the bottom only.</li><li><code>padBottomUnset</code>: inside padding&#39;s own bracket, unset on the bottom only.</li><li><code>padInline</code>: inside padding&#39;s own bracket, the text spacing scale on the inline axis only, the same default as bare padding.</li><li><code>padInlineHalf</code>: inside padding&#39;s own &lt;p pgs=&quot;margin[&#39;mrgLeftHalf&#39;]&quot;&gt;Double padding on the left.&lt;/p&gt;
&lt;p pgs=&quot;margin[&#39;mrgLeftPage&#39;]&quot;&gt;Page padding on the left.&lt;/p&gt;
&lt;p pgs=&quot;box margin[&#39;mrgInlineAuto&#39;]&quot;&gt;Centred by auto.&lt;/p&gt;</code></pre></div></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Negative</h3><p>mrgNegative negates whatever else is combined with it in the same bracket — the default padding on its own, or a direction/scale flag paired with it. It is how a child reaches past the padding of the box it sits in.</p></div><div pgs="container flex['column' 'gapElements']"><section pgs="box padding['padElements']">
    <p pgs="box margin['mrgNegative' 'mrgInlineElements']">Pulled out to the edges of the padded box.</p>
</section></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;p pgs=&quot;box margin[&#39;mrgNegative&#39; &#39;mrgInlineElements&#39;]&quot;&gt;Pulled out to the edges of the padded box.&lt;/p&gt;</code></pre></div></div><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h2 class="demoContent-heading demoContent-heading-h2">Padding</h2></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Directions</h3><p>Configurable padding utilities on every side and axis, each paired with a spacing scale option.</p></div><div pgs="container flex['column' 'gapElements']"><section pgs="flex['column' 'gapTexts']">
    <strong>Directions</strong>
    <p pgs="padding['padLeftTexts']">Text spacing on the left.</p>
    <p pgs="padding['padRightElements']">Element spacing on the right.</p>
    <p pgs="padding['padBottomSections']">Section spacing below.</p>
    <p pgs="padding['padTopTexts']">Text spacing above.</p>
    <p pgs="padding['padInlineElements']">Element spacing on the inline axis.</p>
    <p pgs="padding['padBlockSections']">Section spacing on the block axis.</p>
    <p pgs="box padding['padElements']">Element spacing on every side.</p>
    <p pgs="box padding['padUnset']">No padding at all.</p>
</section></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;strong&gt;Directions&lt;/strong&gt;
&lt;p pgs=&quot;padding[&#39;padLeftTexts&#39;]&quot;&gt;Text spacing on the left.&lt;/p&gt;
&lt;p pgs=&quot;padding[&#39;padRightElements&#39;]&quot;&gt;Element spacing on the right.&lt;/p&gt;
&lt;p pgs=&quot;padding[&#39;padBottomSections&#39;]&quot;&gt;Section spacing below.&lt;/p&gt;
&lt;p pgs=&quot;padding[&#39;padTopTexts&#39;]&quot;&gt;Text spacing above.&lt;/p&gt;
&lt;p pgs=&quot;padding[&#39;padInlineElements&#39;]&quot;&gt;Element spacing on the inline axis.&lt;/p&gt;
&lt;p pgs=&quot;padding[&#39;padBlockSections&#39;]&quot;&gt;Section spacing on the block axis.&lt;/p&gt;
&lt;p pgs=&quot;box padding[&#39;padElements&#39;]&quot;&gt;Element spacing on every side.&lt;/p&gt;
&lt;p pgs=&quot;box padding[&#39;padUnset&#39;]&quot;&gt;No padding at all.&lt;/p&gt;</code></pre></div></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Scales</h3><p>Besides the three text, element and section scales and the page padding token, the double padding token is also available on the same utilities.</p></div><div pgs="container flex['column' 'gapElements']"><section pgs="flex['column' 'gapTexts']">
    <strong>Scales</strong>
    <p pgs="padding['padInlineHalf']">Double padding on the inline axis.</p>
    <p pgs="padding['padInlinePage']">Page padding on the inline axis.</p>
</section></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;strong&gt;Scales&lt;/strong&gt;
&lt;p pgs=&quot;padding[&#39;padInlineHalf&#39;]&quot;&gt;Double padding on the inline axis.&lt;/p&gt;
&lt;p pgs=&quot;padding[&#39;padInlinePage&#39;]&quot;&gt;Page padding on the inline axis.&lt;/p&gt;</code></pre></div></div></section></div><div id="layout-size" pgs="pageNav-panels-content"><section class="demoContent" data-reference="layout/size.html" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h1 class="demoContent-heading demoContent-heading-h1">Size</h1><p>Width and height utilities, each driven by its own custom property: --width-size for width, --widthMax-size for widthMax, and so on, so combining two of them on the same element (a floor and a ceiling, say) never fights over a shared one. The width side wraps every value in min() against the container, because an element that is too wide breaks the page with a horizontal scrollbar; the height side does not, because an element that is too tall just scrolls, which is what a page does anyway. The scales differ for the same reason: widths come off the page, heights off the viewport, the only measure a block can be tall against without a parent that already has a height. Set a utility&#39;s own -size property inline for an arbitrary value, or pick one of the scales.</p></div><div class="demoContent-doc" pgs="box accordionContainer" style="padding:10px;"><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>width</code>: sets the element width to --width-size, or to the container when that is narrower.</li><li><code>widthMax</code>: caps the element at --widthMax-size while it keeps its own natural width below it.</li><li><code>widthMin</code>: keeps the element at least --widthMin-size wide, unless the container itself is narrower.</li><li><code>height</code>: sets the element height to --height-size.</li><li><code>heightMax</code>: caps the element at --heightMax-size, and needs an overflow utility next to it or the content spills out.</li><li><code>heightMin</code>: keeps the element at least --heightMin-size tall, and lets it grow past that with its content.</li></ul></div><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS Options (component brackets)</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>widthPage</code>: inside width&#39;s own bracket, uses the page width and is the default for every width utility.</li><li><code>widthPageHalf</code>: inside width&#39;s own bracket, uses half the page width, for two columns that line up with the page content.</li><li><code>widthPageThird</code>: inside width&#39;s own bracket, uses a third of the page width.</li><li><code>widthText</code>: inside width&#39;s own bracket, uses a 65 character measure, the width a line of text stays readable at, independent of the page width.</li><li><code>widthFull</code>: inside width&#39;s own bracket, uses the whole container width.</li><li><code>widthFillAvailable</code>: inside width&#39;s own bracket, uses -webkit-fill-available, the space actually left after margins and padding on iOS Safari, where percentages and viewport units miscompute against the address bar. Unsupported outside Chromium/Safari, where the invalid value is dropped and the element falls back to whichever other option, or its own -size property, it also carries.</li><li><code>widthMaxPage</code>: inside widthMax&#39;s own bracket, the same page width scale as widthPage, capping instead of setting.</li><li><code>widthMaxPageHalf</code>: inside widthMax&#39;s own bracket, the same half-page scale as widthPageHalf.</li><li><code>widthMaxPageThird</code>: inside widthMax&#39;s own bracket, the same third-page scale as widthPageThird.</li><li><code>widthMaxText</code>: inside widthMax&#39;s own bracket, the same 65 character measure as widthText.</li><li><code>widthMaxFull</code>: inside widthMax&#39;s own bracket, the same whole container width as widthFull.</li><li><code>widthMaxFillAvailable</code>: inside widthMax&#39;s own bracket, the same -webkit-fill-available as widthFillAvailable.</li><li><code>widthMinPage</code>: inside widthMin&#39;s own bracket, the same page width scale as widthPage, flooring instead of setting.</li><li><code>widthMinPageHalf</code>: inside widthMin&#39;s own bracket, the same half-page scale as widthPageHalf.</li><li><code>widthMinPageThird</code>: inside widthMin&#39;s own bracket, the same third-page scale as widthPageThird.</li><li><code>widthMinText</code>: inside widthMin&#39;s own bracket, the same 65 character measure as widthText.</li><li><code>widthMinFull</code>: inside widthMin&#39;s own bracket, the same whole container width as widthFull.</li><li><code>widthMinFillAvailable</code>: inside widthMin&#39;s own bracket, the same -webkit-fill-available as widthFillAvailable.</li><li><code>heightFull</code>: inside height&#39;s own bracket, uses the whole parent height, which only resolves when the parent has a definite height of its own.</li><li><code>heightScreen</code>: inside height&#39;s own bracket, uses the small viewport height, the screen with the browser toolbars expanded, and is the default for every height utility. The element never grows past the screen as the toolbars retract.</li><li><code>heightScreenLive</code>: inside height&#39;s own bracket, uses the dynamic viewport height, which follows the visible area as the toolbars come and go, at the cost of resizing during the scroll.</li><li><code>heightScreenLarge</code>: inside height&#39;s own bracket, uses the large viewport height, the screen with the toolbars retracted, for something meant to run under them.</li><li><code>heightScreenHalf</code>: inside height&#39;s own bracket, uses half the small viewport height.</li><li><code>heightUnderHeader</code>: inside height&#39;s own bracket, uses what is left of the screen below the header, for a hero that fills the first view.</li><li><code>heightUnderMain</code>: inside height&#39;s own bracket, the same idea for an element that is the first child of main instead, subtracting --main-padding-top rather than just the header height, since main already carries the extra room --page-top adds.</li><li><code>heightAuto</code>: inside height&#39;s own bracket, drops the height constraint on one element without dropping the utility.</li><li><code>heightMaxFull</code>: inside heightMax&#39;s own bracket, the same whole parent height as heightFull.</li><li><code>heightMaxScreen</code>: inside heightMax&#39;s own bracket, the same small viewport height as heightScreen, and the default for heightMax.</li><li><code>heightMaxScreenLive</code>: inside heightMax&#39;s own bracket, the same dynamic viewport height as heightScreenLive.</li><li><code>heightMaxScreenLarge</code>: inside heightMax&#39;s own bracket, the same large viewport height as heightScreenLarge.</li><li><code>heightMaxScreenHalf</code>: inside heightMax&#39;s own bracket, the same half viewport height as heightScreenHalf.</li><li><code>heightMaxUnderHeader</code>: inside heightMax&#39;s own bracket, the same header-relative height as heightUnderHeader.</li><li><code>heightMaxUnderMain</code>: inside heightMax&#39;s own bracket, the same main-relative height as heightUnderMain.</li><li><code>heightMaxAuto</code>: inside heightMax&#39;s own bracket, drops the ceiling on one element without dropping the utility.</li><li><code>heightMinFull</code>: inside heightMin&#39;s own bracket, the same whole parent height as heightFull.</li><li><code>heightMinScreen</code>: inside heightMin&#39;s own bracket, the same small viewport height as heightScreen, and the default for heightMin.</li><li><code>heightMinScreenLive</code>: inside heightMin&#39;s own bracket, the same dynamic viewport height as heightScreenLive.</li><li><code>heightMinScreenLarge</code>: inside heightMin&#39;s own bracket, the same large viewport height as heightScreenLarge.</li><li><code>heightMinScreenHalf</code>: inside heightMin&#39;s own bracket, the same half viewport height as heightScreenHalf.</li><li><code>heightMinUnderHeader</code>: inside heightMin&#39;s own bracket, the same header-relative height as heightUnderHeader.</li><li><code>heightMinUnderMain</code>: inside heightMin&#39;s own bracket, the same main-relative height as heightUnderMain.</li><li><code>heightMinAuto</code>: inside heightMin&#39;s own bracket, drops the floor on one element without dropping the utility.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>flex</code>: provides the flex layout; direction and spacing are flags in its bracket.</li><li><code>main</code>: sets --main-padding-top, which underMain subtracts from the viewport height.</li><li><code>box</code>: makes the measured elements visible.</li><li><code>overflow</code>: scrolls the content a heightMax element cannot show.</li><li><code>margin</code>: provides the spacing utility used here.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>column</code>: arranges the groups vertically.</li><li><code>row</code>: places the column and viewport examples side by side.</li><li><code>ovAuto</code>: inside overflow&#39;s own bracket, adds scrolling only when content overflows.</li><li><code>mrgInlineAuto</code>: inside margin&#39;s own bracket, pairs with auto to centre a constrained element.</li><li><code>gapTexts</code>: separates the examples inside a group.</li><li><code>gapElements</code>: separates the side by side examples.</li><li><code>flexCenter</code>: centres the label inside each measured block.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">Other</h5><ul pgs="flex['column' 'gapTexts']"><li><code>gapSections</code>: separates the groups.</li></ul></div></div></div></div><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h2 class="demoContent-heading demoContent-heading-h2">Width</h2></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Width scales</h3><p>The width scales come off the page, so a constrained element lines up with the page content. The option chooses the value, the pgs token chooses the property it lands on.</p></div><div pgs="container flex['column' 'gapElements']"><section pgs="flex['column' 'gapTexts']">
    <strong>Width scales</strong>
    <p pgs="box width['widthPage']">Page width.</p>
    <p pgs="box width['widthPageHalf']">Half the page width.</p>
    <p pgs="box width['widthPageThird']">A third of the page width.</p>
    <p pgs="box width['widthText']">A 65 character measure, the width a line of text stays readable at.</p>
    <p pgs="box width['widthFull']">The whole container width.</p>
    <p pgs="box width['widthFillAvailable']">-webkit-fill-available, Chromium/Safari only.</p>
</section></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;strong&gt;Width scales&lt;/strong&gt;
&lt;p pgs=&quot;box width[&#39;widthPage&#39;]&quot;&gt;Page width.&lt;/p&gt;
&lt;p pgs=&quot;box width[&#39;widthPageHalf&#39;]&quot;&gt;Half the page width.&lt;/p&gt;
&lt;p pgs=&quot;box width[&#39;widthPageThird&#39;]&quot;&gt;A third of the page width.&lt;/p&gt;
&lt;p pgs=&quot;box width[&#39;widthText&#39;]&quot;&gt;A 65 character measure, the width a line of text stays readable at.&lt;/p&gt;
&lt;p pgs=&quot;box width[&#39;widthFull&#39;]&quot;&gt;The whole container width.&lt;/p&gt;
&lt;p pgs=&quot;box width[&#39;widthFillAvailable&#39;]&quot;&gt;-webkit-fill-available, Chromium/Safari only.&lt;/p&gt;</code></pre></div></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Arbitrary width</h3><p>Without an option the value comes from the utility&#39;s own -size property (--width-size, --widthMin-size, --widthMax-size), which can be set inline, from a theme or from any enclosing rule. Every value stays capped at the container.</p></div><div pgs="container flex['column' 'gapElements']"><section pgs="flex['column' 'gapTexts']">
    <strong>Arbitrary width</strong>
    <p pgs="box width" style="--width-size: 600px">Six hundred pixels, capped at the container.</p>
    <p pgs="box widthMin" style="--widthMin-size: 400px">At least four hundred pixels.</p>
    <p pgs="box widthMax margin['mrgInlineAuto']" style="--widthMax-size: 500px">Capped at five hundred pixels and centred.</p>
</section></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;strong&gt;Arbitrary width&lt;/strong&gt;
&lt;p pgs=&quot;box width&quot; style=&quot;--width-size: 600px&quot;&gt;Six hundred pixels, capped at the container.&lt;/p&gt;
&lt;p pgs=&quot;box widthMin&quot; style=&quot;--widthMin-size: 400px&quot;&gt;At least four hundred pixels.&lt;/p&gt;
&lt;p pgs=&quot;box widthMax margin[&#39;mrgInlineAuto&#39;]&quot; style=&quot;--widthMax-size: 500px&quot;&gt;Capped at five hundred pixels and centred.&lt;/p&gt;</code></pre></div></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Two columns</h3><p>Half the page width on each side of a row, so the text keeps the page rhythm while the row bleeds past the edge.</p></div><div pgs="container flex['column' 'gapElements']"><section pgs="flex['row' 'gapElements']">
    <p pgs="box widthMax['widthMaxPageHalf']">Text held at half the page width, so it stays aligned with the page content.</p>
    <p pgs="box widthMax['widthMaxPageHalf']">The second column takes the same ceiling.</p>
</section></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;p pgs=&quot;box widthMax[&#39;widthMaxPageHalf&#39;]&quot;&gt;Text held at half the page width, so it stays aligned with the page content.&lt;/p&gt;
&lt;p pgs=&quot;box widthMax[&#39;widthMaxPageHalf&#39;]&quot;&gt;The second column takes the same ceiling.&lt;/p&gt;</code></pre></div></div><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h2 class="demoContent-heading demoContent-heading-h2">Height</h2></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Viewport scales</h3><p>Each scale is a different reading of what the screen is: svh with the browser toolbars expanded, lvh with them retracted, dvh following them as they move.</p></div><div pgs="container flex['column' 'gapElements']"><section pgs="flex['row' 'gapElements']">
    <div pgs="box heightMin['heightMinScreenHalf'] flex['column' 'flexCenter']">Half the screen.</div>
    <div pgs="box heightMin['heightMinUnderHeader'] flex['column' 'flexCenter']">What is left below the header.</div>
</section></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;div pgs=&quot;box heightMin[&#39;heightMinScreenHalf&#39;] flex[&#39;column&#39; &#39;flexCenter&#39;]&quot;&gt;Half the screen.&lt;/div&gt;
&lt;div pgs=&quot;box heightMin[&#39;heightMinUnderHeader&#39;] flex[&#39;column&#39; &#39;flexCenter&#39;]&quot;&gt;What is left below the header.&lt;/div&gt;</code></pre></div></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">First element inside main</h3><p>underMain excludes main&#39;s own top padding (--main-padding-top) instead of just the header height, for an element that is the first child of main and still wants to fill the rest of the screen. A plain div carrying the main token here, so the page keeps its own single real &lt;main&gt;.</p></div><div pgs="container flex['column' 'gapElements']"><section>
    <div pgs="main">
        <div pgs="box heightMin['heightMinUnderMain'] flex['column' 'flexCenter']">First element inside main.</div>
    </div>
</section></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;div pgs=&quot;main&quot;&gt;
    &lt;div pgs=&quot;box heightMin[&#39;heightMinUnderMain&#39;] flex[&#39;column&#39; &#39;flexCenter&#39;]&quot;&gt;First element inside main.&lt;/div&gt;
&lt;/div&gt;</code></pre></div></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Floor and ceiling</h3><p>heightMin is the usual one for a section, because the element still grows with its content. heightMax needs an overflow utility next to it.</p></div><div pgs="container flex['column' 'gapElements']"><section pgs="flex['column' 'gapTexts']">
    <strong>Floor and ceiling</strong>
    <div pgs="box heightMin" style="--heightMin-size: 120px">At least a hundred and twenty pixels tall, and taller if the content asks for it.</div>
    <div pgs="box heightMax overflow['ovAuto']" style="--heightMax-size: 80px">Capped at eighty pixels, with the rest of the content reachable by scrolling. A ceiling without an overflow utility would simply let this text spill out of the box, because the element stops growing but the content does not.</div>
    <div pgs="box height" style="--height-size: 60px">Exactly sixty pixels.</div>
</section></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;strong&gt;Floor and ceiling&lt;/strong&gt;
&lt;div pgs=&quot;box heightMin&quot; style=&quot;--heightMin-size: 120px&quot;&gt;At least a hundred and twenty pixels tall, and taller if the content asks for it.&lt;/div&gt;
&lt;div pgs=&quot;box heightMax overflow[&#39;ovAuto&#39;]&quot; style=&quot;--heightMax-size: 80px&quot;&gt;Capped at eighty pixels, with the rest of the content reachable by scrolling. A ceiling without an overflow utility would simply let this text spill out of the box, because the element stops growing but the content does not.&lt;/div&gt;
&lt;div pgs=&quot;box height&quot; style=&quot;--height-size: 60px&quot;&gt;Exactly sixty pixels.&lt;/div&gt;</code></pre></div></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Dropping the constraint</h3><p>auto removes the limit on a single element while the utility stays in place, so a rule that sets --heightMin-size higher up is not fought with a second one.</p></div><div pgs="container flex['column' 'gapElements']"><section pgs="flex['column' 'gapTexts']">
    <strong>Dropping the constraint</strong>
    <div pgs="box heightMin['heightMinAuto']">No floor at all.</div>
</section></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;strong&gt;Dropping the constraint&lt;/strong&gt;
&lt;div pgs=&quot;box heightMin[&#39;heightMinAuto&#39;]&quot;&gt;No floor at all.&lt;/div&gt;</code></pre></div></div></section></div><div id="layout-utilities" pgs="pageNav-panels-content"><section class="demoContent" data-reference="layout/utilities.html" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h1 class="demoContent-heading demoContent-heading-h1">Utilities</h1><p>Focused layout, content, interaction, accessibility, and semantic-color utilities. Responsive visibility lives in Breakpoints.</p></div><div class="demoContent-doc" pgs="box accordionContainer" style="padding:10px;"><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>aspect</code>: gives an element an aspect ratio picked by the option in its bracket; written bare it does nothing.</li><li><code>block</code>: displays an element as a block.</li><li><code>cursorNotAllowed</code>: shows the unavailable cursor.</li><li><code>minWidth0</code>: allows flex or grid content to shrink below its intrinsic width.</li><li><code>overflow</code>: adds scrolling or clips overflowing content on both axes, or on one axis only with an axis option next to the scrolling behavior in its bracket.</li><li><code>pointerEvents</code>: sets pointer interaction to the value in its bracket; written bare it does nothing.</li><li><code>position</code>: positions an element the way the option in its bracket says; written bare it does nothing.</li><li><code>rotate</code>: rotates an element 180 degrees when written bare; a degree option in its bracket picks a different amount instead.</li><li><code>select</code>: allows or prevents text selection depending on the option in its bracket; written bare it does nothing.</li><li><code>textAlign</code>: aligns text the way the option in its bracket says; written bare it does nothing.</li><li><code>truncate</code>: limits text to one line and adds an ellipsis when it overflows.</li></ul></div><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS Options (component brackets)</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>aspSquare</code>: inside aspect&#39;s own bracket, gives it a 1:1 aspect ratio.</li><li><code>aspVideo</code>: inside aspect&#39;s own bracket, gives it a 16:9 aspect ratio.</li><li><code>ovAuto</code>: inside overflow&#39;s own bracket, adds scrolling only when content overflows, on both axes.</li><li><code>ovHidden</code>: inside overflow&#39;s own bracket, clips overflowing content on both axes.</li><li><code>ovAutoX</code>: inside overflow&#39;s own bracket, adds scrolling only when content overflows, on the horizontal axis only.</li><li><code>ovAutoY</code>: inside overflow&#39;s own bracket, adds scrolling only when content overflows, on the vertical axis only.</li><li><code>ovHiddenX</code>: inside overflow&#39;s own bracket, clips overflowing content on the horizontal axis only.</li><li><code>ovHiddenY</code>: inside overflow&#39;s own bracket, clips overflowing content on the vertical axis only.</li><li><code>peNone</code>: inside pointerEvents&#39;s own bracket, ignores pointer interaction.</li><li><code>peAuto</code>: inside pointerEvents&#39;s own bracket, restores pointer interaction.</li><li><code>posRelative</code>: inside position&#39;s own bracket, creates a positioning context.</li><li><code>posAbsolute</code>: inside position&#39;s own bracket, positions an element absolutely.</li><li><code>posSticky</code>: inside position&#39;s own bracket, keeps an element sticky when offsets are supplied by the surrounding layout.</li><li><code>rot0</code>: inside rotate&#39;s own bracket, resets the rotation back to 0 degrees.</li><li><code>rot90</code>: inside rotate&#39;s own bracket, rotates 90 degrees clockwise.</li><li><code>rot180</code>: inside rotate&#39;s own bracket, rotates 180 degrees; this is also the default with no bracket at all.</li><li><code>rot270</code>: inside rotate&#39;s own bracket, rotates 270 degrees clockwise (90 degrees counter-clockwise).</li><li><code>selNone</code>: inside select&#39;s own bracket, prevents text selection.</li><li><code>selText</code>: inside select&#39;s own bracket, enables text selection.</li><li><code>taLeft</code>: inside textAlign&#39;s own bracket, aligns text to the start of the line.</li><li><code>taCenter</code>: inside textAlign&#39;s own bracket, centers text.</li><li><code>taRight</code>: inside textAlign&#39;s own bracket, aligns text to the end of the line.</li><li><code>taJustify</code>: inside textAlign&#39;s own bracket, stretches text to fill each full line.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>flex</code>: provides the flex layout; direction and spacing are flags in its bracket.</li><li><code>box</code>: makes demonstration cells visible.</li><li><code>background</code>: applies the semantic info color as the background here.</li><li><code>border</code>: applies the semantic info color as the border color here.</li><li><code>textColor</code>: applies the semantic info color to text here.</li><li><code>flexChild</code>: sizes or orders one item inside a flex (or grid) container, the option in its bracket picking how.</li><li><code>focusRing</code>: shows the shared focus ring when keyboard focus is visible.</li><li><code>motionReduce</code>: removes non-essential animation and transitions when reduced motion is preferred.</li><li><code>skipLink</code>: creates a link that is revealed only when keyboard-focused.</li><li><code>visuallyHidden</code>: hides content visually while keeping it available to assistive technology.</li><li><code>visuallyHiddenFocusable</code>: hides content until it or one of its children receives focus.</li><li><code>icon</code>: draws the glyph rotated by the example; see Icon for the whole set.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>bgInfo</code>: inside background&#39;s own bracket, applies the semantic info color.</li><li><code>brInfo</code>: inside border&#39;s own bracket, applies the semantic info color.</li><li><code>txtInfo</code>: inside textColor&#39;s own bracket, applies the semantic info color.</li><li><code>column</code>: stacks demonstration groups vertically.</li><li><code>flex1</code>: inside flexChild&#39;s own bracket, lets a flex item grow and shrink to occupy available space.</li><li><code>flexNone</code>: inside flexChild&#39;s own bracket, prevents a flex item from growing or shrinking.</li><li><code>flexOrderFirst</code>: inside flexChild&#39;s own bracket, places a flex item before its siblings.</li><li><code>flexOrderLast</code>: inside flexChild&#39;s own bracket, places a flex item after its siblings.</li><li><code>row</code>: arranges demonstration items in a row.</li><li><code>gapSections</code>: separates the demonstration sections.</li><li><code>gapTexts</code>: separates items within each demonstration group.</li><li><code>wrap</code>: allows the layout examples to wrap onto multiple rows.</li><li><code>flexCenter</code>: centers items on both axes in a flex container.</li><li><code>inlineFlex</code>: displays a flex container inline.</li><li><code>icon-chevronDown</code>: the glyph rotated in the example, standing in for any icon that needs to point another way.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">Other</h5><ul pgs="flex['column' 'gapTexts']"><li><code>container</code>: establishes an inline-size container; see Breakpoints for hide&#39;s containerDown* and containerUp* options measured against it.</li></ul></div></div></div></div><div pgs="container flex['column' 'gapElements']"><a pgs="skipLink" href="#utility-content">Skip to utility examples</a>
