<ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>sctFull</code>: inside section&#39;s own bracket, identifies a section that spans the full available width.</li><li><code>sctSpecificity</code>: inside section&#39;s own bracket, identifies a section that applies a specific structure to its child.</li><li><code>sctMax</code>: inside section&#39;s own bracket, identifies a section with an extended maximum width.</li><li><code>sctNoPadding</code>: inside section&#39;s own bracket, identifies a section without standard padding.</li><li><code>sctEdgeLeft</code>: inside section&#39;s own bracket, identifies a full-width section whose content starts where the text of a centred section starts on the left and runs on past it to the right, keeping only the page padding there. The left offset is --page-edge, which never falls below --page-padding, so the content keeps its breathing room once the column no longer fits.</li><li><code>sctEdgeRight</code>: inside section&#39;s own bracket, the mirror of sctEdgeLeft: the content ends where the page column ends on the right and runs on past it to the left.</li><li><code>sctEdgeFlushLeft</code>: inside section&#39;s own bracket, lines the content up with the outer edge of a centred section on the left, one page padding further out than sctEdgeLeft, through --page-edgeFlush, which is allowed to fall to zero: once the section box no longer fits, the content runs flush to the left edge of the screen. The right side carries no padding at all, so the row bleeds off that edge instead of stopping short of it, which is what a carousel or a full-width image wants.</li><li><code>sctEdgeFlushRight</code>: inside section&#39;s own bracket, the mirror of sctEdgeFlushLeft, lined up on the right and bleeding off the left edge.</li><li><code>sctRemoveGap</code>: inside section&#39;s own bracket, pulls the section into the shared gap above and below it, negating half of --gap-sections on each side; combines with any variant above.</li><li><code>sctRemoveGapTop</code>: inside section&#39;s own bracket, the same pull on the top edge only.</li><li><code>sctRemoveGapBottom</code>: inside section&#39;s own bracket, the same pull on the bottom edge only.</li><li><code>cntNone</code>: inside container&#39;s own bracket, cancels it on the same element, so it stops acting as a query container and the nearest marked ancestor is measured instead.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>flex</code>: provides the flex layout; direction and spacing are flags in its bracket.</li><li><code>card-img</code>: reuses card image treatment in the demonstration sections.</li><li><code>img</code>: scales images to the section width.</li><li><code>hide</code>: hides its element while carrying a breakpoint option in its bracket; see Breakpoints for the whole family.</li><li><code>box</code>: makes the container example visible as a surface.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>column</code>: vertically organizes sections and inner content.</li><li><code>row</code>: places the text and the image of an edge section side by side.</li><li><code>gapElements</code>: applies element spacing inside each section.</li><li><code>imgCover</code>: inside img&#39;s own bracket, crops the image to fill its box.</li><li><code>hideContainerDownTablet</code>: inside hide&#39;s own bracket, hides its element while the surrounding container is at most 800px wide.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">Other</h5><ul pgs="flex['column' 'gapTexts']"><li><code>gapSections</code>: applies section spacing to the outer collection.</li></ul></div></div></div><div class="demoContent-doc-cssVariables" pgs="accordion"><h4 pgs="accordion-button">CSS Variables</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>--section-margin-block</code></li><li><code>--section-marginBase</code></li><li><code>--section-parentGap</code></li><li><code>--section-width</code></li></ul></div></div><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h2 class="demoContent-heading demoContent-heading-h2">Examples</h2></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Standard section</h3><p>Default section width and padding with centered content.</p></div><div pgs="container flex['column' 'gapElements']"><section>

&lt;/div&gt;</code></pre></div></div></div></div><div id="layout-footer" pgs="pageNav-panels-content"><section class="demoContent" data-reference="layout/footer.html" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h1 class="demoContent-heading demoContent-heading-h1">Footer</h1><p>Complete footer with theme control, brand area, navigation, informational content, and a link to cookie preferences.</p></div><div class="demoContent-doc" pgs="box accordionContainer" style="padding:10px;"><div pgs="accordion['accAutoOpen']"><h4 pgs="accordion-button">PGS</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>footer</code>: identifies the main footer container.</li><li><code>footer-top</code>: identifies the upper section containing the brand and content.</li><li><code>footer-top-content</code>: identifies the responsive inner layout of the upper section.</li><li><code>footer-brand</code>: identifies the group dedicated to the brand.</li><li><code>footer-brand-motto</code>: identifies the descriptive text associated with the brand.</li><li><code>footer-content</code>: identifies an informational footer column.</li><li><code>footer-legal</code>: identifies the lower section dedicated to legal information.</li><li><code>footer-legal-content</code>: identifies the content of the legal section.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>flex</code>: provides the flex layout; direction and spacing are flags in its bracket.</li><li><code>button</code>: presents theme and cookie preference controls as buttons.</li><li><code>toggleDarkmode</code>: connects the control to the global light or dark theme handler.</li><li><code>section</code>: applies the shared section structure to the upper and legal areas.</li><li><code>logo</code>: inserts the brand into the footer.</li><li><code>logo-text</code>: uses the text variant of the logo.</li><li><code>cookieConsent-actionOpen</code>: opens the Cookie Consent preference panel.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>tglLabelled</code>: labels that control with the theme the click leads to; see Darkmode.</li><li><code>row</code>: distributes the upper columns responsively.</li><li><code>column-3</code>: configures the footer flex layout with three columns.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">Other</h5><ul pgs="flex['column' 'gapTexts']"><li><code>icon</code>: draws the glyphs this example shows; see Icon for the whole set.</li></ul></div></div></div><div class="demoContent-doc-cssVariables" pgs="accordion"><h4 pgs="accordion-button">CSS Variables</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>--footer-background</code></li><li><code>--footer-color</code></li><li><code>--footer-colorScheme</code></li></ul></div></div><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h2 class="demoContent-heading demoContent-heading-h2">Examples</h2></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Footer</h3><p>Brand and navigation columns in the upper section, legal links and cookie preferences in the lower one.</p></div><div pgs="container flex['column' 'gapElements']"><section>

</section></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;footer pgs=&quot;footer&quot;&gt;

    &lt;section pgs=&quot;footer-top section&quot;&gt;

                    &lt;span pgs=&quot;logo-text&quot;&gt;MyPGS&lt;/span&gt;
                &lt;/a&gt;

                &lt;button pgs=&quot;button toggleDarkmode[&#39;tglLabelled&#39;]&quot; type=&quot;button&quot; aria-label=&quot;Change theme&quot;&gt;

    &lt;section pgs=&quot;footer-legal section&quot;&gt;

            &lt;button type=&quot;button&quot; pgs=&quot;button cookieConsent-actionOpen&quot;&gt;Cookie preferences&lt;/button&gt;
            &lt;a href=&quot;&quot;&gt;Privacy Policy&lt;/a&gt;
            &lt;a href=&quot;&quot;&gt;Cookie Policy&lt;/a&gt;
            &lt;a href=&quot;&quot;&gt;Termini e Condizioni&lt;/a&gt;
            &lt;p&gt;© 2026 MyPgs. No rights reserved.&lt;/p&gt;
        &lt;/div&gt;
    &lt;/section&gt;
&lt;/footer&gt;</code></pre></div></div></section></div><div id="helper-pgs" pgs="pageNav-panels-content"><section class="demoContent" data-reference="helper/pgs.html" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h1 class="demoContent-heading demoContent-heading-h1">PGS</h1><p>The `pgs(root)` function is how every component finds and edits its own markup: it wraps a Document or Element and returns read/write helpers for the pgs, pgs-data and pgs-state attributes, so nothing in the library — or in your own code — needs to hand-write an attribute selector. querySelector/querySelectorAll work on a Document too; every other method needs an Element and throws otherwise.</p></div><div class="demoContent-doc" pgs="box accordionContainer" style="padding:10px;"><div pgs="accordion"><h4 pgs="accordion-button">API</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>instance.querySelector(token)</code>: returns the first descendant carrying the given pgs token; also accepts an array or a comma-separated list of tokens.</li><li><code>instance.querySelectorAll(token)</code>: returns every matching descendant.</li><li><code>instance.closest(token)</code>: returns the nearest ancestor carrying the given pgs token, the element itself included, or null; also accepts an array or a comma-separated list of tokens.</li><li><code>instance.add(...tokens)</code>: adds one or more pgs tokens without duplicating existing ones and returns the instance.</li><li><code>instance.remove(...tokens)</code>: removes the given pgs tokens and returns the instance.</li><li><code>instance.toggle(token, force)</code>: flips the token, or forces it on/off when force is passed, and returns the resulting boolean state.</li><li><code>instance.contains(token)</code>: checks whether the component token is present, including its bracket form; contains(&quot;button&quot;) also matches button[&#39;btnMini&#39;].</li><li><code>instance.state.add(...states)</code>: adds one or more pgs-state values.</li><li><code>instance.state.remove(...states)</code>: removes the given pgs-state values.</li><li><code>instance.state.toggle(state, force)</code>: flips or forces a pgs-state value and returns the result.</li><li><code>instance.state.contains(state)</code>: checks whether a pgs-state value is present.</li><li><code>instance.state.querySelector(state)</code>: returns the first descendant carrying the given pgs-state value; also accepts an array or a comma-separated list.</li><li><code>instance.state.querySelectorAll(state)</code>: returns every matching descendant.</li><li><code>instance.state.closest(state)</code>: returns the nearest ancestor carrying the given pgs-state value, the element itself included, or null.</li><li><code>instance.option.add(...flags)</code>: adds a CSS or JavaScript-only boolean flag. add() derives the owner from the flag&#39;s own prefix, the lowercase run before the first uppercase letter or a -, and merges into that component&#39;s bracket only when the prefix is the component&#39;s full name (the icon-* glyphs, and card*, box*, badge*, menu*, logo*, slides*, header* flags such as cardMini, badgeDot, menuVertical); otherwise the flag becomes its own bare pgs token. Every flag with an abbreviated prefix falls in that second group — btn*, mrg*, pad*, brd*, sct*, acc*, drp*, shell*, tgl*, ... — since btn or acc is not the component&#39;s own name, so add() cannot derive button or accordion from it. To add a shortened flag into its bracket, call the base pgs(el).add(&quot;component[&#39;flag&#39;]&quot;) directly, naming the component. Never touches pgs-data.</li><li><code>instance.option.remove(...keys)</code>: removes a flag by key, bare or nested in a bracket, preserving the rest. Never touches pgs-data.</li><li><code>instance.option.toggle(key, force)</code>: flips or forces a flag and returns the resulting boolean state. Never touches pgs-data.</li><li><code>instance.option.contains(key)</code>: checks whether a flag is present, bare or nested in a bracket. Never checks pgs-data.</li><li><code>instance.option.querySelector(key)</code>: returns the first descendant carrying that flag; also accepts an array or a comma-separated list of keys.</li><li><code>instance.option.querySelectorAll(key)</code>: returns every matching descendant, as an Array rather than a NodeList, since the keys are matched here and not by the selector engine.</li><li><code>instance.option.closest(key)</code>: returns the nearest ancestor carrying that flag, the element itself included, or null.</li><li><code>instance.data.getValueBrackets(key)</code>: returns the payload inside a key[payload] pgs-data entry, or undefined. Never checks the pgs bracket.</li><li><code>instance.data.setValueBrackets(key, value)</code>: sets or replaces a single parameterized pgs-data entry. Never touches the pgs bracket.</li><li><code>pgs.registerModules(modules)</code>: exposes an object of named modules directly as properties of pgs, refusing to silently overwrite one already registered.</li><li><code>pgs.import(...names)</code>: returns the requested modules from the advanced import registry, throwing for any name not registered there.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>button</code>: borrowed purely to illustrate adding an abbreviated flag through the base add(); belongs to the button component.</li><li><code>hoverNot</code>: has no single owning component, so it is the example for option.add&#39;s bare-token fallback; belongs to the hover opt-out.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>btnMini</code>: a button flag whose btn prefix is an abbreviation, so option.add cannot derive button from it; belongs to the button component.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">Other</h5><ul pgs="flex['column' 'gapTexts']"><li><code>icon</code>: borrowed purely to illustrate option.add&#39;s owner derivation still working for a flag that kept its prefix; belongs to the icon component.</li><li><code>icon-moon</code>: one of the icon-* glyphs, which all keep their prefix so option.add can still derive &quot;icon&quot; from the name alone; belongs to the icon component.</li><li><code>box</code>: borrowed to show the same derivation working for boxMini, a flag renamed to keep its own prefix once button/card/box all needed a &#39;mini&#39; of their own; belongs to the box component.</li><li><code>boxMini</code>: the box flag itself, derived by option.add the same way as icon-moon.</li><li><code>headerCompactFrom</code>: borrowed purely to illustrate data.getValueBrackets/setValueBrackets; belongs to the header component.</li></ul></div></div></div></div><div class="exampleSource" data-kind="js"><strong class="exampleSource-title">JavaScript Usage</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-js">const instance = pgs(element); // any Element, or a Document for querySelector(All) only

instance.contains(&quot;modal&quot;);
instance.closest(&quot;accordionContainer&quot;);
instance.add(&quot;custom-token&quot;);
instance.remove(&quot;custom-token&quot;);
instance.toggle(&quot;custom-token&quot;, true);

instance.state.add(&quot;open&quot;);
instance.state.toggle(&quot;open&quot;, false);
instance.state.contains(&quot;open&quot;);
instance.state.closest(&quot;errorField&quot;);
instance.state.querySelectorAll(&quot;errorField&quot;);

instance.add(&quot;button[&#39;btnMini&#39;]&quot;); // btn is an abbreviation, not the component&#39;s name: name the component
instance.option.contains(&quot;btnMini&quot;);
instance.option.closest(&quot;btnMini&quot;);
instance.add(&quot;icon&quot;);
instance.option.add(&quot;icon-moon&quot;); // icon-moon kept its prefix, so this still derives &quot;icon&quot; and merges
instance.option.add(&quot;boxMini&quot;); // boxMini kept its prefix too (a handful of flags do, to stay unique across components), so this derives &quot;box&quot; the same way
instance.option.add(&quot;hoverNot&quot;); // no &quot;hover&quot; token present to merge into: lands bare, pgs=&quot;button[&#39;btnMini&#39;] hoverNot&quot;
instance.data.getValueBrackets(&quot;headerCompactFrom&quot;); // pgs-data only, never the pgs bracket
instance.data.setValueBrackets(&quot;headerCompactFrom&quot;, &quot;600&quot;);
// tabsHistory has no owner to derive and never belongs in the pgs bracket, so its bare form goes
// through data.value directly — .data has no contains/add/remove/toggle of its own
instance.data.value = &quot;tabsHistory&quot;;
const savedData = instance.data.value;
instance.data.value = savedData;

// available on a Document too
pgs(document).querySelector(&quot;box&quot;);
pgs(document).querySelectorAll(&quot;box&quot;);</code></pre></div></section></div><div id="helper-init" pgs="pageNav-panels-content"><section class="demoContent" data-reference="helper/init.html" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h1 class="demoContent-heading demoContent-heading-h1">Init</h1><p>Every component initializes itself on page load. pgs.init(root) re-runs that same initialization for whatever a Document or Element received later — markup inserted from an AJAX response, rendered by React or Vue, or built by hand with a template string — since none of that existed yet for the automatic pass to find.</p></div><div class="demoContent-doc" pgs="box accordionContainer" style="padding:10px;"><div pgs="accordion"><h4 pgs="accordion-button">API</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>pgs.init(root)</code>: finds every registered module that exposes init(root) and runs it again against the given Document or Element; already-initialized markup inside it is left untouched.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>flex</code>: provides the flex layout; direction and spacing are flags in its bracket.</li><li><code>button</code>: styles the trigger that inserts the new markup.</li><li><code>dropdown</code>: uses the related dropdown component or utility in this example.</li><li><code>dropdown-button</code>: uses the related dropdown-button component or utility in this example.</li><li><code>dropdown-content</code>: uses the related dropdown-content component or utility in this example.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>column</code>: stacks the trigger and the target vertically in this example.</li><li><code>gapElements</code>: spaces them apart.</li></ul></div></div></div></div><div pgs="container flex['column' 'gapElements']"><div pgs="flex['column' 'gapElements']">
    <button pgs="button" id="pgsInit-add" type="button">Add dropdown</button>
    <div id="pgsInit-target"></div>
</div>

<script type="module">
    import { pgs } from "mypgs";

    document.getElementById("pgsInit-add").addEventListener("click", () => {
        const target = document.getElementById("pgsInit-target");

        target.innerHTML = `
            <span pgs="dropdown">
                <button pgs="dropdown-button button" type="button">Added dynamically</button>
                <div pgs="dropdown-content">This dropdown did not exist when the page loaded.</div>
            </span>
        `;

        // Without this call pgs.dropdown never saw the new markup, and it would stay inert.
        pgs.init(target);
    });
</script></div><div class="exampleSource" data-kind="html"><strong class="exampleSource-title">Example HTML</strong><button type="button" class="exampleSource-copy" aria-label="Copia il codice HTML"><i class="fa-solid fa-copy" aria-hidden="true"></i></button><pre><code class="language-markup">&lt;div pgs=&quot;flex[&#39;column&#39; &#39;gapElements&#39;]&quot;&gt;
    &lt;button pgs=&quot;button&quot; id=&quot;pgsInit-add&quot; type=&quot;button&quot;&gt;Add dropdown&lt;/button&gt;
    &lt;div id=&quot;pgsInit-target&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;script type=&quot;module&quot;&gt;
    import { pgs } from &quot;mypgs&quot;;

    document.getElementById(&quot;pgsInit-add&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        const target = document.getElementById(&quot;pgsInit-target&quot;);

        target.innerHTML = `
            &lt;span pgs=&quot;dropdown&quot;&gt;
                &lt;button pgs=&quot;dropdown-button button&quot; type=&quot;button&quot;&gt;Added dynamically&lt;/button&gt;
                &lt;div pgs=&quot;dropdown-content&quot;&gt;This dropdown did not exist when the page loaded.&lt;/div&gt;
            &lt;/span&gt;
        `;

        // Without this call pgs.dropdown never saw the new markup, and it would stay inert.
        pgs.init(target);
    });
&lt;/script&gt;</code></pre></div></section></div><div id="helper-formValidate" pgs="pageNav-panels-content"><section class="demoContent" data-reference="helper/formValidate.html" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h1 class="demoContent-heading demoContent-heading-h1">Form validate</h1><p>pgs.formValidate is the JavaScript side of Form: validates required fields, applies errorForm/errorField/success pgs-state, shows an alert or a toast, and lets you register custom rules and errors that only your backend knows about. See Form for the full markup and pgs-data reference; this page focuses on the constructor and its instance methods.</p></div><div class="demoContent-doc" pgs="box accordionContainer" style="padding:10px;"><div pgs="accordion"><h4 pgs="accordion-button">PGS generated by JavaScript</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>formValidate</code>: added to the form element by the constructor, which is why the example writes a bare form tag; it enables the validation-state styles.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">PGS States</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>errorForm</code>: applied to the form when validate() finds at least one invalid field.</li><li><code>errorField</code>: applied to each invalid field.</li><li><code>success</code>: applied to the form once validate() passes, replacing errorForm.</li></ul></div><div pgs="accordion"><h4 pgs="accordion-button">API</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>new pgs.formValidate(form, options)</code>: creates a utility associated directly with the form, adds novalidate, and completes missing form message options (formFieldErrorTitle, formFieldError, formFieldsError, formSuccessTitle, formSuccess) from options.message and then from library defaults; existing pgs-data values are preserved.</li><li><code>instance.validator(callback, eventName)</code>: intercepts the specified event, clears previous temporary field errors, validates the form, shows the success message, and invokes callback only when valid; eventName defaults to submit.</li><li><code>instance.validate()</code>: validates required fields, updates state attributes, and returns true or false.</li><li><code>instance.success(description, title)</code>: validates the form and shows a success alert or toast when there are no errors.</li><li><code>instance.addNewRule(rule)</code>: adds a function that returns one or more invalid fields; validate automatically marks each returned field as invalid.</li><li><code>instance.temporaryFieldError.set(field, options)</code>: registers a temporary field error and validates the form; options accepts title and message, or it can be the message string.</li><li><code>instance.temporaryFieldError.remove(field)</code>: removes a temporary error and its visual state from one field.</li><li><code>instance.temporaryFieldError.clear()</code>: removes all temporary field errors and their visual states.</li></ul></div><div class="demoContent-doc-related" pgs="accordion"><h4 pgs="accordion-button">Related elements</h4><div pgs="flex['column' 'gapTexts'] accordion-content" hidden><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS</h5><ul pgs="flex['column' 'gapTexts']"><li><code>form</code>: uses the related form component or utility in this example.</li><li><code>label</code>: uses the related label component or utility in this example.</li><li><code>input</code>: uses the related input component or utility in this example.</li><li><code>button</code>: uses the related button component or utility in this example.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>btnStrong</code>: applies stronger emphasis to the submit action.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Data</h5><ul pgs="flex['column' 'gapTexts']"><li><code>formFieldErrorTitle</code>: belongs to the Form component; sets the fallback error title used here.</li><li><code>formFieldError</code>: belongs to the Form component; sets the fallback error text used here.</li><li><code>formSuccessTitle</code>: belongs to the Form component; sets the success title used here.</li><li><code>formSuccess</code>: belongs to the Form component; sets the success text used here.</li><li><code>formMessage</code>: belongs to the Form component; the field-specific message the custom rule below rewrites.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">Other</h5><ul pgs="flex['column' 'gapTexts']"><li><code>formMessageTitle</code>: belongs to the Form component; the field-specific alert title.</li></ul></div></div></div><div class="demoContent-doc-cssVariables" pgs="accordion"><h4 pgs="accordion-button">CSS Variables</h4><ul pgs="flex['column' 'gapTexts'] accordion-content" hidden><li><code>--formValidate-outline</code></li></ul></div></div><div pgs="container flex['column' 'gapElements']"><form pgs="form" pgs-data="formFieldErrorTitle[Check the form] formFieldError[Complete this field] formSuccessTitle[Sent] formSuccess[Sent successfully]" action="#" method="post">
    <label>
        <span pgs="label">Username</span>
        <input pgs="input" pgs-data="formMessage[Choose a username]" type="text" name="username" required>
    </label>

    <button pgs="button['btnStrong']" type="submit">Submit</button>
</form>

<script type="module">
    import { pgs } from "mypgs";

    const form = pgs(document).querySelector("form");
    const username = form.querySelector('input[name="username"]');

    const formValidate = new pgs.formValidate(form, {
        typeNotice: "alert"
    });

    // A custom rule: reject a username your own logic decides is unavailable.
    formValidate.addNewRule(() => {
        if (username.value.toLowerCase() !== "admin") return null;

        pgs(username).data.setValueBrackets("formMessage", "That username is taken");
        return username;
    });

    formValidate.validator(event => {
        // Replace this with a request to your backend. Call formValidate.success()
        // yourself instead if you construct with { showSuccessOnValidate: false }.
        console.log(Object.fromEntries(new FormData(form)));
    });

    // Once the backend answers, report what only it could know:
    // formValidate.temporaryFieldError.set(username, { message: "This username is already registered" });

utility in this example.</li><li><code>card-content</code>: groups the textual content of each card.</li><li><code>img</code>: uses the related img component or utility in this example.</li></ul></div><div pgs="flex['column' 'gapTexts']"><h5 class="demoContent-doc-subheading">PGS Options (component brackets)</h5><ul pgs="flex['column' 'gapTexts']"><li><code>row</code>: lays the demo items out in a row.</li><li><code>gapTexts</code>: spaces them apart.</li><li><code>ovAutoX</code>: inside overflow&#39;s own bracket, adds scrolling only when content overflows, on the horizontal axis only.</li><li><code>nowrap</code>: keeps each row on one line so it actually overflows instead of wrapping.</li><li><code>imgCover</code>: inside img&#39;s own bracket, crops the image to fill its box.</li></ul></div></div></div></div><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h2 class="demoContent-heading demoContent-heading-h2">Examples</h2></div><div class="demo-item" pgs="flex['column' 'gapElements']"><div class="demoContent-heading" pgs="flex['column' 'gapTexts']"><h3 class="demoContent-heading demoContent-heading-h3">Any input device</h3><p>pgs.scrollHorizontal converts a mouse wheel, a trackpad, or a Magic Mouse alike.</p></div><div pgs="container flex['column' 'gapElements']"><div pgs="flex['row' 'gapTexts' 'nowrap'] overflow['ovAutoX']" id="pgsScrollDemo">
