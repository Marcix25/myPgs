<!-- Header and navSmart of every page: the header at the top, and the bar that floats at the bottom of
     the screen. A fragment, not a page: site/index.html names it with an include comment and
     scripts/build-site-static.js splices it in. Paths are relative to site/build/, where every
     generated page ends up. -->
<!-- = HEADER -->
<header pgs="header['headerCompactNotebook']">
    <div pgs="header-element blur">
        <div pgs="header-element-alwaysOn">
            <a aria-label="Logo" pgs="logo['logoDarkmode']" href="home.html">
                <img pgs="logo-image" src="../assets/img/logo.svg" alt="MyPGS">
            </a>
        </div>

        <div pgs="header-element-onlyFull hide['hideMediaDownPhablet']">
            <!--
            <form pgs="search" pgs-data="searchPlaceholder[Type a component name] searchNoResults[No component matches]" autocomplete="off" action="" method="get">
                <button pgs="button['btnIconOnly' 'btnTransparent']" type="submit" title="Search">
                    <i pgs="icon['icon-magnifyingGlass']"></i>
                </button>
                <input type="search" name="s" placeholder="Search" value="">
                <ul pgs="search-suggestions"></ul>
            </form>
            -->
            <nav pgs="menu['menuHorizontal']" aria-label="Main menu">
                <ul>
                    <li><a pgs="button['btnTransparent' 'btnForHeader' 'btnCurrent']" href="home.html"><i pgs="icon['icon-home']"></i> Home</a></li>
                    <li><a pgs="button['btnTransparent' 'btnForHeader' 'btnCurrent']" href="demo.html"><i pgs="icon['icon-sliders']"></i> Docs</a></li>
                    <li><a pgs="button['btnTransparent' 'btnForHeader' 'btnCurrent']" href="icons.html"><i pgs="icon['icon-star']"></i> Icons</a></li>
                </ul>
            </nav>
            <div pgs="flex['row' 'nowrap']">
                <button pgs="button['btnIconOnly' 'btnForHeader'] toggleDarkmode" type="button" aria-label="Change theme">
                    <i pgs="toggleDarkmode-light icon['icon-moon']" aria-hidden="true"></i>
                    <i pgs="toggleDarkmode-dark icon['icon-sun']" aria-hidden="true"></i>
                </button>
            </div>
        </div>

        <div pgs="header-element-onlyCompact hide['hideMediaDownPhablet']">
            <div pgs="flex['row' 'nowrap']">
                <button pgs="button['btnIconOnly' 'btnForHeader'] toggleDarkmode" type="button" aria-label="Change theme">
                    <i pgs="toggleDarkmode-light icon['icon-moon']" aria-hidden="true"></i>
                    <i pgs="toggleDarkmode-dark icon['icon-sun']" aria-hidden="true"></i>
                </button>
                <div pgs="modal['dialogRight' 'dialogSmall' 'dialogAnimationZoom']" pgs-data="modalContainerPGS[header]">
                    <button pgs="button['btnIconOnly' 'btnForHeader'] modal-button modal-close" type="button" title="menu">
                        <i pgs="icon['icon-hamburgerTwo']" aria-hidden="true"></i>
                    </button>

                    <dialog pgs="background['bgBackground']">
                        <div pgs="modal-dialog-content padding['pdUnset']">
                            <div pgs="modal-dialog-content-scroll">
                                <nav pgs="menu['menuVertical'] padding" aria-label="Main menu">
                                    <ul>
                                        <li><a pgs="button['btnTransparent' 'btnForHeader' 'btnCurrent'] paddingBlock" href="home.html">Home</a></li>
                                        <li><a pgs="button['btnTransparent' 'btnForHeader' 'btnCurrent'] paddingBlock" href="demo.html">Docs</a></li>
                                        <li><a pgs="button['btnTransparent' 'btnForHeader' 'btnCurrent'] paddingBlock" href="icons.html">Icons</a></li>
                                    </ul>
                                </nav>
                            </div>
                        </div>
                    </dialog>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- == NAV SMART (the bar that floats at the bottom of the screen; the link of the page you are on gets
     aria-current from site/assets/js/demo.js) -->
<header pgs="navSmart hide['hideMediaUpPhablet']">
    <div pgs="navSmart-element">
        <nav aria-label="Pages">
            <ul>
                <li><a pgs="button['btnForNavSmart']" href="home.html"><i pgs="icon['icon-home']"></i> Home</a></li>
                <li><a pgs="button['btnForNavSmart']" href="demo.html"><i pgs="icon['icon-sliders']"></i> Docs</a></li>
                <li><a pgs="button['btnForNavSmart']" href="icons.html"><i pgs="icon['icon-star']"></i> Icons</a></li>
            </ul>
        </nav>
    </div>
    <div pgs="navSmart-element">
        <button pgs="button['btnForNavSmart' 'btnIconOnly'] toggleDarkmode" type="button" aria-label="Change theme">
            <i pgs="toggleDarkmode-light icon['icon-moon']" aria-hidden="true"></i>
            <i pgs="toggleDarkmode-dark icon['icon-sun']" aria-hidden="true"></i>
        </button>
    </div>
</header>
