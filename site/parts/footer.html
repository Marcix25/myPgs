<!-- Footer of every page. A fragment, not a page: site/index.html names it with an include comment
     and scripts/build-site-static.js splices it in. Paths are relative to site/build/, where every
     generated page ends up. -->
<!-- = FOOTER -->
<footer pgs="footer">

    <section pgs="footer-top section">
        <div pgs="footer-top-content flex['row' 'column-3']">
            <div pgs="footer-brand">
                <a aria-label="Logo" pgs="logo['logoDarkmode']" href="home.html">
                    <img pgs="logo-image" src="../assets/img/logo.svg" alt="MyPGS">
                </a>
                <button pgs="button toggleDarkmode['tglLabeled']" type="button" aria-label="Change theme">
                    <i pgs="icon['icon-moon']"></i>
                </button>
            </div>

            <div pgs="footer-content">

            </div>
            <div pgs="footer-content">

            </div>
        </div>
    </section>

    <section pgs="footer-legal section">
        <div pgs="footer-legal-content">
            <a href="">Privacy Policy</a>
            <a href="">Cookie Policy</a>
            <a href="">Terms and Conditions</a>
            <p>© 2026 MyPGS. No rights reserved.</p>
        </div>
    </section>
</footer>
