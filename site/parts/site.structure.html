<!-- Site shell — doctype, head, header, footer; no page content of its own. Opening this file
     directly shows the header and footer around an empty middle. The
     id="reference-demo-content" placeholder between them is display: contents, so it adds no box
     of its own — it is where scripts/build-site-static.js splices in one page's own content, read
     from site/page/<name>.html, to produce site/build/<name>.html. Every generated page shares
     this one shell: edit this file for anything that should change on all of them (head, header,
     footer); add or edit a file under site/page/ for one page's own content. The asset paths
     below are written relative to site/build/ (where every generated page ends up, two levels
     down from the repo root), not relative to this file's own location in site/parts/. -->
<!DOCTYPE html>
<html lang="en" pgs="htmlBase">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPGS reference demo</title>
    <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
    <link rel="stylesheet" href="../../dist/css/index.css">
    <link rel="stylesheet" href="../assets/css/demo.css">
    <link rel="stylesheet" href="../assets/css/home.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- after the stylesheets so the browser starts fetching them first, and still synchronous:
         darkmode writes the theme on the html element before the first paint -->
    <script src="../../dist/javascript/index.js"></script>

    <!-- the reference examples import from "mypgs" like a real project; a browser cannot resolve a
         bare specifier on its own, so it is mapped to a module that re-exports the global the
         library already published. Must come before any type="module" script -->
    <script type="importmap">
        {
            "imports": {
                "mypgs": "../assets/js/mypgs-module.js"
            }
        }
    </script>
</head>

<body pgs="pageNav bodyBase bodyImg bodyText bodyHeading bodyHoverAuto">

    <!-- = HEADER -->
    <header pgs="header['compactBigTablet']">
        <div pgs="header-element blur">
            <div pgs="header-element-alwaysOn">
                <a aria-label="Logo" pgs="logo['darkmode']" href="home.html">
                    <img pgs="logo-image" src="../assets/img/logo.svg" alt="MyPGS">
                </a>
            </div>

            <div pgs="header-element-onlyFull">
                <nav pgs="menu['horizontal']" aria-label="Main menu">
                    <ul>
                        <li><a pgs="button['transparent' 'forHeader']" href="home.html">Home</a></li>
                        <li><a pgs="button['transparent' 'forHeader']" href="demo.html">Docs</a></li>
                        <li><a pgs="button['transparent' 'forHeader']" href="test.html">Test</a></li>
                    </ul>
                </nav>
                <div pgs="flex['row' 'nowrap']">
                    <button pgs="button['iconOnly'] toggleDarkmode" type="button" aria-label="Change theme">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                </div>
            </div>

            <div pgs="header-element-onlyCompact">
                <div pgs="flex['row' 'nowrap']">
                    <button pgs="button['iconOnly'] toggleDarkmode" type="button" aria-label="Change theme">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                    <div pgs="modal['dialogRight' 'dialogMedium']" pgs-data="modalContainerPGS[header]">
                        <button pgs="button['iconOnly'] modal-button modal-close" type="button" title="menu">
                            <i pgs="icon['icon-hamburgerTwo']" aria-hidden="true"></i>
                        </button>

                        <dialog>
                            <div pgs="modal-dialog-content">
                                <div pgs="modal-dialog-content-scroll margin['negative'] padding">
                                    <nav pgs="menu['vertical']" aria-label="Main menu">
                                        <ul>
                                            <li><a pgs="button['transparent' 'forHeader']" href="home.html">Home</a></li>
                                            <li><a pgs="button['transparent' 'forHeader']" href="demo.html">Docs</a></li>
                                            <li><a pgs="button['transparent' 'forHeader']" href="test.html">Test</a></li>
                                        </ul>
                                    </nav>
                                </div>
                            </div>
                        </dialog>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- = DEMO (filled in by scripts/build-site-static.js; see demo.structure.html) -->
    <div id="reference-demo-content" style="display: contents;"></div>

    <!-- = FOOTER -->
    <footer pgs="footer">

        <section pgs="footer-top section">
            <div pgs="footer-top-content flex['row' 'column-3']">
                <div pgs="footer-brand">
                    <a aria-label="Logo" pgs="logo['darkmode']" href="home.html">
                        <img pgs="logo-image" src="../assets/img/logo.svg" alt="MyPGS">
                    </a>
                    <p pgs="footer-brand-motto">Reusable frontend components.</p>
                    <button pgs="button toggleDarkmode['labelled']" type="button" aria-label="Change theme">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                </div>

                <div pgs="footer-content">

                </div>
                <div pgs="footer-content">

                </div>
            </div>
        </section>

        <section pgs="footer-legal section">
            <div pgs="footer-legal-content">
                <button type="button" pgs="button cookieConsent-actionOpen">Cookie preferences</button>
                <a href="">Privacy Policy</a>
                <a href="">Cookie Policy</a>
                <a href="">Termini e Condizioni</a>
                <p>© 2026 MyPgs. No rights reserved.</p>
            </div>
        </section>
    </footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
</body>

</html>
