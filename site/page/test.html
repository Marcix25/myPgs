<!-- = MAIN -->
<main pgs="main" style="--main-paddingTop: calc(var(--_header-height) + var(--page-padding));">

    <section pgs="section['sctMax'] flex['column' 'gapElements']">
        <!-- the theme switch with an icon of its own per theme: the star shows while the page is light, the heart while it is dark -->
        <button pgs="button['btnIconOnly'] toggleDarkmode" type="button" aria-label="Change theme">
            <i pgs="toggleDarkmode-light icon['icon-star']" aria-hidden="true"></i>
            <i pgs="toggleDarkmode-dark icon['icon-heart']" aria-hidden="true"></i>
        </button>
    </section>

</main>
